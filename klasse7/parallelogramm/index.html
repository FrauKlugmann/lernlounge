<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Das Parallelogramm – Interaktive Übungen</title>
<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  AUFGABENBLOCK – NUR AB HIER ÄNDERN                              ║
   ║  Alles unterhalb von „ENDE AUFGABENBLOCK“ ist der feste Motor.   ║
   ╚══════════════════════════════════════════════════════════════════╝
   Kurzschrift in Texten:
     [30]          Eingabefeld, Lösung 30 (Komma/Punkt egal)
     [0,5|,5]      mehrere richtige Antworten mit |
     {3/10}        Bruch;  {[30]/100}  Bruch mit Feld im Zähler
     [=7/100]      Bruch frei eingeben (jeder gleichwertige Bruch zählt)
     ((A|*B|C))    Auswahlknöpfe, * = richtig
     [G:40] [W:10] [P:25 %]   Zahl zum Markieren (nur Art "markieren")
     **fett**   <blau>…</blau>  <orange>…</orange>  <gruen>…</gruen>
   Aufgabenarten: luecke, erweitern, hunderterfeld, faerben, tabelle,
     vergleichen, auswahl, markieren, streifen, verhaeltnis, zuordnen,
     richtigfalsch, sortieren, streifenbau, kreisbau   (jede kann zusätzlich bild:"<svg…>" haben)
*/
/* ─── Diagramm-Helfer (Teil des Motors, auch für feste Bilder in Aufgaben nutzbar) ─── */
const DFARBEN=["#F4B6B0","#B7DFB9","#FFE08A","#CDBBE8","#A9DDE6"];
const dEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dZ=x=>String(Math.round(x*10)/10).replace(".",",");
/* streifenSvg(namen, cm, {live, bis, texte}) – bis = Länge der Skala (Standard 10), texte = eigene Beschriftung je Teil */
function streifenSvg(namen,cm,opt){
  opt=opt||{};const x0=10,y0=22,h=40,pc=50,bis=opt.bis||10;const B=565+(bis-10)*pc;
  let s='<svg viewBox="0 0 '+B+' 100" role="img" aria-label="Streifendiagramm" style="width:'+B+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  let x=0;
  cm.forEach((c,i)=>{c=Math.max(0,c);const w=Math.max(0,Math.min(c,bis-x))*pc;
    if(w>0){s+='<rect x="'+(x0+x*pc)+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      const n=(opt.texte?opt.texte[i]:namen[i])||"";if(n&&w>=n.length*7+8)s+='<text x="'+(x0+x*pc+w/2)+'" y="'+(y0+h/2+5)+'" text-anchor="middle" font-size="13">'+dEsc(n)+'</text>';}
    x=Math.min(bis,x+c);});
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+10*pc+'" height="'+h+'" fill="none" stroke="#000" stroke-width="2"/>';
  for(let k=0;k<=bis;k++)s+='<line x1="'+(x0+k*pc)+'" y1="'+(y0+h)+'" x2="'+(x0+k*pc)+'" y2="'+(y0+h+8)+'" stroke="#000" stroke-width="1.5"/><text x="'+(x0+k*pc)+'" y="'+(y0+h+23)+'" text-anchor="middle" font-size="13">'+k+'</text>';
  s+='<text x="'+(x0+bis*pc+20)+'" y="'+(y0+h+23)+'" font-size="13">cm</text>';
  const sum=cm.reduce((a,b)=>a+Math.max(0,b),0);
  if(opt.live&&sum>10.0001)s+='<text x="10" y="12" font-size="13" fill="#C62828" font-weight="700">Zu lang! Der Streifen ist nur 10 cm lang.</text>';
  return s+'</svg>';
}
/* kreisSvg(namen, grad, {winkel:false, texte}) – texte = eigene Beschriftung je Teil */
function kreisSvg(namen,grad,opt){
  opt=opt||{};const cx=225,cy=125,r=100;const P=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  let s='<svg viewBox="0 0 450 250" role="img" aria-label="Kreisdiagramm" style="width:450px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#000" stroke-width="2"/>';
  let a=0;const lab=[];
  grad.forEach((g,i)=>{g=Math.max(0,g);const b=Math.min(360,a+g);
    if(b-a>0.0001){
      if(b-a>=359.999)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      else{const p1=P(a),p2=P(b);s+='<path d="M'+cx+' '+cy+' L'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' A'+r+' '+r+' 0 '+((b-a)>180?1:0)+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+' Z" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';}
      lab.push([i,(a+b)/2,b-a]);}
    a=b;});
  lab.forEach(([i,m,w])=>{const sn=Math.sin(m*Math.PI/180),cs=Math.cos(m*Math.PI/180);const px=cx+(r+10)*sn,py=cy-(r+10)*cs;
    const an=sn>0.15?"start":sn<-0.15?"end":"middle";const dy=cs>0.9?-3:cs<-0.9?14:4;
    const t=opt.texte?opt.texte[i]:(namen[i]||"")+(opt.winkel===false?"":" · "+dZ(grad[i])+"°");
    s+='<text x="'+px.toFixed(1)+'" y="'+(py+dy).toFixed(1)+'" text-anchor="'+an+'" font-size="13">'+dEsc(t)+'</text>';});
  return s+'</svg>';
}

function karte(kopf,titel,preis,zeilen){return '<div class="shop"><div class="shop-kopf">'+kopf+'</div><div class="shop-innen"><b>'+titel+'</b><br><span class="preis">'+preis+'</span><p class="shop-det">'+zeilen.join("<br>")+'</p></div></div>';}
/* ─── Zusatz-Helfer Parallelogramm (Woche 2) ─── */
const PF={rand:"#000",flaeche:"#CCF1EC",dreieck:"#FFE08A",hoehe:"#d9472b",grund:"#14b8a6",schueler:"#1565C0",gitter:"#d6d6d6"};
const ein=d=>{const l=Math.hypot(d[0],d[1])||1;return [d[0]/l,d[1]/l];};
const pkt=p=>p[0].toFixed(1)+" "+p[1].toFixed(1);
/* rechter Winkel als runder Bogen mit Punkt, beliebig gedreht (P = Scheitel, u, v = Richtungen der Schenkel) */
function rwB(P,u,v,r){r=r||12;u=ein(u);v=ein(v);
  const p1=[P[0]+u[0]*r,P[1]+u[1]*r],p2=[P[0]+v[0]*r,P[1]+v[1]*r],sw=(u[0]*v[1]-u[1]*v[0])>0?1:0;
  const m=[P[0]+(u[0]+v[0])*r*0.42,P[1]+(u[1]+v[1])*r*0.42];
  return '<path d="M'+pkt(p1)+' A'+r+' '+r+' 0 0 '+sw+' '+pkt(p2)+'" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="'+m[0].toFixed(1)+'" cy="'+m[1].toFixed(1)+'" r="1.8" fill="#000"/>';}
/* Winkelbogen mit Gradzahl im Bogen */
function wB(P,u,v,r,txt){u=ein(u);v=ein(v);const p1=[P[0]+u[0]*r,P[1]+u[1]*r],p2=[P[0]+v[0]*r,P[1]+v[1]*r],sw=(u[0]*v[1]-u[1]*v[0])>0?1:0;
  const b=ein([u[0]+v[0],u[1]+v[1]]),t=[P[0]+b[0]*r*0.62,P[1]+b[1]*r*0.62+4];
  return '<path d="M'+pkt(p1)+' A'+r+' '+r+' 0 0 '+sw+' '+pkt(p2)+'" fill="none" stroke="#000" stroke-width="1.3"/><text x="'+t[0].toFixed(1)+'" y="'+t[1].toFixed(1)+'" text-anchor="middle" font-size="12" font-family="Arial">'+txt+'</text>';}
/* zwei Striche für gleich lange Seiten */
function strich2(P,Q){const m=[(P[0]+Q[0])/2,(P[1]+Q[1])/2],d=ein([Q[0]-P[0],Q[1]-P[1]]),n=[-d[1],d[0]];let s="";
  [-3,3].forEach(o=>{const c=[m[0]+d[0]*o,m[1]+d[1]*o];s+='<line x1="'+(c[0]-n[0]*6).toFixed(1)+'" y1="'+(c[1]-n[1]*6).toFixed(1)+'" x2="'+(c[0]+n[0]*6).toFixed(1)+'" y2="'+(c[1]+n[1]*6).toFixed(1)+'" stroke="#000" stroke-width="1.6"/>';});return s;}
function T(x,y,t,o){o=o||{};return '<text x="'+(+x).toFixed(1)+'" y="'+(+y).toFixed(1)+'" font-family="Arial" font-size="'+(o.fs||16)+'" text-anchor="'+(o.anc||"middle")+'"'+(o.it?' font-style="italic"':'')+(o.fill?' fill="'+o.fill+'"':'')+(o.b?' font-weight="bold"':'')+'>'+t+'</text>';}
function poly(P,o){o=o||{};return '<polygon points="'+P.map(pkt).join(" ")+'" fill="'+(o.fill||"#fff")+'" stroke="'+(o.st||"#000")+'" stroke-width="'+(o.sw||2)+'" stroke-linejoin="round"/>';}
function lin(P,Q,o){o=o||{};return '<line x1="'+P[0].toFixed(1)+'" y1="'+P[1].toFixed(1)+'" x2="'+Q[0].toFixed(1)+'" y2="'+Q[1].toFixed(1)+'" stroke="'+(o.st||"#000")+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' stroke-linecap="round"/>';}
function gitterSvg(x0,y0,nx,ny,s){let g="";for(let i=0;i<=nx;i++)g+=lin([x0+i*s,y0],[x0+i*s,y0+ny*s],{st:PF.gitter,sw:1});
  for(let j=0;j<=ny;j++)g+=lin([x0,y0+j*s],[x0+nx*s,y0+j*s],{st:PF.gitter,sw:1});return g;}
/* Eckpunkte beschriften: nach außen vom Mittelpunkt weg */
function ecken(P,namen){const m=[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
  return P.map((p,i)=>{const d=ein([p[0]-m[0],p[1]-m[1]]);return T(p[0]+d[0]*16,p[1]+d[1]*16+6,namen[i],{fs:16,b:true});}).join("");}

/* Standardbild: Parallelogramm mit Grundseite g, Höhe h (rot, gestrichelt) und optional schräger Seite s */
function parSvg(o){o=o||{};const A=[40,130],B=[220,130],C=[280,40],D=[100,40],F=[100,130];
  let s='<svg viewBox="0 0 320 170" width="320" role="img" aria-label="Parallelogramm mit Grundseite und Höhe">'+poly([A,B,C,D]);
  s+=lin(D,F,{st:PF.hoehe,sw:2.4,dash:"6 4"})+rwB(F,[0,-1],[1,0],12);
  s+=T((A[0]+B[0])/2,A[1]+26,o.g||"g",{it:true})+T(F[0]+8,85,o.h||"h",{it:true,anc:"start",fill:PF.hoehe});
  if(o.s)s+=T((A[0]+D[0])/2-12,(A[1]+D[1])/2+4,o.s,{it:true,anc:"end"});
  return s+'</svg>';}

/* ═══ Entdecker Z1: Rechteck, Parallelogramm, Raute, Quadrat ═══ */
const ENT_P='<div class="ent"><div class="regler"><label>Winkel bei A = <b class="ww">60</b>°<input type="range" class="rw" min="30" max="90" step="5" value="60" aria-label="Winkel bei A"></label>'+
 '<label>Seite b = <b class="wb">3</b> cm<input type="range" class="rb" min="2" max="7" step="1" value="3" aria-label="Seite b"></label><p class="klein">Die Seite a ist immer 5 cm lang.</p></div>'+
 '<div class="entbild"></div><div class="entwerte"><p class="pname" style="font-size:1.3em"></p><p class="pauch klein"></p></div></div>';
function initEntP(K){const rw=K.querySelector(".rw"),rb=K.querySelector(".rb"),bild=K.querySelector(".entbild");
  const z=()=>{const w=+rw.value,b=+rb.value,a=5,s=30,A=[40,250],r=w*Math.PI/180;
    const B=[A[0]+a*s,A[1]],D=[A[0]+b*s*Math.cos(r),A[1]-b*s*Math.sin(r)],C=[B[0]+D[0]-A[0],B[1]+D[1]-A[1]];
    let g='<svg viewBox="0 0 420 290" width="420" role="img" aria-label="Viereck">'+poly([A,B,C,D],{fill:PF.flaeche});
    if(w===90){g+=rwB(A,[1,0],[D[0]-A[0],D[1]-A[1]])+rwB(B,[-1,0],[C[0]-B[0],C[1]-B[1]])+rwB(C,[B[0]-C[0],B[1]-C[1]],[-1,0])+rwB(D,[1,0],[A[0]-D[0],A[1]-D[1]]);}
    else g+=wB(A,[1,0],[D[0]-A[0],D[1]-A[1]],42,w+"°");
    if(a===b)g+=strich2(A,B)+strich2(B,C)+strich2(C,D)+strich2(D,A);
    g+=ecken([A,B,C,D],["A","B","C","D"])+T((A[0]+B[0])/2,A[1]+30,"a = 5 cm",{it:true})+T((A[0]+D[0])/2-14,(A[1]+D[1])/2,"b",{it:true,anc:"end"});
    bild.innerHTML=g+'</svg>';
    K.querySelector(".ww").textContent=w;K.querySelector(".wb").textContent=b;
    let n,auch;if(w===90&&a===b){n="Quadrat";auch="Ein Quadrat ist auch ein Rechteck, eine Raute und ein Parallelogramm.";}
    else if(w===90){n="Rechteck";auch="Ein Rechteck ist auch ein Parallelogramm.";}
    else if(a===b){n="Raute";auch="Eine Raute ist auch ein Parallelogramm.";}
    else{n="Parallelogramm";auch="Gegenüberliegende Seiten sind parallel und gleich lang.";}
    K.querySelector(".pname").innerHTML="Das ist ein <b>"+n+"</b>.";K.querySelector(".pauch").textContent=auch;};
  rw.addEventListener("input",z);rb.addEventListener("input",z);z();}

/* ═══ Figuren sortieren: antippen → ja → nein → leer ═══ */
const FIGUREN=[
  {p:[[0,0],[5,0],[7,3],[2,3]],ja:true},
  {p:[[0,0],[6,0],[4.5,3],[1.5,3]],ja:false},
  {p:[[0,0],[6,0],[6,3.4],[0,3.4]],ja:true,rw:true},
  {p:[[2,0],[4,3],[2,4.2],[0,3]],ja:false},
  {p:[[0,0],[4,0],[6.4,3.2],[2.4,3.2]],ja:true,gl:true},
  {p:[[2,0],[4,2],[2,4],[0,2]],ja:true,rw:true,gl:true},
  {p:[[0,0],[5,0.5],[4,3.5],[1,2.5]],ja:false},
  {p:[[0,0],[2.2,1.1],[2.2,5],[0,3.9]],ja:true},
  {p:[[0,0],[5,0],[3,3],[0,3]],ja:false,rwi:[0,3]}];
function figSvg(f){const xs=f.p.map(p=>p[0]),ys=f.p.map(p=>p[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);
  const k=Math.min(110/(Mx-mx),80/(My-my)),ox=10+(110-(Mx-mx)*k)/2,oy=8+(80-(My-my)*k)/2;
  const P=f.p.map(p=>[ox+(p[0]-mx)*k,oy+(My-p[1])*k]);let s='<svg viewBox="0 0 130 96" width="130" aria-hidden="true">'+poly(P,{fill:"#fff"});
  const ri=f.rw?[0,1,2,3]:(f.rwi||[]);ri.forEach(i=>{const p=P[i],v1=P[(i+1)%4],v0=P[(i+3)%4];s+=rwB(p,[v1[0]-p[0],v1[1]-p[1]],[v0[0]-p[0],v0[1]-p[1]],9);});
  if(f.gl)for(let i=0;i<4;i++)s+=strich2(P[i],P[(i+1)%4]);return s+'</svg>';}
function sortHtml(){return '<div class="fsgrid">'+FIGUREN.map((f,i)=>'<button type="button" class="fs epr" data-i="'+i+'" data-soll="'+(f.ja?"ja":"nein")+'" data-z=""><span class="fsnr">'+(i+1)+'</span>'+figSvg(f)+'<span class="fsz">?</span></button>').join("")+'</div>';}
function initSort(K){K.querySelectorAll(".fs").forEach(b=>{
  const zeig=()=>{const z=b.dataset.z;b.querySelector(".fsz").textContent=z===""?"?":(z==="ja"?"ja, Parallelogramm":"nein");b.classList.toggle("fsja",z==="ja");b.classList.toggle("fsnein",z==="nein");};
  b.addEventListener("click",()=>{const o=["","ja","nein"];b.dataset.z=o[(o.indexOf(b.dataset.z)+1)%3];b.classList.remove("ok","falsch");zeig();});
  b._pruef=()=>b.dataset.z===b.dataset.soll;zeig();});}

/* ═══ Höhe auf Karopapier einzeichnen: Fußpunkt auf einen Gitterpunkt tippen ═══
   p: Eckpunkte A,B,C,D in Kästchen (y nach oben), g: [i,j] Grundseite, v: Ecke, von der die Höhe ausgeht, f: richtiger Fußpunkt */
const HOEHEN={
  waag:{p:[[1,1],[7,1],[9,5],[3,5]],g:[0,1],v:3,f:[3,1],text:"Zeichne die Höhe von D auf die Grundseite g = AB."},
  senk:{p:[[1,1],[5,3],[5,7],[1,5]],g:[1,2],v:3,f:[5,5],text:"Das Parallelogramm steht anders. Zeichne die Höhe von D auf die Grundseite g = BC."},
  schraeg:{p:[[1,1],[5,1],[8,4],[4,4]],g:[1,2],v:3,f:[6,2],text:"Zeichne die Höhe von D auf die Grundseite g = BC."},
  aussen1:{p:[[1,1],[4,1],[9,5],[6,5]],g:[0,1],v:3,f:[6,1],aussen:true,text:"Zeichne die Höhe von D auf die Grundseite g = AB."},
  aussen2:{p:[[1,4],[7,4],[10,7],[4,7]],g:[1,2],v:0,f:[4,1],aussen:true,text:"Zeichne die Höhe von A auf die Grundseite g = BC."}};
function hoeheHtml(keys){return keys.map((k,i)=>'<div class="hgbox"><p class="sit"><b>'+"abcdef"[i]+')</b> '+HOEHEN[k].text+'</p><div class="hg epr" data-k="'+k+'"></div></div>').join("");}
function initHoehe(K){K.querySelectorAll(".hg").forEach(el=>{const c=HOEHEN[el.dataset.k],s=28,N=["A","B","C","D"];
  const xs=c.p.map(p=>p[0]).concat(c.f[0]),ys=c.p.map(p=>p[1]).concat(c.f[1]);
  const nx=Math.max(...xs)+1,ny=Math.max(...ys)+1,x0=14,y0=14,W=x0*2+nx*s,H=y0*2+ny*s;
  const S=p=>[x0+p[0]*s,y0+(ny-p[1])*s];let tip=null,geloest=false;
  const male=()=>{const P=c.p.map(S),G1=P[c.g[0]],G2=P[c.g[1]],V=P[c.v];
    let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Parallelogramm auf Karopapier" style="touch-action:manipulation;cursor:crosshair">'+gitterSvg(x0,y0,nx,ny,s)+poly(P,{fill:"rgba(204,241,236,.55)"});
    g+=lin(G1,G2,{st:PF.grund,sw:5});const gm=[(G1[0]+G2[0])/2,(G1[1]+G2[1])/2],pm=[P.reduce((a,p)=>a+p[0],0)/4,P.reduce((a,p)=>a+p[1],0)/4],gd=ein([gm[0]-pm[0],gm[1]-pm[1]]);
    g+=T(gm[0]+gd[0]*20,gm[1]+gd[1]*20+6,"g",{it:true,fill:"#00805F",b:true});
    if(geloest&&c.aussen){const F=S(c.f),nah=Math.hypot(F[0]-G1[0],F[1]-G1[1])<Math.hypot(F[0]-G2[0],F[1]-G2[1])?G1:G2,d=ein([F[0]-nah[0],F[1]-nah[1]]);
      g+=lin(nah,[F[0]+d[0]*s,F[1]+d[1]*s],{st:PF.grund,sw:2,dash:"6 5"});}
    if(tip){const F=S(tip);g+=lin(V,F,{st:geloest?PF.hoehe:PF.schueler,sw:3})+'<circle cx="'+F[0]+'" cy="'+F[1]+'" r="5" fill="'+(geloest?PF.hoehe:PF.schueler)+'"/>';
      if(geloest){const gd2=[G2[0]-G1[0],G2[1]-G1[1]],zu=[V[0]-F[0],V[1]-F[1]];g+=rwB(F,zu,(Math.hypot(F[0]-G2[0],F[1]-G2[1])>1?[G2[0]-F[0],G2[1]-F[1]]:[G1[0]-F[0],G1[1]-F[1]]),13);
        const hd=ein([F[0]-V[0],F[1]-V[1]]);g+=T((V[0]+F[0])/2-hd[1]*13,(V[1]+F[1])/2+hd[0]*13+5,"h",{it:true,b:true,fill:PF.hoehe});}}
    g+='<circle cx="'+V[0]+'" cy="'+V[1]+'" r="5" fill="#000"/>'+ecken(P,N);
    el.innerHTML=g+'</svg><p class="klein hginfo">'+(tip?(geloest?"Richtig eingezeichnet!":"Dein Fußpunkt ist gesetzt. Tippe woanders hin, um ihn zu verschieben."):"Tippe mit dem Stift genau auf den Gitterpunkt, wo die Höhe die Grundseite trifft.")+'</p>';
    const svg=el.querySelector("svg");
    svg.addEventListener("pointerdown",e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height;
      const gx=Math.round((sx-x0)/s),gy=ny-Math.round((sy-y0)/s);if(gx<0||gy<0||gx>nx||gy>ny)return;
      tip=[gx,gy];geloest=false;el.classList.remove("ok","falsch");male();});};
  el._pruef=()=>{const ok=!!tip&&tip[0]===c.f[0]&&tip[1]===c.f[1];geloest=ok;male();return ok;};
  male();});}

/* ═══ „Welche Strecke ist die Höhe?“ ═══ */
function nrKreis(p,n,f){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="#fff" stroke="'+f+'" stroke-width="2"/>'+T(p[0],p[1]+5,n,{fs:13,b:true,fill:f});}
function streckenSvg(t){const s=20;let g='<svg viewBox="0 0 280 190" width="280" role="img" aria-label="Parallelogramm mit drei Strecken">'+gitterSvg(0,0,14,9,s);
  let P,L,G;
  if(t===1){P=[[40,160],[180,160],[240,40],[100,40]];G=[0,1];L=[[P[0],P[3]],[[100,40],[140,160]],[[160,40],[160,160]]];}
  if(t===2){P=[[40,160],[200,120],[200,40],[40,80]];G=[1,2];L=[[[40,80],[200,80]],[P[0],P[1]],[[40,80],[200,120]]];}
  if(t===3){P=[[20,160],[100,160],[240,60],[160,60]];G=[0,1];L=[[P[1],P[2]],[[160,60],[160,160]],[[160,60],[100,160]]];}
  g+=poly(P,{fill:"rgba(204,241,236,.55)"})+lin(P[G[0]],P[G[1]],{st:PF.grund,sw:5});
  if(t===3)g+=lin([100,160],[180,160],{st:PF.grund,sw:2,dash:"6 5"});
  const farb=["#C2185B","#6A1B9A","#E65100"];
  const TT=t===3?[0.8,0.72,0.3]:(t===2?[0.75,0.78,0.3]:[0.5,0.78,0.3]),OF=t===2?[12,15,15]:[-15,15,15];L.forEach((l,i)=>{g+=lin(l[0],l[1],{st:farb[i],sw:3});});
  L.forEach((l,i)=>{const t=TT[i],m=[l[0][0]+(l[1][0]-l[0][0])*t,l[0][1]+(l[1][1]-l[0][1])*t],d=ein([l[1][0]-l[0][0],l[1][1]-l[0][1]]),o=OF[i];g+=nrKreis([m[0]-d[1]*o,m[1]+d[0]*o],i+1,farb[i]);});
  return g+ecken(P,["A","B","C","D"])+'</svg>';}

function initEntZ(K){const rv=K.querySelector(".rv"),bild=K.querySelector(".entbild");
  const z=()=>{const t=+rv.value/100,s=30,x0=14,y0=14,nx=9,ny=5,S=p=>[x0+p[0]*s,y0+(ny-p[1])*s];

function binde(B){

    g.addEventListener("pointerdown",e=>{const c=zelle(e);if(!c)return;modus=!c.classList.contains("an");c.classList.toggle("an",modus);g.setPointerCapture(e.pointerId);e.preventDefault();upd();});
    g.addEventListener("pointermove",e=>{if(modus===null)return;const c=zelle(e);if(c&&c.classList.contains("an")!==modus){c.classList.toggle("an",modus);upd();}});
    ["pointerup","pointercancel"].forEach(n=>g.addEventListener(n,()=>modus=null));
  });
  B.querySelectorAll(".zuo").forEach(Z=>{

    const farbe=()=>{const L=[...Z.querySelectorAll('[data-s="l"]')];let k=0;
      Z.querySelectorAll("button").forEach(b=>{delete b.dataset.p;delete b.dataset.nr;b.classList.remove("ok","falsch");});
      L.forEach(l=>{if(l.dataset.mit!=null&&l.dataset.mit!==""){const r=Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]');
        l.dataset.p=r.dataset.p=k%8;l.dataset.nr=r.dataset.nr=++k;}});};
    Z.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const seite=b.dataset.s;
      // schon verbunden → lösen
      if(seite==="l"&&b.dataset.mit){b.dataset.mit="";gew=null;Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));farbe();return;}
      if(seite==="r"){const l=Z.querySelector('[data-s="l"][data-mit="'+b.dataset.i+'"]');if(l&&!(gew&&gew.dataset.s==="l")){l.dataset.mit="";farbe();return;}}
      if(!gew||gew.dataset.s===seite){Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));gew=b;b.classList.add("wahl1");return;}
      const l=seite==="l"?b:gew,r=seite==="r"?b:gew;
      Z.querySelectorAll('[data-s="l"]').forEach(x=>{if(x.dataset.mit===r.dataset.i)x.dataset.mit="";});
      l.dataset.mit=r.dataset.i;gew.classList.remove("wahl1");gew=null;farbe();
    }));

  B.querySelectorAll(".sort").forEach(S=>{

      txt.innerHTML=reihe.length?"Deine Reihenfolge: "+reihe.map(b=>b.innerHTML).join(" &lt; "):"";};
    S._reihe=reihe;
    S.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const p=reihe.indexOf(b);if(p<0)reihe.push(b);else reihe.splice(p,1);zeig();}));
  });
  B.querySelectorAll(".live").forEach(L=>{const T=L.closest(".innen");
    const upd=()=>{const R=[...T.querySelectorAll("tr[data-n]")];const namen=R.map(r=>r.dataset.n);
      const v=R.map(r=>{const x=num(r.querySelector("input").value);return isNaN(x)||x<0?0:x;});
      if(L.dataset.typ==="streifen")L.innerHTML=streifenSvg(namen,v,{live:true});
      else{const s=v.reduce((p,q)=>p+q,0);L.innerHTML=kreisSvg(namen,v)+'<p class="summe">Summe der Winkel: <b>'+dZ(s)+'</b>° '+(Math.abs(s-360)<1e-9?"✓":"(soll 360° sein)")+'</p>';}};
    T.addEventListener("input",upd);upd();});

function EREG(e){if(!e)return null;const B="(^|[^a-zäöüß])",Z="(?![a-zäöüß²2])",W={mm:"millimeter",cm:"zentimeter",dm:"dezimeter",m:"meter",km:"kilometer"};
  if(e==="€")return /€|euro/i;
  if(e==="ha")return new RegExp(B+"ha"+Z+"|hektar","i");
  if(e==="a")return new RegExp(B+"a"+Z+"|"+B+"ar"+Z,"i");
  if(/²$/.test(e)){const g=e.slice(0,-1);return new RegExp(B+g+"(²|2|\\^2)|quadrat"+W[g],"i");}
  if(W[e])return new RegExp(B+e+Z+"|"+B+W[e],"i");
  return new RegExp(e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");}
const tausend=v=>String(v).trim().replace(/^(\d{1,3})((?:\.\d{3})+)(,\d+)?$/,(m,a,b,c)=>a+b.replace(/\./g,"")+(c||""));
function pruefe(k){
  let r=0,n=0;const setz=(el,ok)=>{el.classList.toggle("ok",ok);el.classList.toggle("falsch",!ok);if(ok)r++;};
  k.querySelectorAll("input[data-a]").forEach(i=>{n++;const ok=i.dataset.a.split("|").some(a=>{const x=num(tausend(i.value)),y=num(a);
    return (!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-9)||(i.value.trim()!==""&&norm(i.value)===norm(a));});setz(i,ok);});
  k.querySelectorAll("input.antw").forEach(i=>{n++;const t=i.value.trim(),w=parseFloat(i.dataset.w.replace(",","."));
    const zs=(t.replace(/(\d)[\s\u202F.](?=\d{3}\b)/g,"$1").match(/\d+(?:[.,]\d+)?/g)||[]).map(z=>parseFloat(z.replace(",",".")));
    const E=EREG(i.dataset.e);
    const ok=t.split(/\s+/).length>=3&&zs.some(z=>Math.abs(z-w)<1e-9)&&(!i.dataset.e||(E?E.test(t):t.toLowerCase().includes(i.dataset.e.toLowerCase())));setz(i,ok);});
  k.querySelectorAll(".fin").forEach(f=>{n++;const[a,b]=f.querySelectorAll("input");const x=num(a.value),y=num(b.value);
    const ok=!isNaN(x)&&!isNaN(y)&&y!==0&&Math.abs(x/y-parseFloat(f.dataset.v))<1e-9;[a,b].forEach(i=>{i.classList.toggle("ok",ok);i.classList.toggle("falsch",!ok);});if(ok)r++;});
  k.querySelectorAll(".wahl,.auswahl").forEach(g=>{n++;const an=g.querySelector("button.an");setz(g,!!an&&an.dataset.z===g.dataset.soll);});
  k.querySelectorAll(".mk").forEach(m=>{n++;const ok=m.dataset.r===m.dataset.soll;m.classList.toggle("falsch",!ok);if(ok)r++;});
  k.querySelectorAll(".g100.malen").forEach(g=>{n++;setz(g,g.querySelectorAll("i.an").length===+g.dataset.soll);});
  k.querySelectorAll(".zuo").forEach(Z=>Z.querySelectorAll('[data-s="l"]').forEach(l=>{n++;const ok=l.dataset.mit===l.dataset.i;
    const rr=l.dataset.mit?Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]'):null;
    l.classList.toggle("ok",ok);l.classList.toggle("falsch",!ok);if(rr){rr.classList.toggle("ok",ok);rr.classList.toggle("falsch",!ok);}if(ok)r++;}));
  k.querySelectorAll(".sort").forEach(S=>{const R=S._reihe;S.querySelectorAll("button").forEach(b=>{n++;const p=R.indexOf(b);setz(b,p>=0&&+b.dataset.i===p);});});
  /* Verhältnisgleichung: jede richtig aufgestellte Gleichung zählt (Seiten tauschen, Brüche umdrehen, über Kreuz) */
  k.querySelectorAll(".vgl-gl[data-gl]").forEach(E=>{n++;const [G,B,W,P]=JSON.parse(E.dataset.sol);
    const AR=[[G,B,W,P],[W,P,G,B],[B,G,P,W],[P,W,B,G],[G,W,B,P],[B,P,G,W],[W,G,P,B],[P,B,W,G]];
    const f=[...E.querySelectorAll("input.gl")].map(i=>i.value.trim().replace(/%/g,"").replace(/\s+/g,"").toLowerCase());
    const gl=(a,b)=>{if(a==="x"||b==="x")return a===b;const u=num(a),v=num(b);return !isNaN(u)&&!isNaN(v)&&Math.abs(u-v)<1e-9;};
    const ok=AR.some(r=>r.every((v,i)=>gl(f[i],String(v).toLowerCase())));
    E.querySelectorAll("input.gl").forEach(i=>{i.classList.toggle("ok",ok);i.classList.toggle("falsch",!ok);});if(ok)r++;});
  k.querySelectorAll(".epr").forEach(el=>{n++;setz(el,!!(el._pruef&&el._pruef()));});
  const e=k.querySelector(".ergebnis");
  if(r===n){e.textContent="Super, alles richtig! ("+r+" von "+n+")";e.className="ergebnis gut";k.classList.add("fertig");}
  else{e.textContent=r+" von "+n+" richtig. Verbessere die rot markierten Stellen.";e.className="ergebnis noch";k.classList.remove("fertig");}
  stand();
}
