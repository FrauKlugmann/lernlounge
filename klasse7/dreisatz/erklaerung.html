<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Der Dreisatz – Erklärvideo</title>
<style>
/* Layout: weißes Blatt wie das Tafelbild Vervielfachen; links proportional, rechts antiproportional, jede Seite mit eigenem Schritt-Knopf */
:root{
  --papier:#ffffff; --tinte:#000000; --grau:#F2F2F2; --leise:#6F6F6F;
  --smaragd:#00805F; --smaragd-hell:#D3F2E5;
  --prop:#1565C0; --prop-hell:#E8EFFB; --anti:#C2410C; --anti-hell:#FBEADF;
  --schrift:Arial,Helvetica,"Liberation Sans",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--papier)}
body{margin:0;background:var(--papier);color:var(--tinte);font-family:var(--schrift);font-size:clamp(15px,1.45vw,22px);line-height:1.3;
  padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blatt{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:1em}
.titel{background:var(--smaragd);color:#fff;font-weight:700;text-align:center;font-size:1.5em;padding:.4em .5em;margin:0}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:1em}
@media (max-width:760px){.zwei{grid-template-columns:1fr}}
.kasten{border:2px solid var(--c);display:flex;flex-direction:column}
.kasten>h2{margin:0;font-size:1em;background:var(--ch);border-bottom:2px solid var(--c);padding:.35em .7em;color:var(--c)}
.innen{padding:.6em .8em .8em;display:flex;flex-direction:column;gap:.55em;flex:1}
.aufgabe{margin:0;font-size:1.05em}
.regel{margin:0;font-weight:700;color:var(--c)}
svg.ds{width:100%;height:auto;display:block}
svg.ds text{font-family:var(--schrift)}
.s{transition:opacity .35s}
.s.aus{opacity:0}
.merk{border:2px solid var(--c);color:var(--c);font-weight:700;padding:.25em .6em;align-self:center;transition:opacity .35s}
.merk.aus{opacity:0}
.text{min-height:2.7em;margin:0;font-size:1em;background:var(--grau);padding:.4em .7em;border-left:5px solid var(--c)}
.antwort{margin:0;font-weight:700;font-size:1.05em;border-top:2px solid var(--c);padding-top:.4em;transition:opacity .35s}
.antwort.aus{opacity:0}
.leiste{display:flex;gap:.6em;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:auto}
.zaehler{color:var(--leise);font-size:.85em}
.knoepfe{display:flex;gap:.5em}
button{font:inherit;font-size:.9em;background:var(--papier);color:var(--tinte);border:2px solid var(--c);padding:.35em .9em;cursor:pointer}
button.vor{background:var(--c);color:#fff;font-weight:700}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--smaragd);outline-offset:2px}
.oben{display:flex;justify-content:flex-end}
.oben button{--c:var(--smaragd)}
.fuss{text-align:right;font-style:italic;color:var(--leise);font-size:.65em;margin:0}
@media (prefers-reduced-motion:reduce){.s,.merk,.antwort{transition:none}}
.lernfilm{position:sticky;top:0;z-index:2;border:2px solid #00805F;background:#F0FAF6;padding:.8em 1em;display:flex;flex-direction:column;gap:.55em}
.lernfilm .steuerung{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.lernfilm button{font:inherit;color:var(--tinte);min-height:44px;font-weight:700;padding:.45em .85em;border:2px solid #00805F;background:white;cursor:pointer}
.lernfilm button.start{background:#00805F;color:white}
.lernfilm button:disabled{opacity:.45;cursor:not-allowed}
.lernfilm .hinweis{font-size:.8em;color:#555}
</style>
<style>
/* Lern-Lounge: Zurück-Knopf und Spickzettel-Fenster */
.ll-leiste{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.ll-zurueck,.ll-spick{font:700 16px/1.2 Arial,Helvetica,sans-serif;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 16px;border-radius:999px;cursor:pointer;text-decoration:none;box-sizing:border-box}
.ll-zurueck{background:#fff;color:#1b1f20;border:2px solid #5a4a8a}
.ll-zurueck:hover{background:#f1edfb}
.ll-zurueck.ll-warn{background:#B3261E;color:#fff;border-color:#B3261E}
.ll-spick{background:#B3261E;color:#fff;border:2px solid #B3261E;box-shadow:0 2px 8px rgba(179,38,30,.35)}
.ll-spick:hover{background:#951f19}
.ll-spick svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ll-zurueck:focus-visible,.ll-spick:focus-visible,.ll-zu:focus-visible{outline:3px solid #1b1f20;outline-offset:2px}
.ll-fenster{position:fixed;inset:0;z-index:1000;background:rgba(20,20,30,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ll-fenster[hidden]{display:none}
.ll-box{width:min(1080px,100%);height:min(92vh,100%);background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ll-zu{align-self:flex-end;margin:8px 10px;font:700 15px Arial,Helvetica,sans-serif;color:#fff;background:#B3261E;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.ll-box iframe{flex:1;width:100%;border:0;border-top:1px solid #ddd}
</style>
</head>
<body>
<main class="blatt">
<div class="ll-leiste"><a class="ll-zurueck" id="ll-zurueck" href="../">← Lern-Lounge</a></div>
  <h1 class="titel">Der Dreisatz</h1>
  <div class="oben"><button type="button" id="reset">Alles von vorn</button></div>
  <div class="zwei" id="seiten"></div>
  <p class="fuss">Erstellt von Marion Klugmann (November 2026) mit freundlicher Unterstützung von Claude und ChatGPT.</p>
</main>

<script>
(function(){
  const SEITEN=[
    {id:'p',name:'Proportionale Zuordnung',c:'var(--prop)',ch:'var(--prop-hell)',farbe:'#1565C0',
     aufgabe:'4 Hefte kosten 6 €. Wie viel kosten 7 Hefte?',
     regel:'Je mehr Hefte, desto mehr muss ich bezahlen.',
     kx:'Anzahl Hefte',ky:'Preis in €',
     werte:[['4','6'],['1','1,5'],['7','10,5']],
     links:[': 4','· 7'],rechts:[': 4','· 7'],
     merk:'Rechts dasselbe rechnen wie links.',
     antwort:'Antwort: 7 Hefte kosten 10,50 €.',
     texte:['Lies die Aufgabe: Je mehr Hefte, desto mehr muss ich bezahlen – die Zuordnung ist proportional.',
            'Schreibe das gegebene Wertepaar in die erste Zeile: 4 Hefte kosten 6 €.',
            'Links auf 1 herunterrechnen: 4 : 4 = 1.',
            'Rechts dasselbe rechnen: 6 : 4 = 1,5. Ein Heft kostet 1,50 €.',
            'Links von 1 auf 7 hochrechnen: 1 · 7 = 7.',
            'Rechts wieder dasselbe: 1,5 · 7 = 10,5.',
            'Zum Schluss schreibst du einen Antwortsatz.']},
    {id:'a',name:'Antiproportionale Zuordnung',c:'var(--anti)',ch:'var(--anti-hell)',farbe:'#C2410C',
     aufgabe:'3 Bagger brauchen 12 Tage. Wie lange brauchen 4 Bagger?',
     regel:'Je mehr Bagger, desto weniger Tage.',
     kx:'Anzahl Bagger',ky:'Zeit in Tagen',
     werte:[['3','12'],['1','36'],['4','9']],
     links:[': 3','· 4'],rechts:['· 3',': 4'],
     merk:'Rechts die Umkehrrechnung.',
     antwort:'Antwort: 4 Bagger brauchen 9 Tage.',
     texte:['Lies die Aufgabe: Je mehr Bagger, desto weniger Tage – die Zuordnung ist antiproportional.',
            'Schreibe das gegebene Wertepaar in die erste Zeile: 3 Bagger brauchen 12 Tage.',
            'Links auf 1 herunterrechnen: 3 : 3 = 1.',
            'Rechts die Umkehrrechnung: aus „: 3“ wird „· 3“. 12 · 3 = 36. Ein Bagger braucht 36 Tage.',
            'Links von 1 auf 4 hochrechnen: 1 · 4 = 4.',
            'Rechts wieder die Umkehrrechnung: aus „· 4“ wird „: 4“. 36 : 4 = 9.',
            'Zum Schluss schreibst du einen Antwortsatz.']}
  ];
  const MAX=6;
  // Geometrie der Dreisatztabelle
  const TX=130,CW=170,HH=50,RH=60,W=TX*2+CW*2,H=HH+3*RH+10;

  function bogen(seite,k,lab,farbe,schritt){
    const y1=HH+k*RH+RH/2+4,y2=y1+RH-8,links=seite==='l';
    const x=links?TX-8:TX+2*CW+8,d=links?-1:1;
    const tx=x+d*44;
    return `<g class="s" data-s="${schritt}">
      <path d="M${x},${y1} C${x+d*40},${y1} ${x+d*40},${y2} ${x+d*5},${y2}" fill="none" stroke="${farbe}" stroke-width="3" stroke-linecap="round"/>
      <polygon points="${x+d*14},${y2-7} ${x+d*14},${y2+7} ${x},${y2}" fill="${farbe}"/>
      <text x="${tx}" y="${(y1+y2)/2+8}" font-size="24" font-weight="700" fill="${farbe}" text-anchor="${links?'end':'start'}">${lab}</text></g>`;
  }
  function svg(S){
    let s=`<svg class="ds" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dreisatztabelle ${S.name}">`;
    s+=`<rect x="${TX}" y="0" width="${2*CW}" height="${HH}" fill="#F2F2F2" stroke="#000" stroke-width="2"/>`;
    s+=`<text x="${TX+CW/2}" y="${HH/2+7}" font-size="19" font-weight="700" text-anchor="middle">${S.kx}</text>`;
    s+=`<text x="${TX+1.5*CW}" y="${HH/2+7}" font-size="19" font-weight="700" text-anchor="middle">${S.ky}</text>`;
    for(let r=0;r<3;r++){const y=HH+r*RH;s+=`<rect x="${TX}" y="${y}" width="${CW}" height="${RH}" fill="#fff" stroke="#000" stroke-width="2"/><rect x="${TX+CW}" y="${y}" width="${CW}" height="${RH}" fill="#fff" stroke="#000" stroke-width="2"/>`}
    // Werte: Zeile 1 in Schritt 1, Zeile 2 links Schritt 2 / rechts 3, Zeile 3 links 4 / rechts 5
    const sch=[[1,1],[2,3],[4,5]];
    S.werte.forEach((w,r)=>{const y=HH+r*RH+RH/2+10;
      s+=`<text class="s" data-s="${sch[r][0]}" x="${TX+CW/2}" y="${y}" font-size="28" ${r===0?'font-weight="700"':''} text-anchor="middle">${w[0]}</text>`;
      s+=`<text class="s" data-s="${sch[r][1]}" x="${TX+1.5*CW}" y="${y}" font-size="28" ${r===0?'font-weight="700"':''} text-anchor="middle">${w[1]}</text>`;});
    s+=bogen('l',0,S.links[0],S.farbe,2)+bogen('r',0,S.rechts[0],S.farbe,3)+bogen('l',1,S.links[1],S.farbe,4)+bogen('r',1,S.rechts[1],S.farbe,5);
    return s+'</svg>';
  }
  const zustand={};
  SEITEN.forEach(S=>{
    zustand[S.id]=0;
    const k=document.createElement('section');k.className='kasten';k.style.setProperty('--c',S.c);k.style.setProperty('--ch',S.ch);
    k.innerHTML=`<h2>${S.name}</h2><div class="innen">
      <p class="aufgabe">${S.aufgabe}</p>
      <p class="regel">${S.regel}</p>
      ${svg(S)}
      <div class="merk aus" id="merk-${S.id}">${S.merk}</div>
      <p class="text" id="text-${S.id}" aria-live="polite"></p>
      <p class="antwort aus" id="antw-${S.id}">${S.antwort}</p>
      <div class="leiste"><span class="zaehler" id="z-${S.id}"></span>
        <div class="knoepfe"><button type="button" id="zur-${S.id}">◀ Zurück</button><button type="button" class="vor" id="vor-${S.id}">Weiter ▶</button></div></div>
    </div>`;
    document.getElementById('seiten').appendChild(k);
    document.getElementById('vor-'+S.id).onclick=()=>setze(S,zustand[S.id]+1);
    document.getElementById('zur-'+S.id).onclick=()=>setze(S,zustand[S.id]-1);
  });
  function setze(S,n){
    n=Math.max(0,Math.min(MAX,n));zustand[S.id]=n;
    const box=document.getElementById('seiten').children[SEITEN.indexOf(S)];
    box.querySelectorAll('.s').forEach(el=>el.classList.toggle('aus',+el.dataset.s>n));
    document.getElementById('merk-'+S.id).classList.toggle('aus',n<3);
    document.getElementById('antw-'+S.id).classList.toggle('aus',n<6);
    document.getElementById('text-'+S.id).textContent=S.texte[n];
    document.getElementById('z-'+S.id).textContent=n===0?'Start':`Schritt ${n} von ${MAX}`;
    document.getElementById('zur-'+S.id).disabled=startBtn.disabled||n===0;
    document.getElementById('vor-'+S.id).disabled=startBtn.disabled||n===MAX;
  }
  const sprechtexte={
    p:[
      'Beim Dreisatz rechnest du zuerst auf eins und dann auf die gesuchte Anzahl. Wir beginnen mit den Heften. Vier Hefte kosten sechs Euro. Wie viel kosten sieben Hefte? Bei gleichem Stückpreis kosten doppelt so viele Hefte doppelt so viel. Die Zuordnung ist proportional.',
      'Trage das gegebene Wertepaar in die erste Zeile ein: links vier Hefte, rechts sechs Euro.',
      'Rechne links auf ein Heft herunter. Vier geteilt durch vier ergibt eins.',
      'Bei der proportionalen Zuordnung rechnest du rechts dasselbe. Sechs Euro geteilt durch vier sind ein Euro und fünfzig Cent pro Heft.',
      'Jetzt rechnest du links von einem auf sieben Hefte hoch. Dazu multiplizierst du mit sieben.',
      'Multipliziere auch rechts mit sieben. Ein Euro und fünfzig Cent mal sieben ergibt zehn Euro und fünfzig Cent.',
      'Der Antwortsatz lautet: Sieben Hefte kosten zehn Euro und fünfzig Cent.'
    ],
    a:[
      'Jetzt zu den Baggern. Drei Bagger brauchen zwölf Tage. Wie lange brauchen vier Bagger? Wenn alle gleich schnell arbeiten und die Arbeit gleich bleibt, brauchen doppelt so viele Bagger halb so lange. Die Zuordnung ist antiproportional.',
      'In die erste Zeile kommen links drei Bagger und rechts zwölf Tage.',
      'Rechne links wieder auf eins herunter. Drei geteilt durch drei ergibt einen Bagger.',
      'Ein Bagger braucht dreimal so lange wie drei Bagger. Links teilst du durch drei, rechts multiplizierst du mit drei. Zwölf mal drei ergibt sechsunddreißig Tage.',
      'Rechne links von einem auf vier Bagger hoch. Dazu multiplizierst du mit vier.',
      'Vier Bagger brauchen ein Viertel der Zeit eines Baggers. Deshalb teilst du rechts durch vier. Sechsunddreißig geteilt durch vier ergibt neun Tage.',
      'Vier Bagger brauchen neun Tage. Merke dir: Links rechnest du bei beiden Aufgaben zuerst auf eins. Rechts rechnest du bei proportionalen Zuordnungen genauso und bei antiproportionalen Zuordnungen mit der Umkehrrechnung.'
    ]
  };
  const film=document.createElement('section');
  film.className='lernfilm';
  film.setAttribute('aria-label','Gesprochene Erklärung');
  film.innerHTML=`<strong>🎙️ Gesprochene Erklärung</strong>
    <div class="steuerung"><button type="button" class="start" id="film-start">▶ Erklärung starten</button>
    <button type="button" id="film-pause" disabled>⏸ Pause</button>
    <button type="button" id="film-stop" disabled>■ Beenden</button>
    <label for="film-tempo">Sprechtempo:</label><select id="film-tempo"><option value="0.85">Langsam</option><option value="0.95" selected>Normal</option><option value="1.1">Schnell</option></select></div>
    <div class="hinweis" id="film-hinweis" role="status">Die Erklärung wird automatisch vorgelesen. Zum Starten bitte auf ▶ klicken.</div>`;
  document.querySelector('.oben').before(film);
  const startBtn=film.querySelector('#film-start'),stopBtn=film.querySelector('#film-stop');
  const pauseBtn=film.querySelector('#film-pause');
  const hinweis=film.querySelector('#film-hinweis');
  const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
  let bevorzugteStimme=null;
  function ladeStimme(){
    if(!synth)return;
    const stimmen=synth.getVoices();
    // Google Deutsch wird bevorzugt, sofern diese Stimme auf dem Endgerät verfügbar ist.
    bevorzugteStimme=stimmen.find(v=>v.lang.toLowerCase().startsWith('de') && /google.*deutsch|google.*german/i.test(v.name))
      || stimmen.find(v=>v.lang.toLowerCase().startsWith('de') && /google/i.test(v.name))
      || stimmen.find(v=>v.lang.toLowerCase()==='de-de')
      || stimmen.find(v=>v.lang.toLowerCase().startsWith('de')) || null;
  }
  ladeStimme();
  if(synth)synth.addEventListener('voiceschanged',ladeStimme);
  let filmLauf=0;
  let pausiert=false;
  let fortsetzen=null;

  function warteAufFortsetzen(){
    if(pausiert)return new Promise(resolve=>{fortsetzen=resolve;});
  }
  function loesePause(){
    pausiert=false;
    pauseBtn.textContent='⏸ Pause';
    fortsetzen?.();
    fortsetzen=null;
  }
  function setzeBedienung(laeuft){
    startBtn.disabled=laeuft;
    pauseBtn.disabled=!laeuft;
    stopBtn.disabled=!laeuft;
    SEITEN.forEach(S=>setze(S,zustand[S.id]));
  }
  const warte=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function spreche(text,id){
    if(!synth)return warte(Math.max(1800,text.length*65));
    return new Promise(resolve=>{
      if(id!==filmLauf){resolve();return;}
      let fertig=false;
      let fallback;
      const ende=()=>{
        if(fertig)return;
        fertig=true;
        clearTimeout(fallback);
        resolve();
      };
      const u=new SpeechSynthesisUtterance(text);
      u.lang='de-DE';u.rate=Number(film.querySelector('#film-tempo').value);u.pitch=1;
      ladeStimme();
      if(bevorzugteStimme)u.voice=bevorzugteStimme;
      u.onend=ende;u.onerror=ende;
      // Solange die Stimme pausiert oder noch spricht, bleibt der Schritt aktiv.
      function pruefeSprechende(){
        if(id===filmLauf&&(pausiert||synth.speaking||synth.pending)){
          fallback=setTimeout(pruefeSprechende,1000);
          return;
        }
        ende();
      }
      fallback=setTimeout(pruefeSprechende,Math.max(5000,text.length*170));
      synth.speak(u);
    });
  }
  function beende(){
    filmLauf++;
    loesePause();
    if(synth){
      synth.cancel();
      if(synth.paused)synth.resume();
    }
    setzeBedienung(false);
  }
  pauseBtn.addEventListener('click',()=>{
    if(pausiert){
      synth.resume();
      loesePause();
      hinweis.textContent='Die Erklärung läuft.';
    }else{
      pausiert=true;
      synth.pause();
      pauseBtn.textContent='▶ Fortsetzen';
      hinweis.textContent='Die Erklärung ist pausiert.';
    }
  });
  stopBtn.addEventListener('click',()=>{beende();hinweis.textContent='Erklärung beendet. Du kannst jetzt selbst mit dem Tafelbild arbeiten.';});
  startBtn.addEventListener('click',async()=>{
    if(!synth){hinweis.textContent='Dieser Browser unterstützt keine automatische Sprachausgabe.';return;}
    hinweis.textContent='Die Erklärung läuft. Du kannst sie pausieren oder beenden.';
    beende();const id=filmLauf;
    SEITEN.forEach(S=>setze(S,0));
    setzeBedienung(true);
    for(const [index,S] of SEITEN.entries()){
      if(id!==filmLauf)return;
      if(pausiert)await warteAufFortsetzen();
      if(id!==filmLauf)return;
      const box=document.getElementById('seiten').children[index];
      if(window.matchMedia('(max-width:760px)').matches){
        box.style.scrollMarginTop=(film.offsetHeight+12)+'px';
        box.scrollIntoView({block:'start'});
      }
      for(const [n,text] of sprechtexte[S.id].entries()){
        if(id!==filmLauf)return;
        if(pausiert)await warteAufFortsetzen();
        if(id!==filmLauf)return;
        setze(S,n);
        await spreche(text,id);
        if(id!==filmLauf)return;
        await warte(350);
      }
    }
    if(id!==filmLauf)return;
    if(pausiert)await warteAufFortsetzen();
    if(id!==filmLauf)return;
    setzeBedienung(false);
    hinweis.textContent='Fertig! Du kannst die Schritte jetzt selbst durchgehen.';
  });
  SEITEN.forEach(S=>setze(S,0));
  document.getElementById('reset').onclick=()=>{
    beende();
    SEITEN.forEach(S=>setze(S,0));
    hinweis.textContent='Zum Starten bitte auf „Erklärung starten“ klicken.';
  };
})();
</script>
<script>
(function(){
  function still(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
  document.getElementById('ll-zurueck').addEventListener('click',still);
  window.addEventListener('pagehide',still);
})();
</script>
</body>
</html>
