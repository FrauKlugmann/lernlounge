<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zusammengesetzte Figuren – Interaktive Übungen</title>
<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  AUFGABENBLOCK – NUR AB HIER ÄNDERN                              ║
   ║  Alles unterhalb von „ENDE AUFGABENBLOCK“ ist der feste Motor.   ║
   ╚══════════════════════════════════════════════════════════════════╝
   Kurzschrift in Texten:
     [30]          Eingabefeld, Lösung 30 (Komma/Punkt egal)
     [0,5|,5]      mehrere richtige Antworten mit |
     {3/10}        Bruch;  {[30]/100}  Bruch mit Feld im Zähler
     [=7/100]      Bruch frei eingeben (jeder gleichwertige Bruch zählt)
     ((A|*B|C))    Auswahlknöpfe, * = richtig
     [G:40] [W:10] [P:25 %]   Zahl zum Markieren (nur Art "markieren")
     **fett**   <blau>…</blau>  <orange>…</orange>  <gruen>…</gruen>
   Aufgabenarten: luecke, erweitern, hunderterfeld, faerben, tabelle,
     vergleichen, auswahl, markieren, streifen, verhaeltnis, zuordnen,
     richtigfalsch, sortieren, streifenbau, kreisbau   (jede kann zusätzlich bild:"<svg…>" haben)
*/
/* ─── Diagramm-Helfer (Teil des Motors, auch für feste Bilder in Aufgaben nutzbar) ─── */
const DFARBEN=["#F4B6B0","#B7DFB9","#FFE08A","#CDBBE8","#A9DDE6"];
const dEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dZ=x=>String(Math.round(x*10)/10).replace(".",",");
/* streifenSvg(namen, cm, {live, bis, texte}) – bis = Länge der Skala (Standard 10), texte = eigene Beschriftung je Teil */
function streifenSvg(namen,cm,opt){
  opt=opt||{};const x0=10,y0=22,h=40,pc=50,bis=opt.bis||10;const B=565+(bis-10)*pc;
  let s='<svg viewBox="0 0 '+B+' 100" role="img" aria-label="Streifendiagramm" style="width:'+B+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  let x=0;
  cm.forEach((c,i)=>{c=Math.max(0,c);const w=Math.max(0,Math.min(c,bis-x))*pc;
    if(w>0){s+='<rect x="'+(x0+x*pc)+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      const n=(opt.texte?opt.texte[i]:namen[i])||"";if(n&&w>=n.length*7+8)s+='<text x="'+(x0+x*pc+w/2)+'" y="'+(y0+h/2+5)+'" text-anchor="middle" font-size="13">'+dEsc(n)+'</text>';}
    x=Math.min(bis,x+c);});
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+10*pc+'" height="'+h+'" fill="none" stroke="#000" stroke-width="2"/>';
  for(let k=0;k<=bis;k++)s+='<line x1="'+(x0+k*pc)+'" y1="'+(y0+h)+'" x2="'+(x0+k*pc)+'" y2="'+(y0+h+8)+'" stroke="#000" stroke-width="1.5"/><text x="'+(x0+k*pc)+'" y="'+(y0+h+23)+'" text-anchor="middle" font-size="13">'+k+'</text>';
  s+='<text x="'+(x0+bis*pc+20)+'" y="'+(y0+h+23)+'" font-size="13">cm</text>';
  const sum=cm.reduce((a,b)=>a+Math.max(0,b),0);
  if(opt.live&&sum>10.0001)s+='<text x="10" y="12" font-size="13" fill="#C62828" font-weight="700">Zu lang! Der Streifen ist nur 10 cm lang.</text>';
  return s+'</svg>';
}
/* kreisSvg(namen, grad, {winkel:false, texte}) – texte = eigene Beschriftung je Teil */
function kreisSvg(namen,grad,opt){
  opt=opt||{};const cx=225,cy=125,r=100;const P=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  let s='<svg viewBox="0 0 450 250" role="img" aria-label="Kreisdiagramm" style="width:450px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#000" stroke-width="2"/>';
  let a=0;const lab=[];
  grad.forEach((g,i)=>{g=Math.max(0,g);const b=Math.min(360,a+g);
    if(b-a>0.0001){
      if(b-a>=359.999)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      else{const p1=P(a),p2=P(b);s+='<path d="M'+cx+' '+cy+' L'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' A'+r+' '+r+' 0 '+((b-a)>180?1:0)+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+' Z" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';}
      lab.push([i,(a+b)/2,b-a]);}
    a=b;});
  lab.forEach(([i,m,w])=>{const sn=Math.sin(m*Math.PI/180),cs=Math.cos(m*Math.PI/180);const px=cx+(r+10)*sn,py=cy-(r+10)*cs;
    const an=sn>0.15?"start":sn<-0.15?"end":"middle";const dy=cs>0.9?-3:cs<-0.9?14:4;
    const t=opt.texte?opt.texte[i]:(namen[i]||"")+(opt.winkel===false?"":" · "+dZ(grad[i])+"°");
    s+='<text x="'+px.toFixed(1)+'" y="'+(py+dy).toFixed(1)+'" text-anchor="'+an+'" font-size="13">'+dEsc(t)+'</text>';});
  return s+'</svg>';
}

function karte(kopf,titel,preis,zeilen){return '<div class="shop"><div class="shop-kopf">'+kopf+'</div><div class="shop-innen"><b>'+titel+'</b><br><span class="preis">'+preis+'</span><p class="shop-det">'+zeilen.join("<br>")+'</p></div></div>';}
/* ─── Zusatz-Helfer Parallelogramm (Woche 2) ─── */
const PF={rand:"#000",flaeche:"#CCF1EC",dreieck:"#FFE08A",hoehe:"#d9472b",grund:"#14b8a6",schueler:"#1565C0",gitter:"#d6d6d6"};
const ein=d=>{const l=Math.hypot(d[0],d[1])||1;return [d[0]/l,d[1]/l];};
const pkt=p=>p[0].toFixed(1)+" "+p[1].toFixed(1);
/* rechter Winkel als runder Bogen mit Punkt, beliebig gedreht (P = Scheitel, u, v = Richtungen der Schenkel) */
function rwB(P,u,v,r){r=r||12;u=ein(u);v=ein(v);
  const p1=[P[0]+u[0]*r,P[1]+u[1]*r],p2=[P[0]+v[0]*r,P[1]+v[1]*r],sw=(u[0]*v[1]-u[1]*v[0])>0?1:0;
  const m=[P[0]+(u[0]+v[0])*r*0.42,P[1]+(u[1]+v[1])*r*0.42];
  return '<path d="M'+pkt(p1)+' A'+r+' '+r+' 0 0 '+sw+' '+pkt(p2)+'" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="'+m[0].toFixed(1)+'" cy="'+m[1].toFixed(1)+'" r="1.8" fill="#000"/>';}
/* Winkelbogen mit Gradzahl im Bogen */
function wB(P,u,v,r,txt){u=ein(u);v=ein(v);const p1=[P[0]+u[0]*r,P[1]+u[1]*r],p2=[P[0]+v[0]*r,P[1]+v[1]*r],sw=(u[0]*v[1]-u[1]*v[0])>0?1:0;
  const b=ein([u[0]+v[0],u[1]+v[1]]),t=[P[0]+b[0]*r*0.62,P[1]+b[1]*r*0.62+4];
  return '<path d="M'+pkt(p1)+' A'+r+' '+r+' 0 0 '+sw+' '+pkt(p2)+'" fill="none" stroke="#000" stroke-width="1.3"/><text x="'+t[0].toFixed(1)+'" y="'+t[1].toFixed(1)+'" text-anchor="middle" font-size="12" font-family="Arial">'+txt+'</text>';}
/* zwei Striche für gleich lange Seiten */
function strich2(P,Q){const m=[(P[0]+Q[0])/2,(P[1]+Q[1])/2],d=ein([Q[0]-P[0],Q[1]-P[1]]),n=[-d[1],d[0]];let s="";
  [-3,3].forEach(o=>{const c=[m[0]+d[0]*o,m[1]+d[1]*o];s+='<line x1="'+(c[0]-n[0]*6).toFixed(1)+'" y1="'+(c[1]-n[1]*6).toFixed(1)+'" x2="'+(c[0]+n[0]*6).toFixed(1)+'" y2="'+(c[1]+n[1]*6).toFixed(1)+'" stroke="#000" stroke-width="1.6"/>';});return s;}
function T(x,y,t,o){o=o||{};return '<text x="'+(+x).toFixed(1)+'" y="'+(+y).toFixed(1)+'" font-family="Arial" font-size="'+(o.fs||16)+'" text-anchor="'+(o.anc||"middle")+'"'+(o.it?' font-style="italic"':'')+(o.fill?' fill="'+o.fill+'"':'')+(o.b?' font-weight="bold"':'')+'>'+t+'</text>';}
function poly(P,o){o=o||{};return '<polygon points="'+P.map(pkt).join(" ")+'" fill="'+(o.fill||"#fff")+'" stroke="'+(o.st||"#000")+'" stroke-width="'+(o.sw||2)+'" stroke-linejoin="round"/>';}
function lin(P,Q,o){o=o||{};return '<line x1="'+P[0].toFixed(1)+'" y1="'+P[1].toFixed(1)+'" x2="'+Q[0].toFixed(1)+'" y2="'+Q[1].toFixed(1)+'" stroke="'+(o.st||"#000")+'" stroke-width="'+(o.sw||2)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+' stroke-linecap="round"/>';}
function gitterSvg(x0,y0,nx,ny,s){let g="";for(let i=0;i<=nx;i++)g+=lin([x0+i*s,y0],[x0+i*s,y0+ny*s],{st:PF.gitter,sw:1});
  for(let j=0;j<=ny;j++)g+=lin([x0,y0+j*s],[x0+nx*s,y0+j*s],{st:PF.gitter,sw:1});return g;}
/* Eckpunkte beschriften: nach außen vom Mittelpunkt weg */
function ecken(P,namen){const m=[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
  return P.map((p,i)=>{const d=ein([p[0]-m[0],p[1]-m[1]]);return T(p[0]+d[0]*16,p[1]+d[1]*16+6,namen[i],{fs:16,b:true});}).join("");}

/* Standardbild: Parallelogramm mit Grundseite g, Höhe h (rot, gestrichelt) und optional schräger Seite s */
function parSvg(o){o=o||{};const A=[40,130],B=[220,130],C=[280,40],D=[100,40],F=[100,130];
  let s='<svg viewBox="0 0 320 170" width="320" role="img" aria-label="Parallelogramm mit Grundseite und Höhe">'+poly([A,B,C,D]);
  s+=lin(D,F,{st:PF.hoehe,sw:2.4,dash:"6 4"})+rwB(F,[0,-1],[1,0],12);
  s+=T((A[0]+B[0])/2,A[1]+26,o.g||"g",{it:true})+T(F[0]+8,85,o.h||"h",{it:true,anc:"start",fill:PF.hoehe});
  if(o.s)s+=T((A[0]+D[0])/2-12,(A[1]+D[1])/2+4,o.s,{it:true,anc:"end"});
  return s+'</svg>';}

/* ═══ Entdecker Z1: Rechteck, Parallelogramm, Raute, Quadrat ═══ */
const ENT_P='<div class="ent"><div class="regler"><label>Winkel bei A = <b class="ww">60</b>°<input type="range" class="rw" min="30" max="90" step="5" value="60" aria-label="Winkel bei A"></label>'+
 '<label>Seite b = <b class="wb">3</b> cm<input type="range" class="rb" min="2" max="7" step="1" value="3" aria-label="Seite b"></label><p class="klein">Die Seite a ist immer 5 cm lang.</p></div>'+
 '<div class="entbild"></div><div class="entwerte"><p class="pname" style="font-size:1.3em"></p><p class="pauch klein"></p></div></div>';
function initEntP(K){const rw=K.querySelector(".rw"),rb=K.querySelector(".rb"),bild=K.querySelector(".entbild");
  const z=()=>{const w=+rw.value,b=+rb.value,a=5,s=30,A=[40,250],r=w*Math.PI/180;
    const B=[A[0]+a*s,A[1]],D=[A[0]+b*s*Math.cos(r),A[1]-b*s*Math.sin(r)],C=[B[0]+D[0]-A[0],B[1]+D[1]-A[1]];
    let g='<svg viewBox="0 0 420 290" width="420" role="img" aria-label="Viereck">'+poly([A,B,C,D],{fill:PF.flaeche});
    if(w===90){g+=rwB(A,[1,0],[D[0]-A[0],D[1]-A[1]])+rwB(B,[-1,0],[C[0]-B[0],C[1]-B[1]])+rwB(C,[B[0]-C[0],B[1]-C[1]],[-1,0])+rwB(D,[1,0],[A[0]-D[0],A[1]-D[1]]);}
    else g+=wB(A,[1,0],[D[0]-A[0],D[1]-A[1]],42,w+"°");
    if(a===b)g+=strich2(A,B)+strich2(B,C)+strich2(C,D)+strich2(D,A);
    g+=ecken([A,B,C,D],["A","B","C","D"])+T((A[0]+B[0])/2,A[1]+30,"a = 5 cm",{it:true})+T((A[0]+D[0])/2-14,(A[1]+D[1])/2,"b",{it:true,anc:"end"});
    bild.innerHTML=g+'</svg>';
    K.querySelector(".ww").textContent=w;K.querySelector(".wb").textContent=b;
    let n,auch;if(w===90&&a===b){n="Quadrat";auch="Ein Quadrat ist auch ein Rechteck, eine Raute und ein Parallelogramm.";}
    else if(w===90){n="Rechteck";auch="Ein Rechteck ist auch ein Parallelogramm.";}
    else if(a===b){n="Raute";auch="Eine Raute ist auch ein Parallelogramm.";}
    else{n="Parallelogramm";auch="Gegenüberliegende Seiten sind parallel und gleich lang.";}
    K.querySelector(".pname").innerHTML="Das ist ein <b>"+n+"</b>.";K.querySelector(".pauch").textContent=auch;};
  rw.addEventListener("input",z);rb.addEventListener("input",z);z();}

/* ═══ Figuren sortieren: antippen → ja → nein → leer ═══ */
const FIGUREN=[
  {p:[[0,0],[5,0],[7,3],[2,3]],ja:true},
  {p:[[0,0],[6,0],[4.5,3],[1.5,3]],ja:false},
  {p:[[0,0],[6,0],[6,3.4],[0,3.4]],ja:true,rw:true},
  {p:[[2,0],[4,3],[2,4.2],[0,3]],ja:false},
  {p:[[0,0],[4,0],[6.4,3.2],[2.4,3.2]],ja:true,gl:true},
  {p:[[2,0],[4,2],[2,4],[0,2]],ja:true,rw:true,gl:true},
  {p:[[0,0],[5,0.5],[4,3.5],[1,2.5]],ja:false},
  {p:[[0,0],[2.2,1.1],[2.2,5],[0,3.9]],ja:true},
  {p:[[0,0],[5,0],[3,3],[0,3]],ja:false,rwi:[0,3]}];
function figSvg(f){const xs=f.p.map(p=>p[0]),ys=f.p.map(p=>p[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);
  const k=Math.min(110/(Mx-mx),80/(My-my)),ox=10+(110-(Mx-mx)*k)/2,oy=8+(80-(My-my)*k)/2;
  const P=f.p.map(p=>[ox+(p[0]-mx)*k,oy+(My-p[1])*k]);let s='<svg viewBox="0 0 130 96" width="130" aria-hidden="true">'+poly(P,{fill:"#fff"});
  const ri=f.rw?[0,1,2,3]:(f.rwi||[]);ri.forEach(i=>{const p=P[i],v1=P[(i+1)%4],v0=P[(i+3)%4];s+=rwB(p,[v1[0]-p[0],v1[1]-p[1]],[v0[0]-p[0],v0[1]-p[1]],9);});
  if(f.gl)for(let i=0;i<4;i++)s+=strich2(P[i],P[(i+1)%4]);return s+'</svg>';}
function sortHtml(){return '<div class="fsgrid">'+FIGUREN.map((f,i)=>'<button type="button" class="fs epr" data-i="'+i+'" data-soll="'+(f.ja?"ja":"nein")+'" data-z=""><span class="fsnr">'+(i+1)+'</span>'+figSvg(f)+'<span class="fsz">?</span></button>').join("")+'</div>';}
function initSort(K){K.querySelectorAll(".fs").forEach(b=>{
  const zeig=()=>{const z=b.dataset.z;b.querySelector(".fsz").textContent=z===""?"?":(z==="ja"?"ja, Parallelogramm":"nein");b.classList.toggle("fsja",z==="ja");b.classList.toggle("fsnein",z==="nein");};
  b.addEventListener("click",()=>{const o=["","ja","nein"];b.dataset.z=o[(o.indexOf(b.dataset.z)+1)%3];b.classList.remove("ok","falsch");zeig();});
  b._pruef=()=>b.dataset.z===b.dataset.soll;zeig();});}

/* ═══ Höhe auf Karopapier einzeichnen: Fußpunkt auf einen Gitterpunkt tippen ═══
   p: Eckpunkte A,B,C,D in Kästchen (y nach oben), g: [i,j] Grundseite, v: Ecke, von der die Höhe ausgeht, f: richtiger Fußpunkt */
const HOEHEN={
  waag:{p:[[1,1],[7,1],[9,5],[3,5]],g:[0,1],v:3,f:[3,1],text:"Zeichne die Höhe von D auf die Grundseite g = AB."},
  senk:{p:[[1,1],[5,3],[5,7],[1,5]],g:[1,2],v:3,f:[5,5],text:"Das Parallelogramm steht anders. Zeichne die Höhe von D auf die Grundseite g = BC."},
  schraeg:{p:[[1,1],[5,1],[8,4],[4,4]],g:[1,2],v:3,f:[6,2],text:"Zeichne die Höhe von D auf die Grundseite g = BC."},
  aussen1:{p:[[1,1],[4,1],[9,5],[6,5]],g:[0,1],v:3,f:[6,1],aussen:true,text:"Zeichne die Höhe von D auf die Grundseite g = AB."},
  aussen2:{p:[[1,4],[7,4],[10,7],[4,7]],g:[1,2],v:0,f:[4,1],aussen:true,text:"Zeichne die Höhe von A auf die Grundseite g = BC."}};
function hoeheHtml(keys){return keys.map((k,i)=>'<div class="hgbox"><p class="sit"><b>'+"abcdef"[i]+')</b> '+HOEHEN[k].text+'</p><div class="hg epr" data-k="'+k+'"></div></div>').join("");}
function initHoehe(K){K.querySelectorAll(".hg").forEach(el=>{const c=HOEHEN[el.dataset.k],s=28,N=["A","B","C","D"];
  const xs=c.p.map(p=>p[0]).concat(c.f[0]),ys=c.p.map(p=>p[1]).concat(c.f[1]);
  const nx=Math.max(...xs)+1,ny=Math.max(...ys)+1,x0=14,y0=14,W=x0*2+nx*s,H=y0*2+ny*s;
  const S=p=>[x0+p[0]*s,y0+(ny-p[1])*s];let tip=null,geloest=false;
  const male=()=>{const P=c.p.map(S),G1=P[c.g[0]],G2=P[c.g[1]],V=P[c.v];
    let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="Parallelogramm auf Karopapier" style="touch-action:manipulation;cursor:crosshair">'+gitterSvg(x0,y0,nx,ny,s)+poly(P,{fill:"rgba(204,241,236,.55)"});
    g+=lin(G1,G2,{st:PF.grund,sw:5});const gm=[(G1[0]+G2[0])/2,(G1[1]+G2[1])/2],pm=[P.reduce((a,p)=>a+p[0],0)/4,P.reduce((a,p)=>a+p[1],0)/4],gd=ein([gm[0]-pm[0],gm[1]-pm[1]]);
    g+=T(gm[0]+gd[0]*20,gm[1]+gd[1]*20+6,c.lab||"g",{it:!c.lab||c.lab.length<2,fill:"#00805F",b:true});
    if(geloest&&c.aussen){const F=S(c.f),nah=Math.hypot(F[0]-G1[0],F[1]-G1[1])<Math.hypot(F[0]-G2[0],F[1]-G2[1])?G1:G2,d=ein([F[0]-nah[0],F[1]-nah[1]]);
      g+=lin(nah,[F[0]+d[0]*s,F[1]+d[1]*s],{st:PF.grund,sw:2,dash:"6 5"});}
    if(tip){const F=S(tip);g+=lin(V,F,{st:geloest?PF.hoehe:PF.schueler,sw:3})+'<circle cx="'+F[0]+'" cy="'+F[1]+'" r="5" fill="'+(geloest?PF.hoehe:PF.schueler)+'"/>';
      if(geloest){const gd2=[G2[0]-G1[0],G2[1]-G1[1]],zu=[V[0]-F[0],V[1]-F[1]];g+=rwB(F,zu,(Math.hypot(F[0]-G2[0],F[1]-G2[1])>1?[G2[0]-F[0],G2[1]-F[1]]:[G1[0]-F[0],G1[1]-F[1]]),13);
        const hd=ein([F[0]-V[0],F[1]-V[1]]);g+=T((V[0]+F[0])/2-hd[1]*13,(V[1]+F[1])/2+hd[0]*13+5,"h",{it:true,b:true,fill:PF.hoehe});}}
    g+='<circle cx="'+V[0]+'" cy="'+V[1]+'" r="5" fill="#000"/>'+ecken(P,N);
    el.innerHTML=g+'</svg><p class="klein hginfo">'+(tip?(geloest?"Richtig eingezeichnet!":"Dein Fußpunkt ist gesetzt. Tippe woanders hin, um ihn zu verschieben."):"Tippe mit dem Stift genau auf den Gitterpunkt, wo die Höhe die Grundseite trifft.")+'</p>';
    const svg=el.querySelector("svg");
    svg.addEventListener("pointerdown",e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height;
      const gx=Math.round((sx-x0)/s),gy=ny-Math.round((sy-y0)/s);if(gx<0||gy<0||gx>nx||gy>ny)return;
      tip=[gx,gy];geloest=false;el.classList.remove("ok","falsch");male();});};
  el._pruef=()=>{const ok=!!tip&&tip[0]===c.f[0]&&tip[1]===c.f[1];geloest=ok;male();return ok;};
  male();});}

/* ═══ „Welche Strecke ist die Höhe?“ ═══ */
function nrKreis(p,n,f){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="#fff" stroke="'+f+'" stroke-width="2"/>'+T(p[0],p[1]+5,n,{fs:13,b:true,fill:f});}
function streckenSvg(t){const s=20;let g='<svg viewBox="0 0 280 190" width="280" role="img" aria-label="Parallelogramm mit drei Strecken">'+gitterSvg(0,0,14,9,s);
  let P,L,G;

const DGC="#1565C0",DHC="#C2410C";
const _f=x=>(+x).toFixed(1);
/* Dreieck: P = [[x,y],…] in cm (y nach oben). o: s (px/cm), real (Originalgröße, für das Geodreieck), tk {AB:2,…}, rw "A"|"B"|"C",
   w {A:"60°"}, h (Höhe von C auf AB), hs ("AC"|"BC": Höhe ist Seite), gl, hl (Beschriftungen), ecken (Standard ja) */
function dr(P,o){o=o||{};const s=o.real?34:(o.s||22),pad=o.pad||(o.hl?70:30);
  const N={A:P[0],B:P[1],C:P[2]};const A=N.A,B=N.B,C=N.C;
  const dx=B[0]-A[0],dy=B[1]-A[1],t=((C[0]-A[0])*dx+(C[1]-A[1])*dy)/(dx*dx+dy*dy),F=[A[0]+t*dx,A[1]+t*dy];
  const pts=[A,B,C].concat(o.h?[F]:[]),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const W=(x1-x0)*s+2*pad,H=(y1-y0)*s+60;

  g+='<polygon points="'+[q("A"),q("B"),q("C")].map(p=>_f(p[0])+","+_f(p[1])).join(" ")+'" fill="'+(o.real?"#fff":"#E8F5EE")+'" stroke="none"/>';
  [["A","B"],["B","C"],["C","A"]].forEach(([u,v])=>{const k=u+v;let col="#000",w=2.2;
    if(o.gl&&k==="AB"){col=DGC;w=3.5}if(o.hs&&(o.hs===k||o.hs===v+u)){col=DHC;w=3.5}
    g+='<line x1="'+_f(q(u)[0])+'" y1="'+_f(q(u)[1])+'" x2="'+_f(q(v)[0])+'" y2="'+_f(q(v)[1])+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';});
  if(o.h&&!o.hs){const f=T(F),c=q("C");
    if(t<0)g+='<line x1="'+_f(f[0])+'" y1="'+_f(f[1])+'" x2="'+_f(q("A")[0])+'" y2="'+_f(q("A")[1])+'" stroke="#000" stroke-width="1.4" stroke-dasharray="5 4"/>';
    if(t>1)g+='<line x1="'+_f(q("B")[0])+'" y1="'+_f(q("B")[1])+'" x2="'+_f(f[0])+'" y2="'+_f(f[1])+'" stroke="#000" stroke-width="1.4" stroke-dasharray="5 4"/>';
    g+='<line x1="'+_f(c[0])+'" y1="'+_f(c[1])+'" x2="'+_f(f[0])+'" y2="'+_f(f[1])+'" stroke="'+DHC+'" stroke-width="2.4" stroke-dasharray="7 5"/>';
    const u=ein([c[0]-f[0],c[1]-f[1]]),v=ein([(t>.5?q("A"):q("B"))[0]-f[0],(t>.5?q("A"):q("B"))[1]-f[1]]);g+=rwB(f,u,v,11);
    if(o.hl){const m=[(c[0]+f[0])/2,(c[1]+f[1])/2],rechts=t>1;g+=T2(m[0]+(rechts?8:-8),m[1]+5,o.hl,{fill:DHC,anchor:rechts?"start":"end"});}}
  if(o.hs&&o.hl){const a=q(o.hs[0]),b=q(o.hs[1]);g+=T2((a[0]+b[0])/2-8,(a[1]+b[1])/2+5,o.hl,{fill:DHC,anchor:"end"});}
  if(o.gl){const a=q("A"),b=q("B");g+=T2((a[0]+b[0])/2,a[1]+24,o.gl,{fill:DGC});}
  for(const k in (o.tk||{})){const a=q(k[0]),b=q(k[1]);g+=strich2(a,b);}
  const cx=(q("A")[0]+q("B")[0]+q("C")[0])/3,cy=(q("A")[1]+q("B")[1]+q("C")[1])/3;
  for(const v of ["A","B","C"]){const p=q(v),an=["A","B","C"].filter(x=>x!==v).map(x=>q(x));
    const u1=ein([an[0][0]-p[0],an[0][1]-p[1]]),u2=ein([an[1][0]-p[0],an[1][1]-p[1]]);
    if(o.rw===v)g+=rwB(p,u1,u2,15);else if(o.w&&o.w[v])g+=wB(p,u1,u2,o.w[v].length>3?34:28,o.w[v]);
    if(o.ecken!==false){const d=ein([p[0]-cx,p[1]-cy]);g+=T2(p[0]+d[0]*16,p[1]+d[1]*16+6,v,{});}}
  return g+'</svg>';}
function T2(x,y,t,o){return '<text x="'+_f(x)+'" y="'+_f(y)+'" font-family="Arial" font-size="'+(o.fs||16)+'" font-weight="700" text-anchor="'+(o.anchor||"middle")+'" fill="'+(o.fill||"#000")+'" stroke="#fff" stroke-width="4" paint-order="stroke">'+t+'</text>';}
/* Winkel: Scheitel, ein Schenkel waagerecht nach rechts. o: L (px), lab (Gradzahl im Bogen), real (für das Geodreieck: 1 cm = 34 px) */
function wk(d,o){o=o||{};const L=o.real?136:(o.L||90),r=o.lab?Math.max(26,L*.32):24,a=d*Math.PI/180;
  const pts=[[0,0],[L,0],[L*Math.cos(a),-L*Math.sin(a)]];for(let i=0;i<=16;i++)pts.push([r*Math.cos(a*i/16),-r*Math.sin(a*i/16)]);
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs)-14,y0=Math.min(...ys)-14,W=Math.max(...xs)-x0+14,H=Math.max(...ys)-y0+14;

  g+=lin(S,E,{sw:2.4})+lin(S,Z,{sw:2.4})+'<circle cx="'+_f(S[0])+'" cy="'+_f(S[1])+'" r="3"/>';
  if(d===90)g+=rwB(S,[1,0],[0,-1],18);

    if(o.lab){const m=ea/2;g+=T2(S[0]+r*.6*Math.cos(m)+(d<40?6:0),S[1]-r*.6*Math.sin(m)+5,d+"°",{fs:13});}}

/* ═══ Zusammengesetzte Figuren: Zeichenhelfer ═══ */
const ZB="#1565C0",ZO="#C2410C",ZG="#2E7D32",ZR="#C62828",ZFILL={0:"#E3F0FB",1:"#DCEBFB",2:"#FFE3D3",3:"#DFF1E0"},ZNC={1:ZB,2:ZO,3:ZG};
const zU=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l]};
const zArea=P=>{let s=0;P.forEach((p,i)=>{const q=P[(i+1)%P.length];s+=p[0]*q[1]-q[0]*p[1]});return s/2};
const zCen=P=>[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
function zTx(x,y,t,o){o=o||{};return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-family="Arial" font-size="'+(o.fs||15)+'" text-anchor="middle" dominant-baseline="central" fill="'+(o.fill||"#000")+'"'+(o.b?' font-weight="700"':'')+(o.halo?' stroke="#fff" stroke-width="4" paint-order="stroke"':'')+'>'+String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text>';}
/* o.pts in Einheiten, o.s Pixel pro Einheit; lab {Kante:Text}; parts; cut; comp; holes; htxt; dims; tap */
function zf(o){
  const s=o.s||24,fs=15,P=o.pts,all=P.concat(...(o.dims||[]).map(d=>[d.a,d.b]));
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),mx=Math.min(...xs),Mx=Math.max(...xs),my=Math.min(...ys),My=Math.max(...ys);
  const labs=Object.values(o.lab||{}).concat((o.dims||[]).map(d=>d.t)),ml=Math.max(2,...labs.map(x=>x.length)),pad=fs*(1.6+ml*.45);
  const S=p=>[(p[0]-mx)*s+pad,(My-p[1])*s+pad],W=(Mx-mx)*s+2*pad,H=(My-my)*s+2*pad;
  const pts=Q=>Q.map(S).map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const ln=(a,b,col,w,dash,cls,extra)=>{const A=S(a),B=S(b);return '<line'+(cls?' class="'+cls+'"':'')+(extra||'')+' x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="7 5"':'')+' stroke-linecap="round"/>';};
  let g='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" width="'+W.toFixed(0)+'" style="max-width:100%;height:auto;overflow:visible" role="img" aria-label="Zusammengesetzte Figur">';
  if(o.gitter){for(let x=Math.ceil(mx);x<=Mx;x++)g+=ln([x,my],[x,My],"#ddd",1);for(let y=Math.ceil(my);y<=My;y++)g+=ln([mx,y],[Mx,y],"#ddd",1);}
  if(o.comp)g+='<polygon points="'+pts(o.comp)+'" fill="#ececec" stroke="#777" stroke-width="2" stroke-dasharray="7 5"/>';
  g+='<polygon points="'+pts(P)+'" fill="'+ZFILL[0]+'"/>';
  (o.parts||[]).forEach(q=>g+='<polygon points="'+pts(q.pts)+'" fill="'+ZFILL[q.c]+'"/>');
  (o.holes||[]).forEach(h=>g+='<polygon points="'+pts(h)+'" fill="#fff" stroke="#000" stroke-width="2.5"/>');
  (o.cut||[]).forEach(c=>g+=ln(c[0],c[1],"#333",2.2,1));
  g+='<polygon points="'+pts(P)+'" fill="none" stroke="#000" stroke-width="2.8" stroke-linejoin="round"/>';
  (o.parts||[]).forEach(q=>{const c=S(q.np||zCen(q.pts));g+=zTx(c[0],c[1],q.n,{fs:19,b:1,fill:ZNC[q.c]});});
  const kanten=(Q,lab,innen)=>{const ccw=zArea(Q)>0;Q.forEach((A0,i)=>{const t=lab[i];if(!t)return;const B0=Q[(i+1)%Q.length],A=S(A0),B=S(B0),M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
    const d=zU(B0[0]-A0[0],B0[1]-A0[1]);let n=ccw?[d[1],-d[0]]:[-d[1],d[0]];if(innen)n=[-n[0],-n[1]];const nS=[n[0],-n[1]];
    const off=fs*.8+Math.abs(nS[0])*t.length*fs*.28;g+=zTx(M[0]+off*nS[0],M[1]+off*nS[1],t,{b:t==="?",fill:t==="?"?ZR:"#000"});});};
  if(o.lab)kanten(P,o.lab,false);
  if(o.htxt&&o.holes){const c=S(zCen(o.holes[0]));o.htxt.forEach((z,j)=>g+=zTx(c[0],c[1]+(j-(o.htxt.length-1)/2)*13,z,{fs:12}));}
  (o.dims||[]).forEach(d=>{const A=S(d.a),B=S(d.b),u=zU(B[0]-A[0],B[1]-A[1]),n=[-u[1],u[0]],M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
    if(d.ext){g+=ln(d.a,d.b,"#333",1.6);[A,B].forEach(p=>g+='<line x1="'+(p[0]-6*n[0]).toFixed(1)+'" y1="'+(p[1]-6*n[1]).toFixed(1)+'" x2="'+(p[0]+6*n[0]).toFixed(1)+'" y2="'+(p[1]+6*n[1]).toFixed(1)+'" stroke="#333" stroke-width="1.6"/>');}
    else{g+=ln(d.a,d.b,ZO,2.4,1);if(d.ra)g+=rwB(A,u,[u[1],-u[0]],11);}
    const sg=d.ext?(Math.abs(n[1])>.5?-1:1):-1,off=fs*.55+Math.abs(n[0])*d.t.length*fs*.28;
    g+=zTx(M[0]+sg*off*n[0],M[1]+sg*off*n[1],d.t,{fill:d.ext?"#000":ZO,b:!d.ext,halo:1});});
  /* Tippen */
  if(o.tap==="kanten"){P.forEach((A0,i)=>{const B0=P[(i+1)%P.length];g+='<g class="tl" data-ok="1">'+ln(A0,B0,"transparent",18,0,"hit")+ln(A0,B0,"transparent",6,0,"vis")+'</g>';});
    (o.innen||[]).forEach(c=>g+='<g class="tl" data-ok="0">'+ln(c[0],c[1],"transparent",18,0,"hit")+ln(c[0],c[1],"#333",2.2,1,"vis")+'</g>');}
  if(o.tap==="schnitt")(o.kand||[]).forEach(c=>g+='<g class="tl" data-ok="'+(c[2]?1:0)+'">'+ln(c[0],c[1],"transparent",18,0,"hit")+ln(c[0],c[1],"#9e9e9e",3,1,"vis")+'</g>');
  if(o.tap==="stueck"){(o.reg||[]).forEach(r=>g+='<polygon class="tr" data-ok="'+(r.ok?1:0)+'" points="'+pts(r.pts)+'" fill="rgba(255,255,255,.01)" stroke="#999" stroke-width="2" stroke-dasharray="7 5"/>');}
  return g+'</svg>';}
/* Tipp-Aufgaben: kanten = alle Außenseiten antippen · schnitt = eine passende Trennlinie wählen · stueck = fehlendes Stück antippen */
function tapHtml(figs){return '<div class="tapgrid">'+figs.map((f,i)=>'<div class="tapbox"><p class="sit"><b>'+"abcdef"[i]+')</b> '+(f.text||"")+'</p><div class="tapw epr" data-modus="'+f.tap+'">'+zf(f)+'</div></div>').join("")+'</div>';}
function initTap(K){K.querySelectorAll(".tapw").forEach(w=>{const m=w.dataset.modus,els=[...w.querySelectorAll(".tl,.tr")];
  els.forEach(e=>e.addEventListener("click",()=>{if(m==="schnitt")els.forEach(x=>{if(x!==e)x.classList.remove("an");});e.classList.toggle("an");w.classList.remove("ok","falsch");}));
  w._pruef=()=>{const an=els.filter(e=>e.classList.contains("an"));
    if(m==="schnitt")return an.length===1&&an[0].dataset.ok==="1";
    return els.every(e=>e.classList.contains("an")===(e.dataset.ok==="1"));};});}

function rechteckBild(W0,H0,poly,extra){const sc=32,pad=46,X=x=>pad+x*sc,Y=y=>pad+(H0-y)*sc;
  let s='<svg viewBox="0 0 '+(W0*sc+2*pad)+' '+(H0*sc+2*pad)+'" width="'+(W0*sc+2*pad)+'" style="max-width:100%;height:auto">';
  s+='<rect x="'+X(0)+'" y="'+Y(H0)+'" width="'+W0*sc+'" height="'+H0*sc+'" fill="#f4f4f4" stroke="#999" stroke-width="2" stroke-dasharray="7 5"/>';
  s+='<polygon points="'+poly.map(p=>X(p[0])+","+Y(p[1])).join(" ")+'" fill="#DCEBFB" stroke="#000" stroke-width="3"/>';
  return s+(extra?extra(X,Y,sc):"")+'</svg>';}

.sort button[data-nr]::before{content:attr(data-nr);position:absolute;left:-.1em;top:-.65em;font-size:.65em;font-weight:700;background:#00805F;color:#fff;border-radius:1em;min-width:1.5em;line-height:1.5em;text-align:center}
.sort button[data-nr]{background:#D3F2E5}
.sortreihe{color:#444;min-height:1.4em}
.pruefleiste{display:flex;flex-wrap:wrap;align-items:center;gap:.8em;margin-top:.7em}
button.pruefen,button.knopf{font:inherit;font-size:.9em;background:#fff;color:#000;border:1.5px solid #00805F;padding:.3em 1em;cursor:pointer;border-radius:0;font-weight:700}
button.pruefen:hover,button.knopf:hover{background:#D3F2E5}
button.knopf.warnung{background:#00805F;color:#fff}
button:focus-visible{outline:3px solid #00805F;outline-offset:2px}
.ergebnis{font-weight:700}.ergebnis.gut{color:#2e7d32}.ergebnis.noch{color:#C62828}
.fuss{text-align:right;font-style:italic;color:#6F6F6F;font-size:.7em;margin:1.2em 0 0}
nav.reiter{display:flex;flex-wrap:wrap;gap:.4em;margin:0 0 .7em}
nav.reiter button{font:inherit;font-size:.85em;border:2px solid #00805F;background:#fff;color:#000;padding:.35em .8em;cursor:pointer;border-radius:0}
nav.reiter button b{margin-right:.35em}
nav.reiter button[aria-selected="true"]{background:#00805F;color:#fff}
@media (max-width:820px){.raster4{grid-template-columns:repeat(2,minmax(0,1fr))}.raster3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.raster2,.raster3{grid-template-columns:1fr}.zuo{gap:.5em 1.2em}}

/* Geometrie (Woche 2) */
.fsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7em}
.fs{position:relative;background:#fff;border:2px solid #bbb;border-radius:10px;padding:.4em .3em .5em;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center}
.fs svg{max-width:100%;height:auto}.fsnr{position:absolute;left:.45em;top:.3em;font-weight:700;color:#555}
.fsz{font-weight:700;margin-top:.2em}.fs.fsja{border-color:#00805F;background:#E6F7F4}.fs.fsnein{border-color:#777;background:#F2F2F2}
.hgbox{margin:.4em 0 1em}.hg{display:inline-block;border:2px solid transparent;border-radius:8px;padding:4px;max-width:100%}.hg svg{max-width:100%;height:auto;display:block}
.hg.ok{background:#fff!important}.hg.falsch{background:#fff!important}.hginfo{margin:.3em 0 0}
.strgrid{display:flex;flex-wrap:wrap;gap:1em 1.6em}.strbox svg{max-width:100%;height:auto;display:block}
.tapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tapbox{border:1px dashed #bbb;border-radius:8px;padding:6px}.tapw{display:flex;justify-content:center;border-radius:8px;padding:4px}.tapw.ok{background:#E8F5E9}.tapw.falsch{background:#FFEBEE}.tl{cursor:pointer}.tl.an .vis{stroke:#E65100!important;stroke-width:6px;stroke-dasharray:none}.tr{cursor:pointer}.tr.an{fill:#FFCC80!important;stroke:#E65100}
</style>
<style>.entw{display:flex;flex-wrap:wrap;gap:18px;align-items:center}.entw input[type=range]{width:260px}.entname{font-size:22px;font-weight:bold;color:#00805F}
.klein{font-size:15px;color:#333;font-weight:normal}.regler{display:flex;flex-direction:column;gap:6px}.regler label{display:flex;gap:8px;align-items:center;font-weight:bold}
.kn{font:inherit;font-size:15px;font-weight:bold;border:2px solid #00805F;background:#fff;color:#00805F;border-radius:8px;padding:6px 12px;cursor:pointer}
.vlk{font-size:16px;border:1.5px solid #00805F;background:#fff;border-radius:8px;cursor:pointer;padding:1px 8px;margin-left:4px}
svg.mess,svg.dsvg,svg.wsvg{max-width:none}.sit svg{display:block;margin:4px 0}</style></head>
<body>
<div class="wrap">
<p class="oben" id="oben"></p>
<nav class="reiter" role="tablist" aria-label="Übungen" id="reiter"></nav>
<div class="fortschritt"><span id="stand"></span><button type="button" class="knopf" id="neu">Neu beginnen</button></div>
<div id="blaetter"></div>
<p class="fuss" id="fuss"></p>
</div>
<script>
/* ─── Motor: Technik (nicht ändern) ─── */
(function(){
"use strict";
const ABC="abcdefghijklmnopqrstuvwxyz";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const deZahl=x=>{const r=Math.round(x*1e9)/1e9;return String(r).replace(".",",");};
const wert=s=>{s=String(s).trim().replace(/\s/g,"");if(s.includes("/")){const[a,b]=s.split("/");return num(a)/num(b);}return num(s);};
const num=s=>{const t=String(s).replace(/\s+/g,"").replace(",",".");return t!==""&&!isNaN(t)?parseFloat(t):NaN;};
const norm=s=>String(s).replace(/\s+/g,"").replace(/\./g,",").replace(/%$/,"").toLowerCase();
const mischen=a=>{const b=a.slice();if(b.length<2)return b;let n=0;do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}n++;}while(n<20&&b.every((x,i)=>x===a[i]));return b;};

/* Kurzschrift → HTML */
function feld(antw,label){
  let fid="";antw=antw.replace(/#(\w+)\s*$/,(m,s)=>{fid=s;return "";});
  const alle=antw.split("|").map(x=>x.trim());
  const lang=Math.max(...alle.map(x=>x.length));
  const zahl=alle.every(x=>/^[\d\s,.%+\-]*$/.test(x));
  const w=zahl||lang<=2?Math.max(2.6,lang*.55+1.5).toFixed(1):Math.max(5,Math.min(9,lang*.5+1.5)).toFixed(1);
  return '<input class="ein" data-a="'+esc(alle.join("|"))+'"'+(fid?' data-id="'+fid+'"':'')+' style="width:'+w+'em"'+(zahl?' inputmode="decimal"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="'+(label||"Antwort")+'">';
}
function inl(t){
  t=String(t);const lager=[];const pack=h=>"\u0001"+(lager.push(h)-1)+"\u0002";
  t=t.replace(/\(\((.*?)\)\)/g,(m,inh)=>{
    const opt=inh.split("|").map(x=>x.trim());let soll="";
    const kn=opt.map(o=>{let z=o;if(z.startsWith("*")){z=z.slice(1).trim();soll=z;}return z;});
    const kl="auswahl";
    return pack('<span class="'+kl+'" data-soll="'+esc(soll)+'">'+kn.map(z=>'<button type="button" data-z="'+esc(z)+'">'+inl(z)+'</button>').join("")+'</span>');
  });
  t=t.replace(/\[satz:([^:\]]+):([^\]]*)\]/g,(m,w,e)=>pack('<span class="antw-z" style="display:block;width:100%"><b>Antwortsatz:</b> <input type="text" class="ein antw" autocomplete="off" aria-label="Antwortsatz" data-w="'+esc(w)+'" data-e="'+esc(e)+'"></span>'));
  t=t.replace(/\[([GWP]):([^\]]*)\]/g,(m,r,z)=>pack('<span class="mk" data-r="" data-soll="'+r+'">'+z+'</span>'));
  t=t.replace(/\[=([^\]]*)\]/g,(m,v)=>pack('<span class="frac fin" data-v="'+wert(v)+'"><span class="fz"><input class="ein" style="width:2.8em" inputmode="numeric" autocomplete="off" aria-label="Zähler"></span><span class="fn"><input class="ein" style="width:2.8em" inputmode="numeric" autocomplete="off" aria-label="Nenner"></span></span>'));
  t=t.replace(/\[@(\w+)\]/g,(m,id)=>pack('<input class="ein echo" readonly tabindex="-1" data-echo="'+id+'" style="width:4.8em" aria-label="Dein Wert von vorhin">'));
  t=t.replace(/\[([^\[\]]*)\]/g,(m,a)=>pack(feld(a)));
  t=t.replace(/\{([^{}]*)\}/g,(m,inh)=>{const i=inh.indexOf("/");if(i<0)return m;
    return '<span class="frac"><span class="fz">'+inh.slice(0,i).trim()+'</span><span class="fn">'+inh.slice(i+1).trim()+'</span></span>';});
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  t=t.replace(/<blau>/g,'<span class="Gt">').replace(/<orange>/g,'<span class="Wt">').replace(/<gruen>/g,'<span class="Pt">').replace(/<\/(blau|orange|gruen)>/g,"</span>");
  for(let k=0;k<3;k++)t=t.replace(/\u0001(\d+)\u0002/g,(m,i)=>lager[+i]);
  return t;
}
const nr=(i,a)=>a.nummern===false?"":"<b>"+ABC[i]+")</b> ";
const raster=(a,std)=>"raster"+(a.spalten||std||1);

/* Aufgabenarten */
const ARTEN={
  eigen(a){return a.html||"";},
  luecke(a){
    if(a.items.some(x=>typeof x==="object"))
      return a.items.map((it,i)=>{if(typeof it==="string")return '<p>'+nr(i,a)+inl(it)+'</p>';
        let h=it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':"";
        const z=it.z==null?[]:it.z;
        if(Array.isArray(z))h+='<p class="gw">'+z.map(x=>'<span>'+inl(x)+'</span>').join("")+'</p>';else h+='<p>'+inl(z)+'</p>';
        return h;}).join("");
    const sp=a.spalten||1;
    return '<div class="'+raster(a)+(a.gross?" gross":"")+'">'+a.items.map((x,i)=>'<div'+(sp>1?' class="km"':'')+'>'+nr(i,a)+inl(x)+'</div>').join("")+'</div>';
  },
  erweitern(a){
    const ziel=a.ziel||100;
    return '<div class="'+raster(a,4)+'">'+a.items.map((b,i)=>{const[z,n]=String(b).split("/").map(Number);const f=ziel/n;
      return '<div class="erw">'+nr(i,a)+inl("{"+z+"/"+n+"}")+'<span class="erwm"><span class="lab">· '+feld(deZahl(f),"Faktor")+'</span><span>=</span></span>'+inl("{["+deZahl(z*f)+"]/"+ziel+"}")+'</div>';}).join("")+'</div>';
  },
  hunderterfeld(a){
    return '<div class="'+raster(a,3)+'">'+a.items.map((it,i)=>{const n=typeof it==="object"?it.an:it;
      const z=typeof it==="object"&&it.z?it.z:"{["+n+"]/100} = ["+deZahl(n/100)+"] = ["+n+"] %";
      let g='<div class="g100">';for(let k=0;k<100;k++)g+='<i'+(k<n?' class="an"':'')+'></i>';g+='</div>';
      return '<div class="fig">'+(a.nummern===false?"":"<b>"+ABC[i]+")</b>")+g+'<div class="zeile">'+inl(z)+'</div></div>';}).join("")+'</div>';
  },
  faerben(a){
    let g='<div class="g100 malen" data-soll="'+a.soll+'">';for(let k=0;k<100;k++)g+='<i></i>';
    return '<div class="malbox">'+g+'</div><p class="zaehler">Gefärbt: <b>0</b> Kästchen</p></div>';
  },
  tabelle(a){
    const n=a.nummern!==false;
    let h='<div class="scroll"><table class="tab"><tr>'+(n?'<th class="nr"></th>':'')+a.kopf.map(k=>'<th>'+inl(k)+'</th>').join("")+'</tr>';
    a.zeilen.forEach((z,i)=>{h+='<tr>'+(n?'<td class="nr">'+ABC[i]+')</td>':'')+z.map(c=>'<td>'+inl(c)+'</td>').join("")+'</tr>';});
    return h+'</table></div>';
  },
  vergleichen(a){
    return '<div class="'+raster(a,2)+'">'+a.items.map(([l,s,r])=>'<div class="vgl"><span>'+inl(l)+'</span><span class="wahl" data-soll="'+esc(s)+'"><button type="button" data-z="<">&lt;</button><button type="button" data-z="=">=</button><button type="button" data-z=">">&gt;</button></span><span>'+inl(r)+'</span></div>').join("")+'</div>';
  },
  auswahl(a){
    return a.items.map(([t,r,opt])=>{const o=opt||a.optionen;
      return '<div class="wegz">'+inl(t)+inl("(("+o.map(x=>(x===r?"*":"")+x).join("|")+"))")+'</div>';}).join("");
  },
  markieren(a){
    return a.items.map((t,i)=>'<p class="sit">'+nr(i,a)+inl(t)+'</p>').join("");
  },
  streifen(a){
    return a.items.map((it,i)=>{const p=Math.max(0,Math.min(100,it.anteil));
      return (it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':(a.items.length>1&&a.nummern!==false?'<p>'+nr(i,a)+'</p>':''))+
      '<div class="streifen"><div class="str-oben"><span class="Wt">W = '+inl(it.W)+'</span></div>'+
      '<div class="str-bar"><div class="str-w" style="width:'+p+'%"></div></div>'+
      '<div class="str-mitte"><span class="Pt">p % = '+inl(it.p)+'</span></div>'+
      '<svg class="str-klammer" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 Q1 7 8 7 L44 7 Q50 7 50 13 Q50 7 56 7 L92 7 Q99 7 99 1" fill="none" stroke="#1565C0" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'+
      '<div class="str-g Gt">G = '+inl(it.G)+' ≙ 100 %</div></div>';}).join("");
  },
  verhaeltnis(a){
    return a.items.map((it,i)=>{
      const x=it.x||"W";const ans=it.ansatz!==false;
      const teil=k=>{const v=deZahl(it[k]);if(k===x)return ans?"[x]":"x";return ans?"["+v+"]":v;};
      const fr=(o,u)=>'<span class="frac"><span class="fz">'+o+'</span><span class="fn">'+u+'</span></span>';
      const bs=deZahl(it.bas||100);
      const gi=k=>'<input class="ein gl" data-pos="'+k+'" style="width:3.6em" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Feld der Verhältnisgleichung">';
      const tok=k=>k===x?"x":deZahl(it[k]);
      const sol=JSON.stringify([tok("G"),bs,tok("W"),tok("p")]);
      const glei=ans?fr(gi(0),gi(1)+" %")+" = "+fr(gi(2),gi(3)+" %"):fr(inl(teil("G")),bs+" %")+" = "+fr(inl(teil("W")),inl(teil("p"))+" %");
      const ein=it.einheit?" "+it.einheit:"";
      const id=it.id?"#"+it.id:"";
      const erg='x = '+inl("["+deZahl(it[x])+(ein?"|"+deZahl(it[x])+ein:"")+id+"]")+(x==="p"?"":ein);
      return (it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':'<p>'+nr(i,a)+'</p>')+
        '<div class="vgl-gl"'+(ans?' data-gl="1" data-sol="'+esc(sol)+'"':'')+'><span>'+glei+'</span></div>'+
        '<p>'+erg+'</p>'+(it.antwort?'<p class="antw-z"><b>Antwortsatz:</b> <input type="text" class="ein antw" autocomplete="off" aria-label="Antwortsatz" data-w="'+deZahl(it[x])+'" data-e="'+(it.einheit||"")+'"></p>':'');}).join("")+(a.nach?"":"");
  },
  streifenbau(a){
    const rows=a.daten.map((d,i)=>'<tr data-n="'+esc(d[0])+'"><td style="text-align:left"><i class="sw" style="background:'+DFARBEN[i%5]+'"></i> '+esc(d[0])+'</td><td>'+deZahl(d[1])+' %</td><td>'+feld(deZahl(d[1]/10),"Länge")+' cm</td></tr>').join("");
    return '<div class="scroll"><table class="tab"><tr><th>Bereich</th><th>p %</th><th>Länge</th></tr>'+rows+'</table></div><div class="live" data-typ="streifen"></div>';
  },
  kreisbau(a){
    const rows=a.daten.map((d,i)=>'<tr data-n="'+esc(d[0])+'"><td style="text-align:left"><i class="sw" style="background:'+DFARBEN[i%5]+'"></i> '+esc(d[0])+'</td><td>'+deZahl(d[1])+' %</td><td>'+feld(String(Math.round(d[1]*3.6)),"Winkel")+'°</td></tr>').join("");
    return '<div class="scroll"><table class="tab"><tr><th>Bereich</th><th>p %</th><th>Winkel</th></tr>'+rows+'</table></div><div class="live" data-typ="kreis"></div>';
  },
  zuordnen(a){
    const re=mischen(a.paare.map((p,i)=>i));
    return '<div class="zuo">'+a.paare.map((p,i)=>'<button type="button" data-s="l" data-i="'+i+'">'+inl(p[0])+'</button>'+
      '<button type="button" data-s="r" data-i="'+re[i]+'">'+inl(a.paare[re[i]][1])+'</button>').join("")+'</div>';
  },
  richtigfalsch(a){
    return a.items.map(([t,r],i)=>'<div class="wegz"><span>'+nr(i,a)+inl(t)+'</span>'+inl(r?"((*richtig|falsch))":"((richtig|*falsch))")+'</div>').join("");
  },
  sortieren(a){
    const m=mischen(a.items.map((x,i)=>i));
    return '<div class="sort" data-n="'+a.items.length+'">'+m.map(i=>'<button type="button" data-i="'+i+'">'+inl(a.items[i])+'</button>').join("")+'</div><p class="sortreihe"></p>';
  }
};
const AUFTRAG={streifenbau:"Rechne die Länge aus und trage sie ein. Dein Streifen wächst unter der Tabelle.",
  kreisbau:"Rechne den Winkel aus (ganze Grad) und trage ihn ein. Dein Kreis wächst unter der Tabelle.",
  vergleichen:"Tippe auf &lt;, = oder &gt;.",
  markieren:'Tippe jede fett gedruckte Zahl an: 1× <b class="Gt">blau = G</b>, 2× <b class="Wt">orange = W</b>, 3× <b class="Pt">grün = p %</b>.',
  zuordnen:"Was gehört zusammen? Tippe links und dann rechts an.",
  richtigfalsch:"Richtig oder falsch? Tippe an.",
  sortieren:"Tippe die Zahlen der Größe nach an. Beginne mit der kleinsten.",
  verhaeltnis:"Stelle die Verhältnisgleichung auf. Schreibe x für die gesuchte Größe. Trage dann das Ergebnis ein.",
  faerben:"Tippe Kästchen an oder wische darüber."};

function baueAufgabe(a,n){
  let inh=ARTEN[a.art]?ARTEN[a.art](a):'<p style="color:#C62828">Unbekannte Aufgabenart: '+esc(a.art)+'</p>';
  if(a.bild)inh=a.bildoben?'<div class="bild">'+a.bild+'</div>'+inh:'<div class="bildbox"><div class="bild">'+a.bild+'</div><div class="rest">'+inh+'</div></div>';
  const auf=a.auftrag!=null?inl(a.auftrag):(AUFTRAG[a.art]||"");
  const ohne=a.art==="eigen"&&!a.nach;
  return '<section class="kasten"'+(ohne?'':' data-aufgabe')+'><h2>Aufgabe '+n+(a.name?' · '+esc(a.name):'')+(a.stern?' ★':'')+'</h2><div class="innen">'+
    (auf?'<p class="auftrag">'+auf+'</p>':'')+inh+(a.nach?inl(a.nach):'')+
    (ohne?'':'<div class="pruefleiste"><button type="button" class="pruefen">Prüfen</button><span class="ergebnis" aria-live="polite"></span></div>')+'</div></section>';
}
function baueBlatt(u,i){
  const s=document.createElement("section");s.className="blatt";s.id="uebung"+(i+1);s.hidden=true;
  s.innerHTML='<div class="titel">'+esc(u.titel)+'</div>'+u.aufgaben.map((a,k)=>baueAufgabe(a,k+1)).join("");
  binde(s);const K=s.querySelectorAll("section.kasten");u.aufgaben.forEach((a,k)=>{if(typeof a.init==="function")a.init(K[k]);});return s;
}

/* Bedienung */
function binde(B){
  B.querySelectorAll(".wahl,.auswahl").forEach(g=>g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    g.querySelectorAll("button").forEach(x=>x.classList.toggle("an",x===b));g.classList.remove("ok","falsch");})));
  B.querySelectorAll(".mk").forEach(m=>m.addEventListener("click",()=>{const o=["","G","W","P"];m.dataset.r=o[(o.indexOf(m.dataset.r)+1)%4];m.classList.remove("falsch");}));
  B.querySelectorAll(".g100.malen").forEach(g=>{
    let modus=null;const z=g.closest(".innen").querySelector(".zaehler b");
    const upd=()=>{if(z)z.textContent=g.querySelectorAll("i.an").length;g.classList.remove("ok","falsch");};
    const zelle=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===g?el:null;};
    g.addEventListener("pointerdown",e=>{const c=zelle(e);if(!c)return;modus=!c.classList.contains("an");c.classList.toggle("an",modus);g.setPointerCapture(e.pointerId);e.preventDefault();upd();});
    g.addEventListener("pointermove",e=>{if(modus===null)return;const c=zelle(e);if(c&&c.classList.contains("an")!==modus){c.classList.toggle("an",modus);upd();}});
    ["pointerup","pointercancel"].forEach(n=>g.addEventListener(n,()=>modus=null));
  });
  B.querySelectorAll(".zuo").forEach(Z=>{
    let gew=null;
    const farbe=()=>{const L=[...Z.querySelectorAll('[data-s="l"]')];let k=0;
      Z.querySelectorAll("button").forEach(b=>{delete b.dataset.p;delete b.dataset.nr;b.classList.remove("ok","falsch");});
      L.forEach(l=>{if(l.dataset.mit!=null&&l.dataset.mit!==""){const r=Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]');
        l.dataset.p=r.dataset.p=k%8;l.dataset.nr=r.dataset.nr=++k;}});};
    Z.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const seite=b.dataset.s;
      // schon verbunden → lösen
      if(seite==="l"&&b.dataset.mit){b.dataset.mit="";gew=null;Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));farbe();return;}
      if(seite==="r"){const l=Z.querySelector('[data-s="l"][data-mit="'+b.dataset.i+'"]');if(l&&!(gew&&gew.dataset.s==="l")){l.dataset.mit="";farbe();return;}}
      if(!gew||gew.dataset.s===seite){Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));gew=b;b.classList.add("wahl1");return;}
      const l=seite==="l"?b:gew,r=seite==="r"?b:gew;

function EREG(e){if(!e)return null;const B="(^|[^a-zäöüß])",Z="(?![a-zäöüß²2])",W={mm:"millimeter",cm:"zentimeter",dm:"dezimeter",m:"meter",km:"kilometer"};

    const f=[...E.querySelectorAll("input.gl")].map(i=>i.value.trim().replace(/%/g,"").replace(/\s+/g,"").toLowerCase());

<script>/* ===== Geodreieck (frei beweglich, drehbar, rastet an Linien ein, 0 auf dem Scheitel) ===== */

    if(!svg.getScreenCTM())continue;
