<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Verhältnisgleichung – Schritt für Schritt</title>
<style>
  :root {
    --tinte: #1d1d22; --grau: #5b5f6b; --papier: #f6f1e8;
    --schiefer: #2c303a; --schiefer2: #4a4f5c;
    --t1: #0E8A8A; --t2: #5A3E9E; --prop: #1565C0; --rot: #B3261E;
    --ring: #FFC400; --karo: #d6e4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; color: var(--tinte); background: #1b2a2e; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .hinten { position: fixed; inset: 0; background: radial-gradient(circle at 30% 20%, #2f5458, #142024 70%); }

  /* Bühne 1600 × 900, wird passend skaliert */
  #buehne { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden;
    background: var(--papier); box-shadow: 0 0 60px rgba(0,0,0,.5); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .folie { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .55s ease, visibility 0s linear .55s; }
  .folie.an { opacity: 1; visibility: visible; transition: opacity .55s ease, visibility 0s; z-index: 2; }

  /* Karopapier */
  .karo { background-color: #fff;
    background-image: linear-gradient(var(--karo) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--karo) 1.5px, transparent 1.5px);
    background-size: 32px 32px; background-position: -1px -1px; }

  /* ---------- Titelfolie ---------- */
  .raum { position: absolute; inset: 0; overflow: hidden; transform: scale(1.06); transition: transform 9s ease-out; }
  .folie.an .raum { transform: scale(1); }
  .raum::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(14,138,138,.55), rgba(20,30,40,.55)); }
  .raum svg.deko { position: absolute; width: 1400px; left: 120px; top: 90px; opacity: .55; transform: rotate(-6deg); }
  .titelkarte { position: absolute; left: 50%; top: 50%; width: 1080px; transform: translate(-50%, -46%); opacity: 0; z-index: 2;
    background: rgba(255,255,255,.95); border-radius: 34px; padding: 50px 64px 44px; box-shadow: 0 30px 80px rgba(0,0,0,.35);
    border-top: 12px solid var(--t1); text-align: center; }
  .folie.an .titelkarte { animation: hoch .9s .15s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes hoch { from { opacity: 0; transform: translate(-50%, -40%); } to { opacity: 1; transform: translate(-50%, -50%); } }
  .dach { font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: #6b6f7a; font-weight: bold; }
  .titelkarte h1 { font-size: 86px; line-height: 1.02; margin: 16px 0 14px; letter-spacing: -.02em; }
  .titelkarte h1 span { color: var(--t1); display: block; font-size: 64px; margin-top: 6px; }
  .titelkarte .unter { font-size: 28px; color: #444; line-height: 1.35; }
  .fluss { display: flex; align-items: center; justify-content: center; margin: 38px 0 30px; }
  .station { width: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; }
  .folie.an .station { animation: auf .6s cubic-bezier(.2,.9,.3,1.3) forwards; }
  .folie.an .station:nth-child(1) { animation-delay: .7s; }
  .folie.an .station:nth-child(3) { animation-delay: 1.3s; }
  .folie.an .station:nth-child(5) { animation-delay: 1.9s; }
  @keyframes auf { from { opacity: 0; transform: translateY(18px) scale(.85); } to { opacity: 1; transform: none; } }
  .kachel { width: 116px; height: 116px; border-radius: 28px; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
  .kachel svg { width: 70px; height: 70px; }
  .station b { font-size: 23px; }
  .station span { font-size: 17px; color: #666; margin-top: -6px; }
  .strecke { width: 110px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, #c9c3b8 0 12px, transparent 12px 22px); position: relative; margin-bottom: 70px; opacity: 0; }
  .folie.an .strecke { animation: auf .4s forwards; }
  .folie.an .strecke:nth-child(2) { animation-delay: 1.1s; }
  .folie.an .strecke:nth-child(4) { animation-delay: 1.7s; }
  .strecke::after { content: ""; position: absolute; top: -7px; left: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--ring);
    box-shadow: 0 0 0 5px rgba(255,196,0,.3); animation: fahrt 2.2s 2.4s infinite ease-in-out; opacity: 0; }
  @keyframes fahrt { 0% { left: -6px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 96px; opacity: 0; } }
  .tipp { font-size: 19px; color: #777; }

  /* ---------- Kapitelfolien ---------- */
  .kapitel { position: absolute; inset: 0; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 150px; overflow: hidden; }
  .kapitel .zahl { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); font-size: 640px; font-weight: bold; line-height: 1; opacity: .1; }
  .folie.an .kapitel .zahl { animation: zahl 1.4s cubic-bezier(.2,.8,.2,1); }
  @keyframes zahl { from { transform: translate(120px, -50%); opacity: 0; } }
  .kapitel .teil { font-size: 26px; letter-spacing: .2em; text-transform: uppercase; font-weight: bold; opacity: .8; }
  .kapitel h2 { font-size: 84px; line-height: 1.04; margin: 18px 0 30px; max-width: 780px; letter-spacing: -.015em; }
  .kapitel .aufg { display: flex; align-items: center; gap: 18px; max-width: 780px; font-size: 34px; line-height: 1.35; background: rgba(255,255,255,.14);
    border-left: 8px solid #fff; border-radius: 0 18px 18px 0; padding: 18px 24px; }
  .kapitel > *:not(.zahl):not(.mini) { opacity: 0; }
  .folie.an .kapitel > .teil { animation: rein .7s .1s forwards; }
  .folie.an .kapitel > h2 { animation: rein .7s .25s forwards; }
  .folie.an .kapitel > .aufg { animation: rein .7s .45s forwards; }
  .folie.an .kapitel > .marke { animation: rein .7s .65s forwards; }
  @keyframes rein { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  .kapitel .marke { position: absolute; left: 150px; bottom: 110px; display: flex; gap: 14px; }
  .kapitel .marke i { width: 54px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.35); }
  .kapitel .marke i.voll { background: #fff; }
  .mini { position: absolute; right: 80px; top: 50%; width: 460px; transform: translateY(-50%); background: #fff; color: var(--tinte); border-radius: 28px;
    padding: 26px 28px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.3); opacity: 0; }
  .folie.an .mini { animation: miniauf .8s .8s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes miniauf { from { opacity: 0; transform: translateY(-40%) scale(.9) rotate(3deg); } to { opacity: 1; transform: translateY(-50%); } }
  .mini svg { width: 100%; display: block; }
  .mini p { font-size: 23px; line-height: 1.3; margin-top: 12px; text-align: center; font-weight: bold; }

  /* ---------- Schrittfolien ---------- */
  .kopf { position: absolute; left: 44px; right: 44px; top: 30px; height: 52px; display: flex; align-items: center; gap: 18px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px 0 14px; border-radius: 999px; color: #fff; font-weight: bold; font-size: 19px; }
  .chip .pkt { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.3); display: grid; place-items: center; font-size: 14px; }
  .kopf .zaehler { margin-left: auto; font-size: 19px; color: var(--grau); font-weight: bold; letter-spacing: .03em; }
  .kopf .zaehler b { color: var(--tinte); font-size: 24px; }

  .blatt { position: absolute; left: 44px; top: 104px; width: 1080px; height: 724px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(40,30,10,.18), 0 2px 6px rgba(40,30,10,.08); }
  .folie .blatt { opacity: 0; transform: translateY(16px) scale(.985); transition: opacity .6s .1s, transform .7s .1s cubic-bezier(.2,.8,.2,1); }
  .folie.an .blatt { opacity: 1; transform: none; }
  .blatt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--c); }
  .aufgabe { position: absolute; left: 44px; right: 40px; top: 30px; font-size: 34px; line-height: 1.3; background: #fff; padding: 12px 18px;
    border: 3px solid var(--c); border-radius: 14px; display: flex; gap: 14px; align-items: baseline; }
  .aufgabe .lab { font-weight: bold; color: var(--c); flex: none; }
  .aufgabe .m { border-radius: 6px; transition: background .4s, box-shadow .4s, color .4s; }
  .aufgabe .m.mg { background: #b8f0c4; box-shadow: 0 0 0 4px #b8f0c4; }
  .aufgabe .m.ms { color: var(--rot); font-weight: bold; background: #ffc9d9; box-shadow: 0 0 0 4px #ffc9d9; }

  svg.tab { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .tel { opacity: 0; transition: opacity .3s; }
  .tel.sicht { opacity: 1; }
  path.tel.zeichne { stroke-dasharray: 160; stroke-dashoffset: 160; animation: zieh .8s ease-out forwards; filter: drop-shadow(0 0 6px rgba(255,196,0,.95)); }
  path.tel.glimm { filter: drop-shadow(0 0 6px rgba(255,196,0,.95)); }
  @keyframes zieh { to { stroke-dashoffset: 0; } }
  .zelle, .op { position: absolute; display: grid; place-items: center; opacity: 0; }
  .zelle.sicht, .op.sicht { opacity: 1; }
  .zelle { font-size: 48px; font-weight: bold; }
  .zelle.kz { font-size: 25px; }
  .zelle.x { background: #ffc9d9; }
  .op { width: 110px; height: 52px; font-size: 34px; font-weight: bold; color: var(--pf); white-space: nowrap; }
  .schreib { animation: schreib .55s steps(12, end) both; }
  @keyframes schreib { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  .gefunden { animation: gefunden .9s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes gefunden { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: none; } }

  .notiz { position: absolute; left: 44px; right: 40px; top: 486px; bottom: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .notiz.mitte { top: 150px; }
  .notiz > * { animation: notizrein .55s .15s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes notizrein { from { opacity: 0; transform: translateY(14px); } }
  .rechnung { font-size: 44px; font-weight: bold; background: #fff; border: 3px solid var(--tinte); border-radius: 14px; padding: 8px 30px; white-space: nowrap;
    box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .rechnung b { color: var(--pf); }
  .kasten { font-size: 36px; background: #fff; border: 3px solid var(--pf); border-radius: 16px; padding: 14px 28px; text-align: center; line-height: 1.3; }
  .kasten b { color: var(--pf); }
  .kasten .luecke { display: inline-block; min-width: 150px; border-bottom: 4px solid var(--pf); }
  .notiz.mitte .kasten { font-size: 44px; }
  .pille { display: inline-block; background: var(--pf); color: #fff; font-weight: bold; font-size: 32px; padding: 10px 30px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .antwort { font-size: 40px; background: #fff; border: 3px solid var(--c); border-radius: 16px; padding: 16px 32px; box-shadow: 0 10px 24px rgba(0,0,0,.1); }
  .antwort b { color: var(--c); }
  .chips { display: flex; gap: 40px; font-size: 32px; }
  .chips span { display: flex; align-items: center; gap: 14px; }
  .chips i { font-style: normal; font-weight: bold; font-size: 24px; padding: 6px 16px; border-radius: 10px; }
  .chips .g { background: #b8f0c4; }
  .chips .s { color: var(--rot); background: #ffc9d9; }
  .groessen { display: flex; align-items: center; gap: 28px; }
  .gr { background: #fff; border: 3px solid var(--tinte); border-radius: 18px; padding: 14px 30px 16px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .gr small { display: block; font-size: 22px; color: var(--grau); font-weight: bold; margin-bottom: 4px; }
  .gr b { font-size: 42px; }
  .gpf { font-size: 64px; font-weight: bold; color: var(--pf); }
  .tipp2 { font-size: 28px; color: var(--grau); }

  .ring { position: absolute; border-radius: 14px; border: 5px solid var(--ring); opacity: 0; transform: scale(1.5); pointer-events: none;
    box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 26px 6px rgba(255,196,0,.75); }
  .ring.an { animation: ringan .45s cubic-bezier(.2,.9,.3,1.4) forwards, puls 1.6s .45s infinite ease-in-out; }
  @keyframes ringan { to { opacity: 1; transform: scale(1); } }
  @keyframes puls { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 40px 14px rgba(255,196,0,.95); } }
  .blick { position: absolute; border-radius: 14px; border: 4px dashed var(--ring); opacity: 0; transform: scale(1.04); transition: opacity .5s, transform .5s;
    box-shadow: 0 0 22px rgba(255,196,0,.45); pointer-events: none; }
  .blick.an { opacity: 1; transform: none; }
  .stift { position: absolute; left: 0; top: 0; width: 70px; height: 70px; opacity: 0; pointer-events: none; z-index: 5; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }

  .text { position: absolute; left: 1164px; top: 104px; width: 392px; height: 660px; display: flex; flex-direction: column; }
  .titelzeile { display: flex; align-items: center; gap: 18px; }
  .nr { flex: none; width: 92px; height: 92px; border-radius: 26px; color: #fff; display: grid; place-items: center; font-size: 46px; font-weight: bold;
    box-shadow: 0 10px 24px rgba(0,0,0,.18); transform: scale(.6) rotate(-8deg); opacity: 0; transition: transform .6s .15s cubic-bezier(.2,.9,.3,1.4), opacity .4s .15s; }
  .folie.an .nr { transform: none; opacity: 1; }
  .titelzeile h3 { font-size: 27px; line-height: 1.15; }
  .schritte { margin-top: 30px; display: flex; flex-direction: column; gap: 20px; }
  .satz { font-size: 21px; line-height: 1.32; color: #8a8a8a; display: flex; gap: 14px; transition: all .45s; }
  .satz .hk { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #cfc8bb; margin-top: 3px; display: grid; place-items: center; transition: all .35s; }
  .satz .hk svg { width: 16px; height: 16px; opacity: 0; }
  .satz.fertig .hk { background: #2E9E4F; border-color: #2E9E4F; }
  .satz.fertig .hk svg { opacity: 1; }
  .satz.jetzt { font-size: var(--g); line-height: 1.24; color: var(--tinte); font-weight: bold; animation: satzrein .55s cubic-bezier(.2,.8,.2,1); }
  .satz.jetzt .hk { width: 34px; height: 34px; margin-top: 5px; border-color: var(--ring); background: #fff8dc; animation: hkpuls 1.4s infinite; }
  @keyframes hkpuls { 50% { box-shadow: 0 0 0 7px rgba(255,196,0,.28); } }
  @keyframes satzrein { from { opacity: 0; transform: translateX(26px); } }
  .satz.spaeter { display: none; }
  .satz .laut { display: none; }
  .satz.jetzt .laut { display: grid; }
  .legende { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 17px; color: var(--grau); }
  .legende div { display: flex; align-items: center; gap: 12px; }
  .legende .lr { width: 30px; height: 22px; border-radius: 6px; border: 4px solid var(--ring); box-shadow: 0 0 10px rgba(255,196,0,.7); }
  .legende .lb { width: 30px; height: 22px; border-radius: 6px; border: 3px dashed var(--ring); }
  .legende .weiter { font-size: 16px; color: #9a958c; }

  /* Vorlese-Knopf */
  .laut { flex: none; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--t1); background: #fff; color: var(--t1); cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 4px 0 #0a6666; align-self: flex-start; }
  .laut svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .laut.an { background: var(--t1); color: #fff; }
  .laut.an .w { animation: wel 1s infinite; }
  @keyframes wel { 50% { opacity: .15; } }
  .kapitel .laut { border-color: #fff; color: var(--c); box-shadow: 0 4px 0 rgba(0,0,0,.25); align-self: center; }

  /* ---------- Schlussfolie ---------- */
  .schlussgrund { position: absolute; inset: 0; background: radial-gradient(circle at 80% 20%, rgba(255,255,255,.16), transparent 55%), linear-gradient(150deg, var(--s), #1b2a33); }
  .schluss { position: absolute; left: 50%; top: 50%; width: 1360px; transform: translate(-50%, -46%); opacity: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .folie.an .schluss { animation: hoch .9s .15s cubic-bezier(.2,.8,.2,1) forwards; }
  .karte { background: rgba(255,255,255,.97); border-radius: 28px; padding: 34px 36px 40px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .karte.gross { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 22px; border-top: 12px solid; padding: 26px 40px; }
  .karte.gross h2 { font-size: 40px; color: var(--prop); letter-spacing: -.01em; }
  .karte h3 { font-size: 30px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .karte h3 i { width: 14px; height: 32px; border-radius: 4px; background: var(--c); }
  .karte h3 .laut { margin-left: auto; width: 48px; height: 48px; }
  .kinnen { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: center; }
  .liste { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .liste li { font-size: 23px; line-height: 1.3; display: flex; gap: 12px; align-items: center; }
  .liste li b.n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ring); color: var(--tinte); display: grid; place-items: center; font-size: 19px; }
  .startwahl { display: flex; justify-content: center; gap: 22px; }
  .start { display: flex; align-items: center; gap: 12px; font: bold 28px Arial; color: #fff; background: var(--c); border: none; border-radius: 999px;
    padding: 16px 34px 16px 40px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .start svg, .sprung svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .start:active, .sprung:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .sprungzeile { grid-column: 1 / -1; display: flex; justify-content: center; }
  .sprung { display: flex; align-items: center; gap: 16px; font: bold 34px Arial; color: #fff; border: 4px solid #fff; border-radius: 999px; cursor: pointer;
    padding: 14px 34px 14px 44px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c)); box-shadow: 0 8px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(255,255,255,.6);
    animation: lockt 2.2s 1.2s infinite; }
  .sprung small { font-size: 20px; font-weight: bold; opacity: .9; display: block; text-align: left; margin-right: 6px; }
  .sprung.klein { font-size: 26px; padding: 10px 28px 10px 34px; animation: none; }
  @keyframes lockt { 0%, 60%, 100% { box-shadow: 0 8px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(255,255,255,.55); } 30% { box-shadow: 0 8px 0 rgba(0,0,0,.3), 0 0 0 16px rgba(255,255,255,0); } }
  .nochmal-bsp { margin-top: 22px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font: bold 23px Arial; color: #fff;
    background: var(--c); border: none; border-radius: 999px; padding: 14px 24px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .nochmal-bsp svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .nochmal-bsp:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .nochmal { grid-column: 1 / -1; justify-self: center; font: bold 22px Arial; color: #fff; border: 3px solid #fff; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    background: rgba(255,255,255,.12); }

  /* ---------- Leisten ---------- */
  .fuss { position: absolute; right: 44px; bottom: 14px; font-size: 15px; color: #6b6f7a; text-align: right; z-index: 20; font-style: italic; }
  .fuss.hell { color: #fff; text-shadow: 0 0 4px #000, 0 1px 3px #000; }
  #fortschritt { position: absolute; left: 0; right: 0; top: 0; height: 8px; display: flex; gap: 3px; z-index: 30; padding: 0 3px; }
  #fortschritt i { flex: 1; background: rgba(0,0,0,.12); border-radius: 0 0 4px 4px; transition: background .4s; cursor: pointer; }
  #steuer { position: absolute; left: 1164px; bottom: 44px; display: flex; gap: 14px; z-index: 30; align-items: center; }
  #steuer button { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, var(--schiefer2), var(--schiefer)); box-shadow: 0 4px 0 #15171c; display: grid; place-items: center; }
  #steuer button.vor { width: auto; padding: 0 30px 0 34px; border-radius: 999px; font: bold 24px Arial; gap: 10px; display: flex;
    background: linear-gradient(180deg, #ffd54a, #f5b800); color: var(--tinte); box-shadow: 0 4px 0 #b58800; }
  #steuer button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  #steuer button:active { transform: translateY(3px); box-shadow: 0 1px 0 #15171c; }
  #steuer.hell button:not(.vor) { background: rgba(255,255,255,.2); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  #steuer.unten { left: 50%; transform: translateX(-50%); bottom: 50px; }
  #buehne.schlussan #steuer { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  /* ---------- Zusätze Verhältnisgleichung ---------- */
  .zelle { transition: opacity .3s, left .95s cubic-bezier(.45,.05,.2,1), top .95s cubic-bezier(.45,.05,.2,1); }
  .zelle.gx span { background: #ffc9d9; color: var(--rot); padding: 0 26px; border-radius: 10px; }
  g.tel[data-id="rahmen"] { transition: opacity 1.8s; }
  .strich { position: absolute; background: #000; border-radius: 3px; opacity: 0; transition: opacity .3s, left .95s cubic-bezier(.45,.05,.2,1), top .95s cubic-bezier(.45,.05,.2,1), width .95s; }
  .strich.sicht { opacity: 1; }
  .op.gleich { width: 110px; height: 80px; font-size: 66px; color: var(--tinte); text-shadow: 0 0 5px #fff, 0 0 5px #fff, 0 0 9px #fff, 0 0 12px #fff; }
  .kreis { position: absolute; border: 4px dashed #1d1d22; border-radius: 50%; opacity: 0; transition: opacity .3s, left .95s, top .95s; pointer-events: none; }
  .kreis.sicht { opacity: 1; }
  .glbox { position: absolute; left: 280px; top: 176px; width: 520px; height: 190px; pointer-events: none; }
  .blatt.ohne .zelle, .blatt.ohne .strich, .blatt.ohne .op, .blatt.ohne .kreis, .blatt.ohne .tel { transition: none !important; }
  path.tel.zeichne { stroke-dasharray: var(--l, 160); stroke-dashoffset: var(--l, 160); }
  .ek { display: inline-block; border: 3px dashed #1d1d22; border-radius: 50%; padding: 0 12px; line-height: 1.15; }
  .tasten { display: flex; gap: 12px; align-items: center; }
  .ta { min-width: 66px; height: 62px; padding: 0 16px; border-radius: 12px; background: linear-gradient(180deg, #4a4f5c, #2c303a); color: #fff;
    font: bold 30px Arial; display: grid; place-items: center; box-shadow: 0 5px 0 #15171c; }
  .ta.o { color: #FFC400; }
  .ta.g { background: linear-gradient(180deg, #ffd54a, #f5b800); color: var(--tinte); box-shadow: 0 5px 0 #b58800; }
  .notiz .ta { animation: tipp .4s both; }
  @keyframes tipp { 0% { opacity: 0; transform: translateY(-12px); } 60% { opacity: 1; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
  .reihe { display: flex; gap: 34px; align-items: center; }
  .lcd { background: #c9d7bb; border: 6px solid #2c303a; border-radius: 14px; padding: 6px 20px 8px; width: 270px; text-align: right;
    font-family: Arial, sans-serif; box-shadow: inset 0 3px 8px rgba(0,0,0,.18); }
  .lcd small { display: block; text-align: left; font-size: 24px; font-weight: bold; }
  .lcd b { font-size: 54px; }
  .antwort { font-size: 32px; white-space: nowrap; }
  .merke { font-size: 32px; font-weight: bold; color: var(--pf); background: #fff; border: 3px dashed var(--pf); border-radius: 14px; padding: 12px 26px; }
  .tausch-t { font: bold 26px Arial; fill: #B3261E; }
  .karte .rechnung { font-size: 32px; padding: 6px 22px; display: inline-block; }
  .karte .ta { min-width: 52px; height: 50px; font-size: 24px; padding: 0 12px; }
  .karte .tasten { margin: 18px 0; }
  .karte .klein { font-size: 23px; line-height: 1.35; }
  .karte .klein b { color: var(--c); }
</style>
</head>
<body>
<div class="hinten"></div>
<div id="buehne">
  <div id="fortschritt"></div>
  <div id="folien"></div>
  <div class="fuss" id="fuss">Erstellt von Marion Klugmann (November 2026) mit freundlicher Unterstützung von Claude.</div>
  <div id="steuer">
    <button id="zurueckBtn" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="weiterBtn" class="vor" aria-label="Weiter">Weiter <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
{
/* ---------- Teile und Beispiele ---------- */
const TEIL = {
  prop: { name: 'Proportional', pf: '#1565C0', merke: 'Merke: Über Kreuz malnehmen, durch die eingekreiste Zahl teilen.' },
  anti: { name: 'Antiproportional', pf: '#C2410C', merke: 'Merke: Antiproportional – den rechten Bruch umdrehen (Kehrwert).' }
};
const BSP = {
  1: { teil: 'prop', nr: 1, farbe: '#0E8A8A', titel: 'Gesucht ist der Preis',
       aufgabe: '<span class="m" data-m="g1">3 kg</span> Äpfel kosten <span class="m" data-m="g2">4,50 €</span>. <span class="m" data-m="s1">Wie viel kosten</span> <span class="m" data-m="g3">5 kg</span> Äpfel?',
       vorlesen: '3 kg Äpfel kosten 4,50 €. Wie viel kosten 5 kg Äpfel?',
       w: { kL: 'Masse in kg', kR: 'Preis in €', a1: '3', b1: '4,50', a3: '5', b3: 'x' },
       div: 'a1', kreuz: 'M452,300 L622,240',
       rechnung: 'x = 5 · 4,50 ÷ <span class="ek">3</span>',
       tasten: ['5', '×', '4,5', '÷', '3', '='], anzeige: '5×4,5÷3', ergebnis: '7,5',
       mini: { tl: '3', bl: '5', tr: '4,50', br: 'x', div: 'tl' },
       minip: 'Aus der Tabelle wird eine Gleichung.',
       liste: ['Werte notieren, x für das Gesuchte', 'Bruchstriche', 'Zahl gegenüber vom x einkreisen', 'Über Kreuz mal, durch die eingekreiste Zahl'],
       regel: 'Schreibe die Werte auf wie in der Dreisatztabelle und schreibe x für das Gesuchte. Jede Spalte wird ein Bruch. Kreise die Zahl gegenüber vom x ein. Rechne über Kreuz mal und teile durch die eingekreiste Zahl.',
       antwort: '5 kg Äpfel kosten 7,50 €.', xwert: '7,50' },
  2: { teil: 'anti', nr: 1, farbe: '#C2410C', titel: 'Gesucht ist die Zeit',
       aufgabe: 'Ein Futtervorrat reicht für <span class="m" data-m="g1">5 Pferde</span> <span class="m" data-m="g2">12 Tage</span>. <span class="m" data-m="s1">Wie lange</span> reicht er für <span class="m" data-m="g3">6 Pferde</span>?',
       vorlesen: 'Ein Futtervorrat reicht für 5 Pferde 12 Tage. Wie lange reicht er für 6 Pferde?',
       w: { kL: 'Anzahl Pferde', kR: 'Zeit in Tagen', a1: '5', b1: '12', a3: '6', b3: 'x' },
       div: 'a3', kreuz: 'M452,238 L628,300',
       rechnung: 'x = 5 · 12 ÷ <span class="ek">6</span>',
       tasten: ['5', '×', '12', '÷', '6', '='], anzeige: '5×12÷6', ergebnis: '10',
       mini: { tl: '5', bl: '6', tr: 'x', br: '12', div: 'bl' },
       minip: 'Rechter Bruch umgedreht: der Kehrwert.',
       liste: ['Werte notieren, x für das Gesuchte', 'Bruchstriche', 'Rechten Bruch umdrehen (Kehrwert)', 'Zahl gegenüber vom x einkreisen', 'Über Kreuz mal, durch die eingekreiste Zahl'],
       regel: 'Schreibe die Werte auf wie in der Dreisatztabelle und schreibe x für das Gesuchte. Jede Spalte wird ein Bruch. Drehe den rechten Bruch um. Kreise die Zahl gegenüber vom x ein. Rechne über Kreuz mal und teile durch die eingekreiste Zahl.',
       antwort: 'Der Futtervorrat reicht für 6 Pferde 10 Tage.', xwert: '10' }
};

const tastenHTML = b => `<div class="tasten">${b.tasten.map((z, j) => `<span class="ta ${'×÷'.includes(z) ? 'o' : z === '=' ? 'g' : ''}" style="animation-delay:${.5 + j * .45}s">${z}</span>`).join('')}</div>`;

/* Schritte: add = neue Teile, lage = tab / frei / gl / kw, mark = Textmarker, blick = gestrichelt hinschauen, zuerst = erst schreiben, dann bewegen */
const tabelle = () => ({ art: 'schritt', titel: 'So kennst du es: die Dreisatztabelle', schritte: [
  { t: 'Bisher haben wir die Werte so in die Dreisatztabelle eingetragen.', add: ['rahmen', 'kL', 'kR', 'a1', 'b1', 'a3'], mark: ['g1', 'g2', 'g3'] },
  { t: 'An die Stelle der gesuchten Zahl schreiben wir ein x.', add: ['b3'], mark: ['s1'],
    notiz: '<div class="chips"><span><i class="g">gegeben</i>grüner Textmarker</span><span><i class="s">gesucht</i>roter Textmarker</span></div>' } ] });
const umbau = () => ({ art: 'schritt', titel: 'Es geht auch ohne Tabelle', schritte: [
  { t: 'Es geht aber auch ganz ohne Tabelle.', lage: 'frei' },
  { t: 'Jede Spalte wird ein Bruch. Zwischen die Zahlen kommt ein Bruchstrich.', add: ['bL', 'bR'] },
  { t: 'Dazwischen kommt ein Gleichheitszeichen. Fertig ist die Verhältnisgleichung.', lage: 'gl', add: ['gleich'] } ] });
const kreuz = b => ({ art: 'schritt', titel: 'Über Kreuz', schritte: [
  { t: 'Schau, wo das x steht. Die Zahl schräg gegenüber kreist du ein. Durch diese Zahl wird geteilt.', blick: ['b3'], add: ['kreis'] },
  { t: 'Die beiden anderen Zahlen verbindet der Kreuzpfeil. Diese zwei Zahlen nimmst du mal.', add: ['kreuz'],
    notiz: `<div class="rechnung">${b.rechnung}</div>` } ] });
const rechner = b => ({ art: 'schritt', titel: 'Mit dem Taschenrechner lösen', schritte: [
  { t: 'Tippe die Rechnung genau so in den Taschenrechner ein. Erst die Zahlen am Kreuzpfeil, dann geteilt durch die eingekreiste Zahl.',
    notiz: `<div class="rechnung">${b.rechnung}</div>${tastenHTML(b)}` },
  { t: 'Lies das Ergebnis ab. Jetzt hast du das x gefunden.',
    notiz: `<div class="reihe"><div class="lcd"><small>${b.anzeige}</small><b>${b.ergebnis}</b></div><div class="rechnung">${b.rechnung} = <b class="gefunden" style="display:inline-block">${b.ergebnis}</b></div></div>` } ] });
const antwort = (t, b) => ({ art: 'schritt', titel: 'Antwortsatz schreiben', schritte: [
  { t, blick: ['aufgabe'], notiz: `<div class="rechnung">x = <b>${b.xwert}</b></div><div class="antwort"><b>Antwort:</b> ${b.antwort}</div>` } ] });

const ABLAUF = {
  1: [
    tabelle(),
    umbau(),
    kreuz(BSP[1]),
    rechner(BSP[1]),
    antwort('Schreibe einen Antwortsatz. Beim Geld schreibst du 7,50 € statt 7,5 €.', BSP[1])
  ],
  2: [
    tabelle(),
    umbau(),
    { art: 'schritt', titel: 'Besonderheit: antiproportional', schritte: [
      { t: 'Je mehr Pferde, desto weniger Tage – die Zuordnung ist antiproportional. Darum musst du den rechten Bruch umdrehen.', blick: ['b1', 'b3'],
        notiz: `<div class="merke">${TEIL.anti.merke}</div>` },
      { t: 'Die 12 und das x tauschen die Plätze. Das nennt man den Kehrwert bilden.', add: ['tausch'], lage: 'kw', zuerst: true,
        notiz: '<div class="tipp2">Jetzt steht das x oben rechts.</div>' } ] },
    kreuz(BSP[2]),
    rechner(BSP[2]),
    antwort('Schreibe einen Antwortsatz. Schau dafür noch einmal in die Aufgabe.', BSP[2])
  ]
};

const FOLIEN = [{ art: 'titel' }];
['prop', 'anti'].forEach(teil => {
  [1, 2].filter(n => BSP[n].teil === teil).forEach(n => {
    FOLIEN.push({ art: 'kapitel', bsp: n });
    ABLAUF[n].forEach(f => FOLIEN.push({ ...f, bsp: n }));
  });
  FOLIEN.push({ art: 'schluss', teil });
});

/* ---------- Geometrie (Pixel im Blatt 1080 × 724) ---------- */
const SP = [330, 540, 750], ZE = [150, 216, 296, 376, 456];
function lagen(lage) {
  const P = { kL: [330, 150, 210, 66], kR: [540, 150, 210, 66], a1: [330, 216, 210, 80], b1: [540, 216, 210, 80], a3: [330, 376, 210, 80], b3: [540, 376, 210, 80],
    bL: [355, 333, 160, 6], bR: [565, 333, 160, 6] };
  if (lage === 'gl' || lage === 'kw') Object.assign(P, { kL: [295, 372, 210, 50], kR: [575, 372, 210, 50], a1: [295, 184, 210, 80], a3: [295, 276, 210, 80], b1: [575, 184, 210, 80], b3: [575, 276, 210, 80],
    bL: [318, 267, 164, 6], bR: [598, 267, 164, 6] });
  if (lage === 'kw') { P.b1 = [575, 276, 210, 80]; P.b3 = [575, 184, 210, 80]; }
  return P;
}

const HAKEN = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LAUT = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path class="w" d="M16 9a4 4 0 0 1 0 6"/><path class="w" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const PFEIL = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const STIFT = '<svg viewBox="0 0 64 64"><g transform="rotate(40 32 32)"><rect x="24" y="2" width="16" height="44" rx="3" fill="#FFC400" stroke="#1d1d22" stroke-width="2.5"/><rect x="24" y="2" width="16" height="9" rx="3" fill="#e46f9e" stroke="#1d1d22" stroke-width="2.5"/><path d="M24 46 L32 62 L40 46 Z" fill="#f3d9b1" stroke="#1d1d22" stroke-width="2.5" stroke-linejoin="round"/><path d="M29.5 57 L32 62 L34.5 57 Z" fill="#1d1d22"/></g></svg>';
const SYMBOL = {
  tabelle: '<svg viewBox="0 0 64 64"><rect x="10" y="8" width="44" height="48" rx="6" fill="#fff"/><path d="M10 20h44M10 32h44M10 44h44M32 8v48" stroke="#0E8A8A" stroke-width="3.5"/><text x="43" y="54" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" fill="#B3261E">x</text></svg>',
  bruch: '<svg viewBox="0 0 64 64"><path d="M8 32h18M38 32h18" stroke="#5A3E9E" stroke-width="4" stroke-linecap="round"/><path d="M29 28h6M29 36h6" stroke="#5A3E9E" stroke-width="3.5" stroke-linecap="round"/><circle cx="17" cy="20" r="5" fill="#5A3E9E"/><circle cx="17" cy="44" r="5" fill="#5A3E9E"/><circle cx="47" cy="20" r="5" fill="#5A3E9E"/><text x="47" y="51" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="17" fill="#B3261E">x</text></svg>',
  kreuz: '<svg viewBox="0 0 64 64"><path d="M14 48 L50 16 M14 16 L50 48" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M40 14 H52 V26 M12 38 V50 H24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* Kleine Verhältnisgleichung mit Kreuzpfeil und eingekreistem Divisor */
let miniNr = 0;
function minigl(b) {
  const pf = TEIL[b.teil].pf, m = b.mini, id = 'mg' + (++miniNr);
  const pos = { tl: [85, 62], bl: [85, 116], tr: [235, 62], br: [235, 116] };
  const zahl = k => { const [x, y] = pos[k], v = m[k];
    return (v === 'x' ? `<rect x="${x - 22}" y="${y - 29}" width="44" height="38" rx="8" fill="#ffc9d9"/>` : '') +
      `<text x="${x}" y="${y}" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="30" fill="${v === 'x' ? '#B3261E' : '#1d1d22'}">${v}</text>`; };
  const [dx, dy] = pos[m.div];
  const weg = m.div === 'tl' ? 'M120,100 L200,58' : 'M120,58 L200,100';
  return `<svg viewBox="0 0 320 162"><defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${pf}"/></marker></defs>
    <rect x="0" y="0" width="320" height="162" fill="#fff" opacity="0"/>
    <line x1="45" y1="79" x2="125" y2="79" stroke="#1d1d22" stroke-width="3"/><line x1="195" y1="79" x2="275" y2="79" stroke="#1d1d22" stroke-width="3"/>
    <path d="${weg}" stroke="${pf}" stroke-width="4" stroke-linecap="round" marker-start="url(#${id})" marker-end="url(#${id})"/>
    <text x="160" y="93" text-anchor="middle" font-family="Arial" font-size="40" fill="#1d1d22" stroke="#fff" stroke-width="5" paint-order="stroke">=</text>
    ${['tl', 'bl', 'tr', 'br'].map(zahl).join('')}
    <ellipse cx="${dx}" cy="${dy - 10}" rx="24" ry="22" fill="none" stroke="#1d1d22" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="85" y="152" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#6b6f7a">${b.w.kL}</text>
    <text x="235" y="152" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#6b6f7a">${b.w.kR}</text>
  </svg>`;
}

/* Text zum Vorlesen aufbereiten */
function sprechtext(t) {
  return t.replace(/„|“/g, '').replace(/(\d+),(\d\d) €/g, '$1 Euro $2').replace(/(\d+),(\d+)/g, '$1 Komma $2')
    .replace(/€/g, 'Euro').replace(/ : /g, ' geteilt durch ').replace(/ · /g, ' mal ').replace(/×/g, ' mal ').replace(/÷/g, ' geteilt durch ')
    .replace(/ = /g, ' gleich ').replace(/\bkg\b/g, 'Kilogramm').replace(/…\?/g, 'was?').replace(/…/g, '').replace(/→/g, ', ').replace(/ – /g, ', ');
}
const saetze = t => (t.match(/[.!?](\s|$)/g) || []).length;
const laut = t => `<button class="laut" data-say="${sprechtext(t).replace(/"/g, '&quot;')}" aria-label="Vorlesen">${LAUT}</button>`;

const buehne = document.getElementById('buehne');
const ablage = document.getElementById('folien');
const fuss = document.getElementById('fuss');
const steuer = document.getElementById('steuer');
const index = (art, wert) => FOLIEN.findIndex(f => f.art === art && (f.bsp === wert || f.teil === wert));

/* ---------- Folien bauen ---------- */
let schrittNr = 0;
FOLIEN.forEach(f => {
  const el = document.createElement('section');
  el.className = 'folie';
  if (f.art === 'titel') {
    el.classList.add('hell');
    el.innerHTML = `<div class="raum karo"><svg class="deko" viewBox="0 0 320 162">${minigl(BSP[1])}</svg></div>
      <div class="titelkarte">
        <div class="dach">Lern-Lounge – Mathematik Klasse 7</div>
        <h1 style="font-size:78px">Die Verhältnisgleichung <span>Schritt für Schritt</span></h1>
        <div class="unter">Aus der Dreisatztabelle wird eine Gleichung.</div>
        <div class="fluss">
          <div class="station"><div class="kachel" style="background:#fff;border:3px solid var(--t1)">${SYMBOL.tabelle}</div><b>Eintragen</b><span>Tabelle mit x</span></div>
          <div class="strecke"></div>
          <div class="station"><div class="kachel" style="background:#fff;border:3px solid var(--t2)">${SYMBOL.bruch}</div><b>Umbauen</b><span>Bruch = Bruch</span></div>
          <div class="strecke"></div>
          <div class="station"><div class="kachel" style="background:var(--prop)">${SYMBOL.kreuz}</div><b>Über Kreuz</b><span>mit dem Taschenrechner</span></div>
        </div>
        <div class="startwahl">
          <button class="start" data-ziel="prop" style="--c:${TEIL.prop.pf}">Proportional ${PFEIL}</button>
          <button class="start" data-ziel="anti" style="--c:${TEIL.anti.pf}">Antiproportional ${PFEIL}</button>
        </div>
      </div>`;
  } else if (f.art === 'kapitel') {
    const b = BSP[f.bsp], t = TEIL[b.teil], tnr = b.teil === 'prop' ? 1 : 2;
    el.classList.add('hell');
    el.innerHTML = `<div class="kapitel" style="--c:${b.farbe};background:radial-gradient(circle at 80% 30%, rgba(255,255,255,.14), transparent 55%), ${b.farbe}">
      <div class="zahl">${tnr}</div>
      <div class="teil">${t.name} – Teil ${tnr} von 2</div>
      <h2>${b.titel}</h2>
      <div class="aufg"><span>${b.vorlesen}</span>${laut(b.vorlesen)}</div>
      <div class="marke">${[1, 2].map(n => `<i class="${n <= tnr ? 'voll' : ''}"></i>`).join('')}</div>
      <div class="mini">${minigl(b)}<p>${b.minip}</p></div>
    </div>`;
  } else if (f.art === 'schritt') {
    const b = BSP[f.bsp], t = TEIL[b.teil];
    f.nr = ++schrittNr;
    const eigene = FOLIEN.filter(s => s.art === 'schritt' && s.bsp === f.bsp);
    f.nrImBsp = eigene.indexOf(f) + 1;
    el.innerHTML = `
      <div class="kopf">
        <span class="chip" style="background:${b.farbe}"><span class="pkt">${b.teil === 'prop' ? 1 : 2}</span>${t.name}: ${b.titel}</span>
        <span class="zaehler">Schritt <b>${f.nrImBsp}</b> von ${eigene.length}</span>
      </div>
      <div class="blatt karo" style="--c:${b.farbe};--pf:${t.pf}">
        <div class="aufgabe" data-id="aufgabe"><span class="lab">Aufgabe:</span><span>${b.aufgabe}</span>${laut(b.vorlesen)}</div>
        <svg class="tab" viewBox="0 0 1080 724">
          <defs>
            <marker id="sp${f.nr}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${t.pf}"/></marker>
            <marker id="sr${f.nr}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker>
          </defs>
          <g class="tel" data-id="rahmen">
            <rect x="${SP[0]}" y="${ZE[0]}" width="420" height="66" fill="#F2F2F2" stroke="#000" stroke-width="3"/>
            ${[1, 2, 3].map(z => `<rect x="${SP[0]}" y="${ZE[z]}" width="210" height="80" fill="rgba(255,255,255,.85)" stroke="#000" stroke-width="3"/><rect x="${SP[1]}" y="${ZE[z]}" width="210" height="80" fill="rgba(255,255,255,.85)" stroke="#000" stroke-width="3"/>`).join('')}
            <line x1="${SP[1]}" y1="${ZE[0]}" x2="${SP[1]}" y2="${ZE[1]}" stroke="#000" stroke-width="3"/>
          </g>
          <path class="tel" data-id="kreuz" d="${b.kreuz}" stroke="${t.pf}" stroke-width="6" stroke-linecap="round" marker-start="url(#sp${f.nr})" marker-end="url(#sp${f.nr})" style="--l:190"/>
          ${b.teil === 'anti' ? `<g class="tel" data-id="tausch"><line x1="806" y1="196" x2="806" y2="344" stroke="#B3261E" stroke-width="5" marker-start="url(#sr${f.nr})" marker-end="url(#sr${f.nr})"/>
            <text class="tausch-t" x="826" y="262">Kehrwert</text><text class="tausch-t" x="826" y="294">bilden</text></g>` : ''}
        </svg>
        ${['kL', 'kR', 'a1', 'b1', 'a3', 'b3'].map(k => `<div class="zelle ${k[0] === 'k' ? 'kz' : ''} ${k === 'b3' ? 'gx' : ''}" data-id="${k}"><span>${b.w[k]}</span></div>`).join('')}
        <div class="strich" data-id="bL"></div><div class="strich" data-id="bR"></div>
        <div class="op gleich" data-id="gleich" style="left:485px;top:230px">=</div>
        <div class="kreis" data-id="kreis"></div>
        <div class="glbox" data-id="glbox"></div>
        <div class="notiz"></div>
        <div class="ebene" style="position:absolute;inset:0;pointer-events:none"></div>
      </div>
      <div class="text">
        <div class="titelzeile"><div class="nr" style="background:${b.farbe}">${f.nrImBsp}</div><h3>${f.titel}</h3></div>
        <div class="schritte">${f.schritte.map(s => `<div class="satz" style="--g:${s.t.length > 100 ? 26 : s.t.length > 55 ? 29 : 34}px"><span class="hk">${HAKEN}</span><span style="flex:1">${s.t}</span>${saetze(s.t) > 1 ? laut(s.t) : ''}</div>`).join('')}</div>
        <div class="legende">
          <div><span class="lr"></span>Gelber Rahmen: das ist neu</div>
          <div><span class="lb"></span>Gestrichelt: hier hinschauen</div>
          <div class="weiter">${f.schritte.length > 1 ? 'Dieser Schritt hat ' + f.schritte.length + ' Teile.' : '&nbsp;'}</div>
        </div>
      </div>`;
  } else if (f.art === 'schluss') {
    const t = TEIL[f.teil], n = [1, 2].find(k => BSP[k].teil === f.teil), b = BSP[n];
    el.classList.add('hell');
    const weiterKnopf = f.teil === 'prop'
      ? `<button class="sprung" data-ziel="anti" style="--c:${TEIL.anti.pf}"><small>Weiter geht’s mit</small>Antiproportional ${PFEIL}</button>`
      : `<button class="sprung klein" data-ziel="prop" style="--c:${TEIL.prop.pf}"><small>Nochmal ansehen</small>Proportional ${PFEIL}</button>`;
    el.innerHTML = `<div class="schlussgrund" style="--s:${t.pf}"></div>
      <div class="schluss">
        <div class="karte gross" style="border-top-color:${t.pf}"><h2 style="color:${t.pf}">${t.merke}</h2>${laut(t.merke)}</div>
        <div class="karte" style="--c:${b.farbe}">
          <h3><i></i>So gehst du vor${laut(b.regel)}</h3>
          <div class="kinnen">${minigl(b)}<ol class="liste">${b.liste.map((z, j) => `<li><b class="n">${j + 1}</b><span>${z}</span></li>`).join('')}</ol></div>
          <button class="nochmal-bsp" data-bsp="${n}" style="--c:${b.farbe}">Beispiel nochmal ansehen ${PFEIL}</button>
        </div>
        <div class="karte" style="--c:${b.farbe}">
          <h3><i></i>Mit dem Taschenrechner</h3>
          <div class="rechnung">${b.rechnung} = <b>${b.ergebnis}</b></div>
          ${tastenHTML(b)}
          <div class="klein"><b>Antwort:</b> ${b.antwort}</div>
        </div>
        <div class="sprungzeile">${weiterKnopf}</div>
      </div>`;
  }
  ablage.appendChild(el);
  f.el = el;
});

/* Fortschrittsleiste */
const leiste = document.getElementById('fortschritt');
FOLIEN.forEach((f, i) => {
  const s = document.createElement('i');
  s.addEventListener('click', e => { e.stopPropagation(); gehe(i, 0); });
  leiste.appendChild(s);
  f.balken = s;
});

/* ---------- Skalierung ---------- */
let skala = 1;
function skaliere() {
  skala = Math.min(innerWidth / 1600, innerHeight / 900);
  buehne.style.transform = `scale(${skala}) translate(-50%, -50%)`;
}
addEventListener('resize', skaliere); skaliere();

/* ---------- Vorlesen ---------- */
let sprecher = null;
function still() { try { speechSynthesis.cancel(); } catch (e) {} if (sprecher) sprecher.classList.remove('an'); sprecher = null; }
function stimme() {
  const v = speechSynthesis.getVoices().filter(x => /^de/i.test(x.lang));
  return v.find(x => /anna|petra|helena|katja|google/i.test(x.name)) || v[0] || null;
}
document.addEventListener('click', e => {
  const k = e.target.closest('.laut'); if (!k) return;
  e.stopPropagation();
  if (!('speechSynthesis' in window)) return;
  if (sprecher === k) { still(); return; }
  still();
  const u = new SpeechSynthesisUtterance(k.dataset.say);
  u.lang = 'de-DE'; u.rate = .9; const s = stimme(); if (s) u.voice = s;
  u.onend = u.onerror = () => { if (sprecher === k) { k.classList.remove('an'); sprecher = null; } };
  sprecher = k; k.classList.add('an'); speechSynthesis.speak(u);
}, true);
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- Zustand einer Schrittfolie berechnen ---------- */
function zustand(i, sub) {
  const f = FOLIEN[i];
  const sicht = new Set(), mark = new Set(); let lage = 'tab';
  FOLIEN.forEach((g, j) => {
    if (g.art !== 'schritt' || g.bsp !== f.bsp || j > i) return;
    g.schritte.forEach((s, k) => {
      if (j === i && k > sub) return;
      (s.add || []).forEach(a => sicht.add(a));
      (s.mark || []).forEach(a => mark.add(a));
      if (s.lage) lage = s.lage;
    });
  });
  return { sicht, mark, lage, s: f.schritte[sub] };
}
function vorher(i, sub) {
  if (sub > 0) return zustand(i, sub - 1).lage;
  const v = FOLIEN[i - 1];
  return v && v.art === 'schritt' && v.bsp === FOLIEN[i].bsp ? zustand(i - 1, v.schritte.length - 1).lage : 'tab';
}

/* Teile an ihren Platz setzen (Tabelle, Gleichung oder Kehrwert) */
function setzeLage(f, b, lage, sicht, versteckt, sofort) {
  const blatt = f.el.querySelector('.blatt');
  if (sofort) blatt.classList.add('ohne');
  const P = lagen(lage);
  Object.keys(P).forEach(k => { const el = blatt.querySelector(`[data-id="${k}"]`), [x, y, w, h] = P[k];
    Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); });
  const [x, y] = P[b.div], kr = blatt.querySelector('[data-id="kreis"]');
  Object.assign(kr.style, { left: (x + 48) + 'px', top: (y - 1) + 'px', width: '114px', height: '82px' });
  blatt.querySelector('[data-id="rahmen"]').classList.toggle('sicht', sicht.has('rahmen') && !versteckt.includes('rahmen') && lage === 'tab');
  if (sofort) { void blatt.offsetWidth; blatt.classList.remove('ohne'); }
}

/* ---------- Schritt abspielen ---------- */
let lauf = 0;
const warte = ms => new Promise(r => setTimeout(r, ms));

function spiele(f, i, sub) {
  const id = ++lauf;
  const b = BSP[f.bsp];
  const { sicht, mark, lage, s } = zustand(i, sub);
  const alt = vorher(i, sub);
  const blatt = f.el.querySelector('.blatt');
  const ebene = f.el.querySelector('.ebene');
  const notiz = f.el.querySelector('.notiz');
  const teil = k => blatt.querySelector(`[data-id="${k}"]`);
  ebene.innerHTML = '';
  const neu = s.add || [];

  f.el.querySelectorAll('.satz').forEach((el, j) => { el.className = 'satz ' + (j < sub ? 'fertig' : j === sub ? 'jetzt' : 'spaeter'); });

  blatt.querySelectorAll('.aufgabe .m').forEach(m => {
    const k = m.dataset.m;
    m.classList.toggle('mg', mark.has(k) && k[0] === 'g');
    m.classList.toggle('ms', mark.has(k) && k[0] === 's');
  });

  blatt.querySelectorAll('[data-id]').forEach(el => {
    const k = el.dataset.id; if (k === 'aufgabe' || k === 'glbox') return;
    el.classList.remove('zeichne', 'glimm', 'schreib', 'gefunden');
    if (k !== 'rahmen') el.classList.toggle('sicht', sicht.has(k) && !neu.includes(k));
  });
  setzeLage(f, b, alt, sicht, neu, true);

  /* Notizfläche */
  notiz.classList.toggle('mitte', !sicht.size);
  let html = s.notiz || '';
  notiz.innerHTML = '';
  notiz.style.opacity = 0;

  const rahmen = (el, kl) => {
    const r = el.getBoundingClientRect(), o = blatt.getBoundingClientRect();
    const d = document.createElement('div'); d.className = kl;
    const pad = 8;
    Object.assign(d.style, { left: ((r.left - o.left) / skala - pad) + 'px', top: ((r.top - o.top) / skala - pad) + 'px',
      width: (r.width / skala + 2 * pad) + 'px', height: (r.height / skala + 2 * pad) + 'px' });
    ebene.appendChild(d);
    requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('an')));
  };

  const bewege = async () => {
    const anders = alt !== lage;
    setzeLage(f, b, lage, sicht, neu, false);
    if (anders) await warte(lage === 'frei' ? 2000 : 1050);
  };

  const schreibe = async () => {
    if (!neu.length) return;
    const stift = document.createElement('div');
    stift.className = 'stift'; stift.innerHTML = STIFT;
    ebene.appendChild(stift);
    const setze = (x, y) => { stift.style.transform = `translate(${x - 6}px, ${y - 64}px)`; };
    setze(1000, 700);
    stift.style.transition = 'opacity .3s'; stift.style.opacity = 1;
    await warte(250);
    for (const k of neu) {
      if (id !== lauf) return;
      const el = teil(k);
      el.classList.add('sicht');
      const r = el.getBoundingClientRect(), o = blatt.getBoundingClientRect();
      el.classList.remove('sicht');
      const cx = (r.left - o.left + r.width / 2) / skala, cy = (r.top - o.top + r.height / 2) / skala;
      stift.style.transition = 'transform .6s cubic-bezier(.45,.05,.2,1), opacity .3s';
      setze(cx - 10, cy + 6);
      await warte(620);
      if (id !== lauf) return;
      el.classList.add('sicht');
      if (el.tagName === 'path') el.classList.add('zeichne'); else if (el.tagName !== 'g') el.classList.add('schreib');
      if (el.tagName !== 'path' && el.tagName !== 'g' && k !== 'kreis') rahmen(el, 'ring');
      await warte(el.tagName === 'path' || el.tagName === 'g' ? 800 : 520);
    }
    if (id !== lauf) return;
    stift.style.transition = 'opacity .8s'; stift.style.opacity = 0;
  };

  (async () => {
    await warte(550);
    if (id !== lauf) return;
    if (s.zuerst) { await schreibe(); if (id !== lauf) return; await warte(200); await bewege(); }
    else { await bewege(); }
    if (id !== lauf) return;
    (s.blick || []).forEach(k => rahmen(teil(k), 'blick'));
    if (!s.zuerst) { await schreibe(); }
    if (id !== lauf) return;
    notiz.innerHTML = html; notiz.style.opacity = 1;
  })();
}

/* ---------- Navigation ---------- */
let akt = -1, teilNr = 0;
function gehe(i, sub) {
  i = Math.max(0, Math.min(FOLIEN.length - 1, i));
  still();
  const f = FOLIEN[i];
  if (i !== akt) {
    if (akt >= 0) FOLIEN[akt].el.classList.remove('an');
    void f.el.offsetWidth;
    f.el.classList.add('an');
    akt = i;
  }
  teilNr = f.art === 'schritt' ? Math.max(0, Math.min(sub, f.schritte.length - 1)) : 0;
  if (f.art === 'schritt') spiele(f, i, teilNr); else lauf++;
  const hell = f.el.classList.contains('hell');
  fuss.classList.toggle('hell', hell);
  steuer.classList.toggle('hell', hell);
  steuer.classList.toggle('unten', f.art !== 'schritt');
  buehne.classList.toggle('schlussan', f.art === 'schluss');
  const farbe = n => n.bsp ? BSP[n.bsp].farbe : n.teil ? TEIL[n.teil].pf : 'var(--schiefer)';
  FOLIEN.forEach((n, j) => { n.balken.style.background = j <= i ? farbe(n) : ''; });
}
function weiter() {
  const f = FOLIEN[akt];
  if (f.art === 'schluss') return;
  if (f.art === 'schritt' && teilNr < f.schritte.length - 1) gehe(akt, teilNr + 1);
  else gehe(akt + 1, 0);
}
function zurueck() {
  const f = FOLIEN[akt];
  if (f.art === 'schritt' && teilNr > 0) gehe(akt, teilNr - 1);
  else { const v = FOLIEN[akt - 1]; gehe(akt - 1, v && v.art === 'schritt' ? v.schritte.length - 1 : 0); }
}

addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(e.key)) { e.preventDefault(); weiter(); }
  else if (['ArrowLeft', 'PageUp', 'ArrowUp', 'Backspace'].includes(e.key)) { e.preventDefault(); zurueck(); }
  else if (e.key === 'Home') gehe(0, 0);
});
document.getElementById('weiterBtn').addEventListener('click', e => { e.stopPropagation(); weiter(); });
document.getElementById('zurueckBtn').addEventListener('click', e => { e.stopPropagation(); zurueck(); });
document.querySelectorAll('.nochmal-bsp').forEach(k => k.addEventListener('click', e => { e.stopPropagation(); gehe(index('kapitel', +k.dataset.bsp), 0); }));
document.querySelectorAll('[data-ziel]').forEach(k => k.addEventListener('click', e => {
  e.stopPropagation();
  gehe(index('kapitel', [1, 2].find(n => BSP[n].teil === k.dataset.ziel)), 0);
}));
buehne.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  const rect = buehne.getBoundingClientRect();
  (e.clientX - rect.left < rect.width * .25) ? zurueck() : weiter();
});
let tx = null;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) { dx < 0 ? weiter() : zurueck(); }
});

gehe(0, 0);
}
</script>
</body>
