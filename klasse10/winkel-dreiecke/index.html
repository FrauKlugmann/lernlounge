/* ─── Diagramm-Helfer (Teil des Motors, auch für feste Bilder in Aufgaben nutzbar) ─── */
const DFARBEN=["#F4B6B0","#B7DFB9","#FFE08A","#CDBBE8","#A9DDE6"];
const dEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dZ=x=>String(Math.round(x*10)/10).replace(".",",");
/* streifenSvg(namen, cm, {live, bis, texte}) – bis = Länge der Skala (Standard 10), texte = eigene Beschriftung je Teil */
function streifenSvg(namen,cm,opt){
  opt=opt||{};const x0=10,y0=22,h=40,pc=50,bis=opt.bis||10;const B=565+(bis-10)*pc;
  let s='<svg viewBox="0 0 '+B+' 100" role="img" aria-label="Streifendiagramm" style="width:'+B+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  let x=0;
  cm.forEach((c,i)=>{c=Math.max(0,c);const w=Math.max(0,Math.min(c,bis-x))*pc;
    if(w>0){s+='<rect x="'+(x0+x*pc)+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      const n=(opt.texte?opt.texte[i]:namen[i])||"";if(n&&w>=n.length*7+8)s+='<text x="'+(x0+x*pc+w/2)+'" y="'+(y0+h/2+5)+'" text-anchor="middle" font-size="13">'+dEsc(n)+'</text>';}
    x=Math.min(bis,x+c);});
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+10*pc+'" height="'+h+'" fill="none" stroke="#000" stroke-width="2"/>';
  for(let k=0;k<=bis;k++)s+='<line x1="'+(x0+k*pc)+'" y1="'+(y0+h)+'" x2="'+(x0+k*pc)+'" y2="'+(y0+h+8)+'" stroke="#000" stroke-width="1.5"/><text x="'+(x0+k*pc)+'" y="'+(y0+h+23)+'" text-anchor="middle" font-size="13">'+k+'</text>';
  s+='<text x="'+(x0+bis*pc+20)+'" y="'+(y0+h+23)+'" font-size="13">cm</text>';
  const sum=cm.reduce((a,b)=>a+Math.max(0,b),0);
  if(opt.live&&sum>10.0001)s+='<text x="10" y="12" font-size="13" fill="#C62828" font-weight="700">Zu lang! Der Streifen ist nur 10 cm lang.</text>';
  return s+'</svg>';
}
/* kreisSvg(namen, grad, {winkel:false, texte}) – texte = eigene Beschriftung je Teil */
function kreisSvg(namen,grad,opt){
  opt=opt||{};const cx=225,cy=125,r=100;const P=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  let s='<svg viewBox="0 0 450 250" role="img" aria-label="Kreisdiagramm" style="width:450px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#000" stroke-width="2"/>';
  let a=0;const lab=[];
  grad.forEach((g,i)=>{g=Math.max(0,g);const b=Math.min(360,a+g);
    if(b-a>0.0001){
      if(b-a>=359.999)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      else{const p1=P(a),p2=P(b);s+='<path d="M'+cx+' '+cy+' L'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' A'+r+' '+r+' 0 '+((b-a)>180?1:0)+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+' Z" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';}
      lab.push([i,(a+b)/2,b-a]);}
    a=b;});
  lab.forEach(([i,m,w])=>{const sn=Math.sin(m*Math.PI/180),cs=Math.cos(m*Math.PI/180);const px=cx+(r+10)*sn,py=cy-(r+10)*cs;
    const an=sn>0.15?"start":sn<-0.15?"end":"middle";const dy=cs>0.9?-3:cs<-0.9?14:4;
    const t=opt.texte?opt.texte[i]:(namen[i]||"")+(opt.winkel===false?"":" · "+dZ(grad[i])+"°");
    s+='<text x="'+px.toFixed(1)+'" y="'+(py+dy).toFixed(1)+'" text-anchor="'+an+'" font-size="13">'+dEsc(t)+'</text>';});
  return s+'</svg>';
}

/* ─── Zeichen-Helfer für Winkel und Dreiecke (Arbeitsblattvorlage: Bogen an jedem Winkel, Größe im Bogen, rechter Winkel mit Punkt, gleich lange Seiten mit zwei Strichen) ─── */
function wSvg(deg,cap){
  const S={x:150,y:deg>180?105:150},R=95,r=30,rad=d=>d*Math.PI/180;
  const E={x:S.x+R*Math.cos(rad(deg)),y:S.y-R*Math.sin(rad(deg))};
  let s='<svg viewBox="0 0 300 '+(deg>180?215:175)+'" role="img" aria-label="Winkel" style="width:220px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  if(deg>=360)s+='<circle cx="'+S.x+'" cy="'+S.y+'" r="'+r+'" fill="#e9e9e9" stroke="#000" stroke-width="1.5"/>';
  else{const ax=S.x+r*Math.cos(rad(deg)),ay=S.y-r*Math.sin(rad(deg));
    s+='<path d="M'+S.x+' '+S.y+' L'+(S.x+r)+' '+S.y+' A'+r+' '+r+' 0 '+(deg>180?1:0)+' 0 '+ax.toFixed(1)+' '+ay.toFixed(1)+' Z" fill="#e9e9e9" stroke="#000" stroke-width="1.5"/>';}
  if(deg===90)s+='<circle cx="'+(S.x+11)+'" cy="'+(S.y-11)+'" r="3" fill="#000"/>';
  s+='<line x1="'+S.x+'" y1="'+S.y+'" x2="'+(S.x+R)+'" y2="'+S.y+'" stroke="#000" stroke-width="3" stroke-linecap="round"/>';
  if(deg<360)s+='<line x1="'+S.x+'" y1="'+S.y+'" x2="'+E.x.toFixed(1)+'" y2="'+E.y.toFixed(1)+'" stroke="#000" stroke-width="3" stroke-linecap="round"/>';
  const sm=rad(deg+(360-deg)/2);s+='<circle cx="'+S.x+'" cy="'+S.y+'" r="3.5" fill="#000"/><text x="'+(S.x+16*Math.cos(sm)).toFixed(1)+'" y="'+(S.y-16*Math.sin(sm)+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="700">S</text>';
  return '<div><p><b>'+cap+'</b></p>'+s+'</svg></div>';
}
/* dSvg(alpha, beta, {w:{A:"50°",B:"?",C:"R"}, t:["a","b"], seiten:true}) – Basis AB waagerecht; "R" = rechter Winkel nur mit Punkt */
function dSvg(a,b,o){
  o=o||{};const g=180-a-b,rd=d=>d*Math.PI/180,bl=Math.sin(rd(b))/Math.sin(rd(g));
  const p={A:{x:0,y:0},B:{x:1,y:0},C:{x:bl*Math.cos(rd(a)),y:bl*Math.sin(rd(a))}};
  const xs=[0,1,p.C.x],mnx=Math.min(...xs),mxx=Math.max(...xs),mxy=p.C.y,sc=Math.min(230/(mxx-mnx),140/mxy);
  const T={};for(const k in p)T[k]={x:150+sc*(p[k].x-(mnx+mxx)/2),y:178-sc*p[k].y};
  const sub=(P,Q)=>({x:P.x-Q.x,y:P.y-Q.y}),len=v=>Math.hypot(v.x,v.y),un=v=>{const l=len(v)||1;return{x:v.x/l,y:v.y/l};};
  const G={x:(T.A.x+T.B.x+T.C.x)/3,y:(T.A.y+T.B.y+T.C.y)/3},W={A:a,B:b,C:g},nb={A:["B","C"],B:["A","C"],C:["A","B"]};
  let s='<svg viewBox="0 0 300 215" role="img" aria-label="Dreieck" style="width:260px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  const w=o.w||{};
  for(const k of ["A","B","C"]){
    if(w[k]===undefined)continue;
    const P=T[k],u=un(sub(T[nb[k][0]],P)),v=un(sub(T[nb[k][1]],P)),bi=un({x:u.x+v.x,y:u.y+v.y});
    const lab=w[k]==="R"?"":w[k],tw=7.2*lab.length,half=rd(W[k])/2;
    const ms=Math.min(len(sub(T[nb[k][0]],P)),len(sub(T[nb[k][1]],P)));
    const tR=lab?Math.max(15,(tw/2+3)/Math.sin(half)):0;
    const r=Math.min(0.5*ms,Math.max(24,tR+tw/2+5)),cr=u.x*v.y-u.y*v.x;
    s+='<path d="M'+P.x.toFixed(1)+' '+P.y.toFixed(1)+' L'+(P.x+r*u.x).toFixed(1)+' '+(P.y+r*u.y).toFixed(1)+' A'+r.toFixed(1)+' '+r.toFixed(1)+' 0 0 '+(cr>0?1:0)+' '+(P.x+r*v.x).toFixed(1)+' '+(P.y+r*v.y).toFixed(1)+' Z" fill="#e9e9e9" stroke="#000" stroke-width="1.3"/>';
    if(Math.abs(W[k]-90)<0.01)s+='<circle cx="'+(P.x+9*bi.x).toFixed(1)+'" cy="'+(P.y+9*bi.y).toFixed(1)+'" r="2.6" fill="#000"/>';
    if(lab)s+='<text x="'+(P.x+tR*bi.x).toFixed(1)+'" y="'+(P.y+tR*bi.y+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="700">'+lab+'</text>';
  }
  s+='<polygon points="'+["A","B","C"].map(k=>T[k].x.toFixed(1)+','+T[k].y.toFixed(1)).join(' ')+'" fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>';
  const SE={a:["B","C"],b:["A","C"],c:["A","B"]};
  for(const sn in SE){const P=T[SE[sn][0]],Q=T[SE[sn][1]],M={x:(P.x+Q.x)/2,y:(P.y+Q.y)/2},d=un(sub(Q,P));
    let n={x:-d.y,y:d.x};if((M.x-G.x)*n.x+(M.y-G.y)*n.y<0)n={x:-n.x,y:-n.y};
    if((o.t||[]).includes(sn))for(const of of[-3.5,3.5]){const c={x:M.x+of*d.x,y:M.y+of*d.y};s+='<line x1="'+(c.x-7*n.x).toFixed(1)+'" y1="'+(c.y-7*n.y).toFixed(1)+'" x2="'+(c.x+7*n.x).toFixed(1)+'" y2="'+(c.y+7*n.y).toFixed(1)+'" stroke="#000" stroke-width="2"/>';}
    if(o.seiten)s+='<text x="'+(M.x+15*n.x).toFixed(1)+'" y="'+(M.y+15*n.y+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-style="italic">'+sn+'</text>';}
  for(const k of ["A","B","C"]){const P=T[k],q=un(sub(P,G));s+='<text x="'+(P.x+15*q.x).toFixed(1)+'" y="'+(P.y+15*q.y+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="700">'+k+'</text>';}
  return s+'</svg>';
}

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ─── Motor: Aussehen (Arbeitsblattvorlage) ─── */
:root{color-scheme:light}*{box-sizing:border-box}html{background:#fff}
body{margin:0;background:#fff;color:#000;font-family:Arial,"Liberation Sans",Helvetica,sans-serif;font-size:18px;line-height:1.4;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto}
.oben{color:#6F6F6F;font-size:.8em;margin:0 0 .3em}
.titel{background:#00805F;color:#fff;font-weight:700;text-align:center;padding:.35em .5em;margin:0;font-size:1.4em}
.fortschritt{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5em;margin:0 0 .4em;font-size:.9em}
.kasten{border:2px solid #00805F;margin-top:.9em}
.kasten>h2{margin:0;font-size:1em;background:#D3F2E5;border-bottom:2px solid #00805F;padding:.3em .7em}
.kasten.fertig>h2::after{content:"  ✓";color:#00805F}
.innen{padding:.5em .8em .7em}
.innen p{margin:.35em 0}
.auftrag{font-weight:700}
.gross{font-size:1.1em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15}
.frac .fz{border-bottom:2px solid currentColor;padding:0 .15em .1em}.frac .fn{padding-top:.1em}
.ein{font:inherit;height:1.7em;text-align:center;border:1.5px solid #000;border-radius:0;background:#fff;color:inherit;padding:0;vertical-align:middle}
.ein.echo{background:#fff;color:#000}
.ein:focus{outline:none;background:#FFF3B0}
.ein.antw{width:100%;max-width:44em;text-align:left;padding:0 .5em;box-sizing:border-box}
.antw-z{margin:.4em 0 1em}
.ok{border-color:#2e7d32!important;background:#E5F4E6!important;border-width:2.5px!important}
.falsch{border-color:#C62828!important;background:#FDE7E7!important;border-width:2.5px!important}
.raster1,.raster2,.raster3,.raster4{display:grid;gap:.7em 1.4em}
.raster1{grid-template-columns:1fr}
.raster2{grid-template-columns:repeat(2,minmax(0,1fr))}.raster3{grid-template-columns:repeat(3,minmax(0,1fr))}.raster4{grid-template-columns:repeat(4,minmax(0,1fr))}
.erw{display:flex;align-items:center;gap:.2em;font-size:1.05em}
.erwm{display:flex;flex-direction:column;align-items:center;margin:0 .2em}.erwm .lab{font-size:.8em;white-space:nowrap}
.fig{display:flex;flex-direction:column;align-items:center;gap:.4em}.fig>b{align-self:flex-start}
.zeile{white-space:nowrap}
.g100{display:grid;grid-template-columns:repeat(10,1fr);width:9em;aspect-ratio:1;max-width:100%;border:1.5px solid #000}
.g100 i{border:.5px solid #666;display:block}.g100 i.an{background:#7fb89a}
.malen{width:13em;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.malbox{display:flex;flex-wrap:wrap;gap:1em;align-items:center}
.scroll{overflow-x:auto}
.tab{border-collapse:collapse;font-size:inherit}
.tab th,.tab td{border:1.5px solid #000;padding:.3em .8em;text-align:center;min-width:6.5em}
.tab th{background:#F2F2F2}.tab td.nr{min-width:0;border:0;font-weight:700}.tab th.nr{background:none;border:0;min-width:0}
.vgl{display:flex;align-items:center;gap:.5em;font-size:1.1em}
.wahl,.auswahl{display:inline-flex;flex-wrap:wrap;gap:.3em;vertical-align:middle}
.wahl button,.auswahl button{font:inherit;min-width:2.2em;height:1.9em;border:1.5px solid #000;background:#fff;color:#000;border-radius:0;cursor:pointer;padding:0 .4em}
.auswahl button{font-size:.9em}
.wahl button.an,.auswahl button.an{background:#FFE873}
.wahl.ok button.an,.auswahl.ok button.an{background:#E5F4E6;border-color:#2e7d32;border-width:2.5px}
.wahl.falsch button.an,.auswahl.falsch button.an{background:#FDE7E7;border-color:#C62828;border-width:2.5px}
.sit{line-height:1.9}
.mk{font-weight:700;padding:.05em .3em;border:1.5px dashed #999;cursor:pointer;user-select:none;-webkit-user-select:none}
.mk[data-r="G"]{color:#1565C0;border:2px solid #1565C0;background:#E3EEFB}
.mk[data-r="W"]{color:#C2410C;border:2px solid #C2410C;background:#FBEADF}
.mk[data-r="P"]{color:#2e7d32;border:2px solid #2e7d32;background:#E5F4E6}
.mk.falsch{outline:3px solid #C62828;outline-offset:1px}
.Gt{color:#1565C0}.Wt{color:#C2410C}.Pt{color:#2e7d32}
.gw{display:flex;flex-wrap:wrap;gap:.6em 1.6em}
.wegz{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;margin:.4em 0}.wegz>b{min-width:3em}
.km{white-space:nowrap}
.bildbox{display:flex;flex-wrap:wrap;gap:1em 1.6em;align-items:flex-start}.bildbox>.bild{flex:0 0 auto;max-width:100%}.bildbox>.rest{flex:1 1 16em;min-width:0}
.bild svg{max-width:100%;height:auto;display:block}
/* Prozentstreifen */
.streifen{margin:.5em 0 1em;max-width:30em}
.str-oben,.str-mitte{position:relative;min-height:2.2em}
.str-oben>span,.str-mitte>span{position:absolute;left:0;bottom:.15em;white-space:nowrap}
.str-mitte>span{top:.2em;bottom:auto}
.str-bar{display:flex;height:1.7em;border:2px solid #1565C0;background:#9FC2EC}
.str-w{background:#F2A672;border-right:2px solid #C2410C}
.str-klammer{display:block;width:100%;height:14px}
.str-g{text-align:center}
/* Verhältnisgleichung */
.vgl-gl{display:flex;flex-wrap:wrap;align-items:center;gap:.4em 1em;font-size:1.1em;margin:.3em 0}
.vgl-gl .pfeil{color:#6F6F6F}
.vgl-gl .frac .fz{border-bottom-color:#000}
.Gt .ein{color:#1565C0}.Wt .ein{color:#C2410C}.Pt .ein{color:#2e7d32}
.dgm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.3em 1.5em;margin-bottom:.6em}.dgm p{margin:.3em 0}
.sw{display:inline-block;width:1em;height:1em;border:1.5px solid #000;vertical-align:-.15em}
.live svg{max-width:100%;height:auto;display:block;margin:.5em 0}.summe{margin:.2em 0}
/* Zuordnen */
.zuo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5em 2.5em;max-width:34em}
.zuo .sp{display:flex;flex-direction:column;gap:.5em}
.zuo button,.sort button{font:inherit;min-height:2.2em;border:1.5px solid #000;background:#fff;color:#000;border-radius:0;cursor:pointer;padding:.2em .6em;position:relative}
.zuo button.wahl1{background:#FFE873}
.zuo button[data-p]::before{content:attr(data-nr);position:absolute;left:-.1em;top:-.65em;font-size:.65em;font-weight:700;background:#000;color:#fff;border-radius:1em;min-width:1.5em;line-height:1.5em;text-align:center}
.zuo button[data-p="0"]{background:#DDEBFA}.zuo button[data-p="1"]{background:#FCE3D3}.zuo button[data-p="2"]{background:#E0F2E1}
.zuo button[data-p="3"]{background:#F1E4F7}.zuo button[data-p="4"]{background:#FFF1C4}.zuo button[data-p="5"]{background:#DDF3F3}
.zuo button[data-p="6"]{background:#EDEDED}.zuo button[data-p="7"]{background:#F9DDE6}
/* Sortieren */
.sort{display:flex;flex-wrap:wrap;gap:.5em}
.sort button[data-nr]::before{content:attr(data-nr);position:absolute;left:-.1em;top:-.65em;font-size:.65em;font-weight:700;background:#00805F;color:#fff;border-radius:1em;min-width:1.5em;line-height:1.5em;text-align:center}
.sort button[data-nr]{background:#D3F2E5}
.sortreihe{color:#444;min-height:1.4em}
.pruefleiste{display:flex;flex-wrap:wrap;align-items:center;gap:.8em;margin-top:.7em}
button.pruefen,button.knopf{font:inherit;font-size:.9em;background:#fff;color:#000;border:1.5px solid #00805F;padding:.3em 1em;cursor:pointer;border-radius:0;font-weight:700}
button.pruefen:hover,button.knopf:hover{background:#D3F2E5}
button.knopf.warnung{background:#00805F;color:#fff}
button:focus-visible{outline:3px solid #00805F;outline-offset:2px}
.ergebnis{font-weight:700}.ergebnis.gut{color:#2e7d32}.ergebnis.noch{color:#C62828}
.fuss{text-align:right;font-style:italic;color:#6F6F6F;font-size:.7em;margin:1.2em 0 0}
nav.reiter{display:flex;flex-wrap:wrap;gap:.4em;margin:0 0 .7em}
nav.reiter button{font:inherit;font-size:.85em;border:2px solid #00805F;background:#fff;color:#000;padding:.35em .8em;cursor:pointer;border-radius:0}
nav.reiter button b{margin-right:.35em}
nav.reiter button[aria-selected="true"]{background:#00805F;color:#fff}
@media (max-width:820px){.raster4{grid-template-columns:repeat(2,minmax(0,1fr))}.raster3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.raster2,.raster3{grid-template-columns:1fr}.zuo{gap:.5em 1.2em}}
</style>
</head>
<body>
<div class="wrap">
<p class="oben" id="oben"></p>
<nav class="reiter" role="tablist" aria-label="Übungen" id="reiter"></nav>
<div class="fortschritt"><span id="stand"></span><button type="button" class="knopf" id="neu">Neu beginnen</button></div>
<div id="blaetter"></div>
<p class="fuss" id="fuss"></p>
</div>
<script>
/* ─── Motor: Technik (nicht ändern) ─── */
(function(){
"use strict";
const ABC="abcdefghijklmnopqrstuvwxyz";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const deZahl=x=>{const r=Math.round(x*1e9)/1e9;return String(r).replace(".",",");};
const wert=s=>{s=String(s).trim().replace(/\s/g,"");if(s.includes("/")){const[a,b]=s.split("/");return num(a)/num(b);}return num(s);};
const num=s=>{const t=String(s).replace(/\s+/g,"").replace(",",".");return t!==""&&!isNaN(t)?parseFloat(t):NaN;};
const norm=s=>String(s).replace(/\s+/g,"").replace(/\./g,",").replace(/%$/,"").toLowerCase();
const mischen=a=>{const b=a.slice();if(b.length<2)return b;let n=0;do{for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}n++;}while(n<20&&b.every((x,i)=>x===a[i]));return b;};

/* Kurzschrift → HTML */
function feld(antw,label){
  let fid="";antw=antw.replace(/#(\w+)\s*$/,(m,s)=>{fid=s;return "";});
  const alle=antw.split("|").map(x=>x.trim());
  const lang=Math.max(...alle.map(x=>x.length));
  const zahl=alle.every(x=>/^[\d\s,.%+\-]*$/.test(x));
  const w=zahl||lang<=2?Math.max(2.6,lang*.55+1.5).toFixed(1):Math.max(5,Math.min(9,lang*.5+1.5)).toFixed(1);
  return '<input class="ein" data-a="'+esc(alle.join("|"))+'"'+(fid?' data-id="'+fid+'"':'')+' style="width:'+w+'em"'+(zahl?' inputmode="decimal"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="'+(label||"Antwort")+'">';
}
function inl(t){
  t=String(t);const lager=[];const pack=h=>"\u0001"+(lager.push(h)-1)+"\u0002";
  t=t.replace(/\(\((.*?)\)\)/g,(m,inh)=>{
    const opt=inh.split("|").map(x=>x.trim());let soll="";
    const kn=opt.map(o=>{let z=o;if(z.startsWith("*")){z=z.slice(1).trim();soll=z;}return z;});
    const kl="auswahl";
    return pack('<span class="'+kl+'" data-soll="'+esc(soll)+'">'+kn.map(z=>'<button type="button" data-z="'+esc(z)+'">'+inl(z)+'</button>').join("")+'</span>');
  });
  t=t.replace(/\[([GWP]):([^\]]*)\]/g,(m,r,z)=>pack('<span class="mk" data-r="" data-soll="'+r+'">'+z+'</span>'));
  t=t.replace(/\[=([^\]]*)\]/g,(m,v)=>pack('<span class="frac fin" data-v="'+wert(v)+'"><span class="fz"><input class="ein" style="width:2.8em" inputmode="numeric" autocomplete="off" aria-label="Zähler"></span><span class="fn"><input class="ein" style="width:2.8em" inputmode="numeric" autocomplete="off" aria-label="Nenner"></span></span>'));
  t=t.replace(/\[@(\w+)\]/g,(m,id)=>pack('<input class="ein echo" readonly tabindex="-1" data-echo="'+id+'" style="width:4.8em" aria-label="Dein Wert von vorhin">'));
  t=t.replace(/\[([^\[\]]*)\]/g,(m,a)=>pack(feld(a)));
  t=t.replace(/\{([^{}]*)\}/g,(m,inh)=>{const i=inh.indexOf("/");if(i<0)return m;
    return '<span class="frac"><span class="fz">'+inh.slice(0,i).trim()+'</span><span class="fn">'+inh.slice(i+1).trim()+'</span></span>';});
  t=t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  t=t.replace(/<blau>/g,'<span class="Gt">').replace(/<orange>/g,'<span class="Wt">').replace(/<gruen>/g,'<span class="Pt">').replace(/<\/(blau|orange|gruen)>/g,"</span>");
  for(let k=0;k<3;k++)t=t.replace(/\u0001(\d+)\u0002/g,(m,i)=>lager[+i]);
  return t;
}
const nr=(i,a)=>a.nummern===false?"":"<b>"+ABC[i]+")</b> ";
const raster=(a,std)=>"raster"+(a.spalten||std||1);

/* Aufgabenarten */
const ARTEN={
  luecke(a){
    if(a.items.some(x=>typeof x==="object"))
      return a.items.map((it,i)=>{if(typeof it==="string")return '<p>'+nr(i,a)+inl(it)+'</p>';
        let h=it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':"";
        const z=it.z==null?[]:it.z;
        if(Array.isArray(z))h+='<p class="gw">'+z.map(x=>'<span>'+inl(x)+'</span>').join("")+'</p>';else h+='<p>'+inl(z)+'</p>';
        return h;}).join("");
    const sp=a.spalten||1;
    return '<div class="'+raster(a)+(a.gross?" gross":"")+'">'+a.items.map((x,i)=>'<div'+(sp>1?' class="km"':'')+'>'+nr(i,a)+inl(x)+'</div>').join("")+'</div>';
  },
  erweitern(a){
    const ziel=a.ziel||100;
    return '<div class="'+raster(a,4)+'">'+a.items.map((b,i)=>{const[z,n]=String(b).split("/").map(Number);const f=ziel/n;
      return '<div class="erw">'+nr(i,a)+inl("{"+z+"/"+n+"}")+'<span class="erwm"><span class="lab">· '+feld(deZahl(f),"Faktor")+'</span><span>=</span></span>'+inl("{["+deZahl(z*f)+"]/"+ziel+"}")+'</div>';}).join("")+'</div>';
  },
  hunderterfeld(a){
    return '<div class="'+raster(a,3)+'">'+a.items.map((it,i)=>{const n=typeof it==="object"?it.an:it;
      const z=typeof it==="object"&&it.z?it.z:"{["+n+"]/100} = ["+deZahl(n/100)+"] = ["+n+"] %";
      let g='<div class="g100">';for(let k=0;k<100;k++)g+='<i'+(k<n?' class="an"':'')+'></i>';g+='</div>';
      return '<div class="fig">'+(a.nummern===false?"":"<b>"+ABC[i]+")</b>")+g+'<div class="zeile">'+inl(z)+'</div></div>';}).join("")+'</div>';
  },
  faerben(a){
    let g='<div class="g100 malen" data-soll="'+a.soll+'">';for(let k=0;k<100;k++)g+='<i></i>';
    return '<div class="malbox">'+g+'</div><p class="zaehler">Gefärbt: <b>0</b> Kästchen</p></div>';
  },
  tabelle(a){
    const n=a.nummern!==false;
    let h='<div class="scroll"><table class="tab"><tr>'+(n?'<th class="nr"></th>':'')+a.kopf.map(k=>'<th>'+inl(k)+'</th>').join("")+'</tr>';
    a.zeilen.forEach((z,i)=>{h+='<tr>'+(n?'<td class="nr">'+ABC[i]+')</td>':'')+z.map(c=>'<td>'+inl(c)+'</td>').join("")+'</tr>';});
    return h+'</table></div>';
  },
  vergleichen(a){
    return '<div class="'+raster(a,2)+'">'+a.items.map(([l,s,r])=>'<div class="vgl"><span>'+inl(l)+'</span><span class="wahl" data-soll="'+esc(s)+'"><button type="button" data-z="<">&lt;</button><button type="button" data-z="=">=</button><button type="button" data-z=">">&gt;</button></span><span>'+inl(r)+'</span></div>').join("")+'</div>';
  },
  auswahl(a){
    return a.items.map(([t,r,opt])=>{const o=opt||a.optionen;
      return '<div class="wegz">'+inl(t)+inl("(("+o.map(x=>(x===r?"*":"")+x).join("|")+"))")+'</div>';}).join("");
  },
  markieren(a){
    return a.items.map((t,i)=>'<p class="sit">'+nr(i,a)+inl(t)+'</p>').join("");
  },
  streifen(a){
    return a.items.map((it,i)=>{const p=Math.max(0,Math.min(100,it.anteil));
      return (it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':(a.items.length>1&&a.nummern!==false?'<p>'+nr(i,a)+'</p>':''))+
      '<div class="streifen"><div class="str-oben"><span class="Wt">W = '+inl(it.W)+'</span></div>'+
      '<div class="str-bar"><div class="str-w" style="width:'+p+'%"></div></div>'+
      '<div class="str-mitte"><span class="Pt">p % = '+inl(it.p)+'</span></div>'+
      '<svg class="str-klammer" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 Q1 7 8 7 L44 7 Q50 7 50 13 Q50 7 56 7 L92 7 Q99 7 99 1" fill="none" stroke="#1565C0" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'+
      '<div class="str-g Gt">G = '+inl(it.G)+' ≙ 100 %</div></div>';}).join("");
  },
  verhaeltnis(a){
    return a.items.map((it,i)=>{
      const x=it.x||"W";const ans=it.ansatz!==false;
      const teil=k=>{const v=deZahl(it[k]);if(k===x)return ans?"[x]":"x";return ans?"["+v+"]":v;};
      const fr=(o,u)=>'<span class="frac"><span class="fz">'+o+'</span><span class="fn">'+u+'</span></span>';
      const bs=deZahl(it.bas||100);
      const gi=k=>'<input class="ein gl" data-pos="'+k+'" style="width:3.6em" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Feld der Verhältnisgleichung">';
      const tok=k=>k===x?"x":deZahl(it[k]);
      const sol=JSON.stringify([tok("G"),bs,tok("W"),tok("p")]);
      const glei=ans?fr(gi(0),gi(1)+" %")+" = "+fr(gi(2),gi(3)+" %"):fr(inl(teil("G")),bs+" %")+" = "+fr(inl(teil("W")),inl(teil("p"))+" %");
      const ein=it.einheit?" "+it.einheit:"";
      const id=it.id?"#"+it.id:"";
      const erg='x = '+inl("["+deZahl(it[x])+(ein?"|"+deZahl(it[x])+ein:"")+id+"]")+(x==="p"?"":ein);
      return (it.s?'<p class="sit">'+nr(i,a)+inl(it.s)+'</p>':'<p>'+nr(i,a)+'</p>')+
        '<div class="vgl-gl"'+(ans?' data-gl="1" data-sol="'+esc(sol)+'"':'')+'><span>'+glei+'</span></div>'+
        '<p>'+erg+'</p>'+(it.antwort?'<p class="antw-z"><b>Antwortsatz:</b> <input type="text" class="ein antw" autocomplete="off" aria-label="Antwortsatz" data-w="'+deZahl(it[x])+'" data-e="'+(it.einheit||"")+'"></p>':'');}).join("")+(a.nach?"":"");
  },
  streifenbau(a){
    const rows=a.daten.map((d,i)=>'<tr data-n="'+esc(d[0])+'"><td style="text-align:left"><i class="sw" style="background:'+DFARBEN[i%5]+'"></i> '+esc(d[0])+'</td><td>'+deZahl(d[1])+' %</td><td>'+feld(deZahl(d[1]/10),"Länge")+' cm</td></tr>').join("");
    return '<div class="scroll"><table class="tab"><tr><th>Bereich</th><th>p %</th><th>Länge</th></tr>'+rows+'</table></div><div class="live" data-typ="streifen"></div>';
  },
  kreisbau(a){
    const rows=a.daten.map((d,i)=>'<tr data-n="'+esc(d[0])+'"><td style="text-align:left"><i class="sw" style="background:'+DFARBEN[i%5]+'"></i> '+esc(d[0])+'</td><td>'+deZahl(d[1])+' %</td><td>'+feld(String(Math.round(d[1]*3.6)),"Winkel")+'°</td></tr>').join("");
    return '<div class="scroll"><table class="tab"><tr><th>Bereich</th><th>p %</th><th>Winkel</th></tr>'+rows+'</table></div><div class="live" data-typ="kreis"></div>';
  },
  zuordnen(a){
    const re=mischen(a.paare.map((p,i)=>i));
    return '<div class="zuo">'+a.paare.map((p,i)=>'<button type="button" data-s="l" data-i="'+i+'">'+inl(p[0])+'</button>'+
      '<button type="button" data-s="r" data-i="'+re[i]+'">'+inl(a.paare[re[i]][1])+'</button>').join("")+'</div>';
  },
  richtigfalsch(a){
    return a.items.map(([t,r],i)=>'<div class="wegz"><span>'+nr(i,a)+inl(t)+'</span>'+inl(r?"((*richtig|falsch))":"((richtig|*falsch))")+'</div>').join("");
  },
  sortieren(a){
    const m=mischen(a.items.map((x,i)=>i));
    return '<div class="sort" data-n="'+a.items.length+'">'+m.map(i=>'<button type="button" data-i="'+i+'">'+inl(a.items[i])+'</button>').join("")+'</div><p class="sortreihe"></p>';
  }
};
const AUFTRAG={streifenbau:"Rechne die Länge aus und trage sie ein. Dein Streifen wächst unter der Tabelle.",
  kreisbau:"Rechne den Winkel aus (ganze Grad) und trage ihn ein. Dein Kreis wächst unter der Tabelle.",
  vergleichen:"Tippe auf &lt;, = oder &gt;.",
  markieren:'Tippe jede fett gedruckte Zahl an: 1× <b class="Gt">blau = G</b>, 2× <b class="Wt">orange = W</b>, 3× <b class="Pt">grün = p %</b>.',
  zuordnen:"Was gehört zusammen? Tippe links und dann rechts an.",
  richtigfalsch:"Richtig oder falsch? Tippe an.",
  sortieren:"Tippe die Zahlen der Größe nach an. Beginne mit der kleinsten.",
  verhaeltnis:"Stelle die Verhältnisgleichung auf. Schreibe x für die gesuchte Größe. Trage dann das Ergebnis ein.",
  faerben:"Tippe Kästchen an oder wische darüber."};

function baueAufgabe(a,n){
  let inh=ARTEN[a.art]?ARTEN[a.art](a):'<p style="color:#C62828">Unbekannte Aufgabenart: '+esc(a.art)+'</p>';
  if(a.bild)inh=a.bildoben?'<div class="bild">'+a.bild+'</div>'+inh:'<div class="bildbox"><div class="bild">'+a.bild+'</div><div class="rest">'+inh+'</div></div>';
  const auf=a.auftrag!=null?inl(a.auftrag):(AUFTRAG[a.art]||"");
  return '<section class="kasten" data-aufgabe><h2>Aufgabe '+n+(a.name?' · '+esc(a.name):'')+(a.stern?' ★':'')+'</h2><div class="innen">'+
    (auf?'<p class="auftrag">'+auf+'</p>':'')+inh+(a.nach?inl(a.nach):'')+
    '<div class="pruefleiste"><button type="button" class="pruefen">Prüfen</button><span class="ergebnis" aria-live="polite"></span></div></div></section>';
}
function baueBlatt(u,i){
  const s=document.createElement("section");s.className="blatt";s.id="uebung"+(i+1);s.hidden=true;
  s.innerHTML='<div class="titel"><a class="ll-zurueck" href="../" aria-label="Zurück zur Lern-Lounge 10. Klasse">← Zurück</a><span>'+esc(u.titel)+'</span><button type="button" class="ll-spick" aria-haspopup="dialog">Spickzettel</button></div>'+u.aufgaben.map((a,k)=>baueAufgabe(a,k+1)).join("");
  binde(s);return s;
}

/* Bedienung */
function binde(B){
  B.querySelectorAll(".wahl,.auswahl").forEach(g=>g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    g.querySelectorAll("button").forEach(x=>x.classList.toggle("an",x===b));g.classList.remove("ok","falsch");})));
  B.querySelectorAll(".mk").forEach(m=>m.addEventListener("click",()=>{const o=["","G","W","P"];m.dataset.r=o[(o.indexOf(m.dataset.r)+1)%4];m.classList.remove("falsch");}));
  B.querySelectorAll(".g100.malen").forEach(g=>{
    let modus=null;const z=g.closest(".innen").querySelector(".zaehler b");
    const upd=()=>{if(z)z.textContent=g.querySelectorAll("i.an").length;g.classList.remove("ok","falsch");};
    const zelle=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===g?el:null;};
    g.addEventListener("pointerdown",e=>{const c=zelle(e);if(!c)return;modus=!c.classList.contains("an");c.classList.toggle("an",modus);g.setPointerCapture(e.pointerId);e.preventDefault();upd();});
    g.addEventListener("pointermove",e=>{if(modus===null)return;const c=zelle(e);if(c&&c.classList.contains("an")!==modus){c.classList.toggle("an",modus);upd();}});
    ["pointerup","pointercancel"].forEach(n=>g.addEventListener(n,()=>modus=null));
  });
  B.querySelectorAll(".zuo").forEach(Z=>{
    let gew=null;
    const farbe=()=>{const L=[...Z.querySelectorAll('[data-s="l"]')];let k=0;
      Z.querySelectorAll("button").forEach(b=>{delete b.dataset.p;delete b.dataset.nr;b.classList.remove("ok","falsch");});
      L.forEach(l=>{if(l.dataset.mit!=null&&l.dataset.mit!==""){const r=Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]');
        l.dataset.p=r.dataset.p=k%8;l.dataset.nr=r.dataset.nr=++k;}});};
    Z.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const seite=b.dataset.s;
      // schon verbunden → lösen
      if(seite==="l"&&b.dataset.mit){b.dataset.mit="";gew=null;Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));farbe();return;}
      if(seite==="r"){const l=Z.querySelector('[data-s="l"][data-mit="'+b.dataset.i+'"]');if(l&&!(gew&&gew.dataset.s==="l")){l.dataset.mit="";farbe();return;}}
      if(!gew||gew.dataset.s===seite){Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));gew=b;b.classList.add("wahl1");return;}
      const l=seite==="l"?b:gew,r=seite==="r"?b:gew;
      Z.querySelectorAll('[data-s="l"]').forEach(x=>{if(x.dataset.mit===r.dataset.i)x.dataset.mit="";});
      l.dataset.mit=r.dataset.i;gew.classList.remove("wahl1");gew=null;farbe();
    }));
  });
  B.querySelectorAll(".sort").forEach(S=>{
    const reihe=[];const txt=S.nextElementSibling;
    const zeig=()=>{S.querySelectorAll("button").forEach(b=>{const p=reihe.indexOf(b);b.classList.remove("ok","falsch");if(p<0)delete b.dataset.nr;else b.dataset.nr=p+1;});
      txt.innerHTML=reihe.length?"Deine Reihenfolge: "+reihe.map(b=>b.innerHTML).join(" &lt; "):"";};
    S._reihe=reihe;
    S.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const p=reihe.indexOf(b);if(p<0)reihe.push(b);else reihe.splice(p,1);zeig();}));
  });
  B.querySelectorAll(".live").forEach(L=>{const T=L.closest(".innen");
    const upd=()=>{const R=[...T.querySelectorAll("tr[data-n]")];const namen=R.map(r=>r.dataset.n);
      const v=R.map(r=>{const x=num(r.querySelector("input").value);return isNaN(x)||x<0?0:x;});
      if(L.dataset.typ==="streifen")L.innerHTML=streifenSvg(namen,v,{live:true});
      else{const s=v.reduce((p,q)=>p+q,0);L.innerHTML=kreisSvg(namen,v)+'<p class="summe">Summe der Winkel: <b>'+dZ(s)+'</b>° '+(Math.abs(s-360)<1e-9?"✓":"(soll 360° sein)")+'</p>';}};
    T.addEventListener("input",upd);upd();});
  B.querySelectorAll("[data-aufgabe]").forEach(k=>k.querySelector(".pruefen").addEventListener("click",()=>pruefe(k)));
}
document.addEventListener("input",e=>{if(e.target.tagName==="INPUT")e.target.classList.remove("ok","falsch");});
document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.id;if(!id)return;const B=e.target.closest(".blatt");if(B)B.querySelectorAll('.echo[data-echo="'+id+'"]').forEach(el=>el.value=e.target.value);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("ein")){e.preventDefault();const k=e.target.closest("[data-aufgabe]");if(k)pruefe(k);}});

function pruefe(k){
  let r=0,n=0;const setz=(el,ok)=>{el.classList.toggle("ok",ok);el.classList.toggle("falsch",!ok);if(ok)r++;};
  k.querySelectorAll("input[data-a]").forEach(i=>{n++;const ok=i.dataset.a.split("|").some(a=>{const x=num(i.value),y=num(a);
    return (!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-9)||(i.value.trim()!==""&&norm(i.value)===norm(a));});setz(i,ok);});
  k.querySelectorAll("input.antw").forEach(i=>{n++;const t=i.value.trim(),w=parseFloat(i.dataset.w.replace(",","."));
    const zs=(t.replace(/(\d)\s(?=\d{3}\b)/g,"$1").match(/\d+(?:[.,]\d+)?/g)||[]).map(z=>parseFloat(z.replace(",",".")));
    const E={"€":/€|euro/i,"g":/(^|[\d\s])g(\b|$)|gramm/i,"km":/km|kilometer/i}[i.dataset.e];
    const ok=t.split(/\s+/).length>=3&&zs.some(z=>Math.abs(z-w)<1e-9)&&(!i.dataset.e||(E?E.test(t):t.toLowerCase().includes(i.dataset.e.toLowerCase())));setz(i,ok);});
  k.querySelectorAll(".fin").forEach(f=>{n++;const[a,b]=f.querySelectorAll("input");const x=num(a.value),y=num(b.value);
    const ok=!isNaN(x)&&!isNaN(y)&&y!==0&&Math.abs(x/y-parseFloat(f.dataset.v))<1e-9;[a,b].forEach(i=>{i.classList.toggle("ok",ok);i.classList.toggle("falsch",!ok);});if(ok)r++;});
  k.querySelectorAll(".wahl,.auswahl").forEach(g=>{n++;const an=g.querySelector("button.an");setz(g,!!an&&an.dataset.z===g.dataset.soll);});
  k.querySelectorAll(".mk").forEach(m=>{n++;const ok=m.dataset.r===m.dataset.soll;m.classList.toggle("falsch",!ok);if(ok)r++;});
  k.querySelectorAll(".g100.malen").forEach(g=>{n++;setz(g,g.querySelectorAll("i.an").length===+g.dataset.soll);});
  k.querySelectorAll(".zuo").forEach(Z=>Z.querySelectorAll('[data-s="l"]').forEach(l=>{n++;const ok=l.dataset.mit===l.dataset.i;
    const rr=l.dataset.mit?Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]'):null;
    l.classList.toggle("ok",ok);l.classList.toggle("falsch",!ok);if(rr){rr.classList.toggle("ok",ok);rr.classList.toggle("falsch",!ok);}if(ok)r++;}));
  k.querySelectorAll(".sort").forEach(S=>{const R=S._reihe;S.querySelectorAll("button").forEach(b=>{n++;const p=R.indexOf(b);setz(b,p>=0&&+b.dataset.i===p);});});
  /* Verhältnisgleichung: jede richtig aufgestellte Gleichung zählt (Seiten tauschen, Brüche umdrehen, über Kreuz) */
  k.querySelectorAll(".vgl-gl[data-gl]").forEach(E=>{n++;const [G,B,W,P]=JSON.parse(E.dataset.sol);
    const AR=[[G,B,W,P],[W,P,G,B],[B,G,P,W],[P,W,B,G],[G,W,B,P],[B,P,G,W],[W,G,P,B],[P,B,W,G]];
    const f=[...E.querySelectorAll("input.gl")].map(i=>i.value.trim().replace(/%/g,"").replace(/\s+/g,"").toLowerCase());
    const gl=(a,b)=>{if(a==="x"||b==="x")return a===b;const u=num(a),v=num(b);return !isNaN(u)&&!isNaN(v)&&Math.abs(u-v)<1e-9;};
    const ok=AR.some(r=>r.every((v,i)=>gl(f[i],String(v).toLowerCase())));
    E.querySelectorAll("input.gl").forEach(i=>{i.classList.toggle("ok",ok);i.classList.toggle("falsch",!ok);});if(ok)r++;});
  const e=k.querySelector(".ergebnis");
  if(r===n){e.textContent="Super, alles richtig! ("+r+" von "+n+")";e.className="ergebnis gut";k.classList.add("fertig");}
  else{e.textContent=r+" von "+n+" richtig. Verbessere die rot markierten Stellen.";e.className="ergebnis noch";k.classList.remove("fertig");}
  stand();
}
function stand(){const B=document.querySelector(".blatt:not([hidden])");if(!B)return;const alle=B.querySelectorAll("[data-aufgabe]").length,f=B.querySelectorAll("[data-aufgabe].fertig").length;
  document.getElementById("stand").textContent=f+" von "+alle+" Aufgaben geschafft"+(f===alle?" – klasse!":"");}

/* Aufbau der Seite */
document.title="Übungen "+BLATT.thema.replace(/\s*–\s*/," ");
document.getElementById("oben").textContent="Interaktive Arbeitsblätter · "+BLATT.thema;
document.getElementById("fuss").textContent="Erstellt von Marion Klugmann ("+BLATT.erstellt+") mit freundlicher Unterstützung von Claude.";
const nav=document.getElementById("reiter"),box=document.getElementById("blaetter");
BLATT.uebungen.forEach((u,i)=>{
  const t=document.createElement("button");t.type="button";t.setAttribute("role","tab");t.dataset.b="uebung"+(i+1);
  t.innerHTML="<b>Übung "+(i+1)+"</b>"+esc(u.reiter||"");nav.appendChild(t);box.appendChild(baueBlatt(u,i));
});
const tabs=[...nav.querySelectorAll("button")];
let aktiv="uebung1";
function zeige(id){if(!document.getElementById(id))id="uebung1";aktiv=id;tabs.forEach(t=>t.setAttribute("aria-selected",t.dataset.b===id));
  document.querySelectorAll(".blatt").forEach(b=>b.hidden=b.id!==id);stand();}
tabs.forEach(t=>t.addEventListener("click",()=>{if(location.hash!=="#"+t.dataset.b)location.hash=t.dataset.b;else zeige(t.dataset.b);window.scrollTo({top:0});}));
window.addEventListener("hashchange",()=>zeige(location.hash.slice(1)));
const btn=document.getElementById("neu");let tm=null;
btn.addEventListener("click",()=>{
  if(!btn.classList.contains("warnung")){btn.classList.add("warnung");btn.textContent="Wirklich?";tm=setTimeout(()=>{btn.classList.remove("warnung");btn.textContent="Neu beginnen";},3000);return;}
  clearTimeout(tm);btn.classList.remove("warnung");btn.textContent="Neu beginnen";
  const alt=document.getElementById(aktiv),i=+aktiv.slice(6)-1,neu=baueBlatt(BLATT.uebungen[i],i);neu.hidden=false;alt.replaceWith(neu);
  stand();window.scrollTo({top:0,behavior:"smooth"});
});
zeige(location.hash.slice(1));
})();
</script>
