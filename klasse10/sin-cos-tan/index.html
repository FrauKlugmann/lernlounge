<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sinus, Kosinus und Tangens – Interaktive Arbeitsblätter</title>
<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  AUFGABENBLOCK – NUR AB HIER ÄNDERN                              ║
   ║  Alles unterhalb von „ENDE AUFGABENBLOCK“ ist der feste Motor.   ║
   ╚══════════════════════════════════════════════════════════════════╝
   Kurzschrift in Texten:
     [30]          Eingabefeld, Lösung 30 (Komma/Punkt egal)
     [0,5|,5]      mehrere richtige Antworten mit |
     {3/10}        Bruch;  {[30]/100}  Bruch mit Feld im Zähler
     [=7/100]      Bruch frei eingeben (jeder gleichwertige Bruch zählt)
     ((A|*B|C))    Auswahlknöpfe, * = richtig
     [G:40] [W:10] [P:25 %]   Zahl zum Markieren (nur Art "markieren")
     **fett**   <blau>…</blau>  <orange>…</orange>  <gruen>…</gruen>
   Aufgabenarten: luecke, erweitern, hunderterfeld, faerben, tabelle,
     vergleichen, auswahl, markieren, streifen, verhaeltnis, zuordnen,
     richtigfalsch, sortieren, streifenbau, kreisbau   (jede kann zusätzlich bild:"<svg…>" haben)
*/
/* ─── Diagramm-Helfer (Teil des Motors, auch für feste Bilder in Aufgaben nutzbar) ─── */
const DFARBEN=["#F4B6B0","#B7DFB9","#FFE08A","#CDBBE8","#A9DDE6"];
const dEsc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const dZ=x=>String(Math.round(x*10)/10).replace(".",",");
/* streifenSvg(namen, cm, {live, bis, texte}) – bis = Länge der Skala (Standard 10), texte = eigene Beschriftung je Teil */
function streifenSvg(namen,cm,opt){
  opt=opt||{};const x0=10,y0=22,h=40,pc=50,bis=opt.bis||10;const B=565+(bis-10)*pc;
  let s='<svg viewBox="0 0 '+B+' 100" role="img" aria-label="Streifendiagramm" style="width:'+B+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  let x=0;
  cm.forEach((c,i)=>{c=Math.max(0,c);const w=Math.max(0,Math.min(c,bis-x))*pc;
    if(w>0){s+='<rect x="'+(x0+x*pc)+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      const n=(opt.texte?opt.texte[i]:namen[i])||"";if(n&&w>=n.length*7+8)s+='<text x="'+(x0+x*pc+w/2)+'" y="'+(y0+h/2+5)+'" text-anchor="middle" font-size="13">'+dEsc(n)+'</text>';}
    x=Math.min(bis,x+c);});
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+10*pc+'" height="'+h+'" fill="none" stroke="#000" stroke-width="2"/>';
  for(let k=0;k<=bis;k++)s+='<line x1="'+(x0+k*pc)+'" y1="'+(y0+h)+'" x2="'+(x0+k*pc)+'" y2="'+(y0+h+8)+'" stroke="#000" stroke-width="1.5"/><text x="'+(x0+k*pc)+'" y="'+(y0+h+23)+'" text-anchor="middle" font-size="13">'+k+'</text>';
  s+='<text x="'+(x0+bis*pc+20)+'" y="'+(y0+h+23)+'" font-size="13">cm</text>';
  const sum=cm.reduce((a,b)=>a+Math.max(0,b),0);
  if(opt.live&&sum>10.0001)s+='<text x="10" y="12" font-size="13" fill="#C62828" font-weight="700">Zu lang! Der Streifen ist nur 10 cm lang.</text>';
  return s+'</svg>';
}
/* kreisSvg(namen, grad, {winkel:false, texte}) – texte = eigene Beschriftung je Teil */
function kreisSvg(namen,grad,opt){
  opt=opt||{};const cx=225,cy=125,r=100;const P=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  let s='<svg viewBox="0 0 450 250" role="img" aria-label="Kreisdiagramm" style="width:450px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#000" stroke-width="2"/>';
  let a=0;const lab=[];
  grad.forEach((g,i)=>{g=Math.max(0,g);const b=Math.min(360,a+g);
    if(b-a>0.0001){
      if(b-a>=359.999)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';
      else{const p1=P(a),p2=P(b);s+='<path d="M'+cx+' '+cy+' L'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' A'+r+' '+r+' 0 '+((b-a)>180?1:0)+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+' Z" fill="'+DFARBEN[i%5]+'" stroke="#000" stroke-width="1.5"/>';}
      lab.push([i,(a+b)/2,b-a]);}
    a=b;});
  lab.forEach(([i,m,w])=>{const sn=Math.sin(m*Math.PI/180),cs=Math.cos(m*Math.PI/180);const px=cx+(r+10)*sn,py=cy-(r+10)*cs;
    const an=sn>0.15?"start":sn<-0.15?"end":"middle";const dy=cs>0.9?-3:cs<-0.9?14:4;
    const t=opt.texte?opt.texte[i]:(namen[i]||"")+(opt.winkel===false?"":" · "+dZ(grad[i])+"°");
    s+='<text x="'+px.toFixed(1)+'" y="'+(py+dy).toFixed(1)+'" text-anchor="'+an+'" font-size="13">'+dEsc(t)+'</text>';});
  return s+'</svg>';
}

/* ─── Geometrie-Helfer „Rechtwinklige Dreiecke“ (Arbeitsblattvorlage: rechter Winkel mit Bogen und Punkt, Ecken gegen den Uhrzeigersinn, Seite gegenüber der gleichnamigen Ecke) ─── */
const gU=(x,y)=>{const l=Math.hypot(x,y)||1;return[x/l,y/l];};
const gE=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const gZ=(x,d)=>{const f=Math.pow(10,d==null?1:d);return String(Math.round(x*f)/f).replace(".",",");};
function gT(x,y,s,o){o=o||{};return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+(o.size||16)+'" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" fill="'+(o.fill||"#000")+'"'+(o.bold?' font-weight="700"':'')+(o.it?' font-style="italic"':'')+'>'+gE(s)+'</text>';}
/* rtSvg({e:["A","B","C"], r:2, L:[4,3], rot:0, s:{a:"5 cm"}, farbe:{c:"#C62828"}, klick:false, w:260})
   e = Ecken gegen den Uhrzeigersinn · r = Index der Ecke mit dem rechten Winkel · L = [Länge zur nächsten Ecke, Länge zur übernächsten]
   rot = Drehung in Grad · s = Seitenbeschriftung (Schlüssel = kleiner Buchstabe; fehlt eine Seite, steht ihr Buchstabe; s:false = keine)
   fix = feste Pixel je Einheit (dann wächst das Dreieck sichtbar), org = [x,y] Lage des rechten Winkels bei fix */
function rtSvg(o){
  o=o||{};const e=o.e||["A","B","C"],r=o.r==null?2:o.r,L=o.L||[4,3],rot=(o.rot||0)*Math.PI/180;
  const n=(r+1)%3,p=(r+2)%3,raw=[];raw[r]=[0,0];raw[n]=[L[0],0];raw[p]=[0,L[1]];
  /* Regel: erste Ecke links unten, dann gegen den Uhrzeigersinn → Seite e0e1 waagerecht unten, e0 links; rot erzeugt nur eine leichte Neigung */
  const phi=Math.atan2(raw[1][1]-raw[0][1],raw[1][0]-raw[0][0]),al=(Math.atan2(raw[2][1]-raw[0][1],raw[2][0]-raw[0][0])-phi)*180/Math.PI;
  const kw=o.kipp!=null?o.kipp:(o.rot?((Math.round(o.rot)*7)%21+21)%21:0),kipp=Math.min(kw,Math.max(0,90-(((al%360)+360)%360)-3))*Math.PI/180,w0=-phi+kipp;
  const pts=raw.map(([x,y])=>{x-=raw[0][0];y-=raw[0][1];return[x*Math.cos(w0)-y*Math.sin(w0),x*Math.sin(w0)+y*Math.cos(w0)];});
  const pad=o.pad||(o.s&&Object.values(o.s).some(x=>String(x).length>2)?60:44),xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),W=o.bw||300;
  const dxs=(Math.max(...xs)-Math.min(...xs))||1,dys=(Math.max(...ys)-Math.min(...ys))||1,H=o.bh||Math.round(Math.max(130,Math.min(240,2*pad+(W-2*pad)*dys/dxs)));
  let sc,ox,oy;
  if(o.fix){sc=o.fix;ox=o.org[0];oy=o.org[1];}
  else{sc=Math.min((W-2*pad)/((Math.max(...xs)-Math.min(...xs))||1),(H-2*pad)/((Math.max(...ys)-Math.min(...ys))||1));
    ox=(W-sc*(Math.max(...xs)+Math.min(...xs)))/2;oy=(H+sc*(Math.max(...ys)+Math.min(...ys)))/2;}
  const P=pts.map(([x,y])=>[ox+sc*x,oy-sc*y]),G=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Rechtwinkliges Dreieck '+e.join("")+'" style="width:'+(o.w||W)+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  const u=gU(P[n][0]-P[r][0],P[n][1]-P[r][1]),v=gU(P[p][0]-P[r][0],P[p][1]-P[r][1]),ra=o.ra||24,cr=u[0]*v[1]-u[1]*v[0],bi=gU(u[0]+v[0],u[1]+v[1]);
  s+='<path d="M'+P[r][0].toFixed(1)+' '+P[r][1].toFixed(1)+' L'+(P[r][0]+ra*u[0]).toFixed(1)+' '+(P[r][1]+ra*u[1]).toFixed(1)+' A'+ra+' '+ra+' 0 0 '+(cr>0?1:0)+' '+(P[r][0]+ra*v[0]).toFixed(1)+' '+(P[r][1]+ra*v[1]).toFixed(1)+' Z" fill="#e9e9e9" stroke="#000" stroke-width="1.3"/>';
  s+='<circle cx="'+(P[r][0]+9.5*bi[0]).toFixed(1)+'" cy="'+(P[r][1]+9.5*bi[1]).toFixed(1)+'" r="2.8" fill="#000"/>';
  /* wk: [{i:Index der Ecke, t:"α" oder "35°", f:true = oranger Bogen (nur Entdecker/Benennen)}] */
  (o.wk||[]).forEach(w=>{const i=w.i,j=(i+1)%3,k=(i+2)%3,u1=gU(P[j][0]-P[i][0],P[j][1]-P[i][1]),v1=gU(P[k][0]-P[i][0],P[k][1]-P[i][1]);
    const l1=Math.hypot(P[j][0]-P[i][0],P[j][1]-P[i][1]),l2=Math.hypot(P[k][0]-P[i][0],P[k][1]-P[i][1]),rr=Math.min(w.r||32,.4*Math.min(l1,l2));
    const c1=u1[0]*v1[1]-u1[1]*v1[0],b1=gU(u1[0]+v1[0],u1[1]+v1[1]),col=w.f?"#C2410C":"#000";
    s+='<path d="M'+P[i][0].toFixed(1)+' '+P[i][1].toFixed(1)+' L'+(P[i][0]+rr*u1[0]).toFixed(1)+' '+(P[i][1]+rr*u1[1]).toFixed(1)+' A'+rr.toFixed(1)+' '+rr.toFixed(1)+' 0 0 '+(c1>0?1:0)+' '+(P[i][0]+rr*v1[0]).toFixed(1)+' '+(P[i][1]+rr*v1[1]).toFixed(1)+' Z" fill="'+(w.f?"#FBEADF":"#e9e9e9")+'" stroke="'+col+'" stroke-width="'+(w.f?2.6:1.3)+'"/>';
    const ang=Math.acos(Math.max(-1,Math.min(1,u1[0]*v1[0]+u1[1]*v1[1]))),tl=String(w.t||"").length,d=Math.max(rr+12,(tl*4.5+8)/Math.sin(ang/2));
    if(w.t)s+=gT(P[i][0]+d*b1[0],P[i][1]+d*b1[1],w.t,{bold:true,size:16,fill:col});});
  const lab=[];
  for(let k=0;k<3;k++){
    const i=(k+1)%3,j=(k+2)%3,nm=e[k].toLowerCase(),A=P[i],B=P[j],M=[(A[0]+B[0])/2,(A[1]+B[1])/2],d=gU(B[0]-A[0],B[1]-A[1]);
    let nn=[-d[1],d[0]];if((M[0]-G[0])*nn[0]+(M[1]-G[1])*nn[1]<0)nn=[-nn[0],-nn[1]];
    const f=(o.farbe&&o.farbe[nm])||"#000";
    s+='<line class="seite" data-s="'+nm+'" x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" stroke="'+f+'" stroke-width="'+(f==="#000"?3:5)+'" stroke-linecap="round"/>';
    if(o.klick)s+='<line class="hit" data-s="'+nm+'" x1="'+A[0].toFixed(1)+'" y1="'+A[1].toFixed(1)+'" x2="'+B[0].toFixed(1)+'" y2="'+B[1].toFixed(1)+'" stroke="transparent" stroke-width="24" style="cursor:pointer"/>';
    if(o.s!==false){const t=o.s&&o.s[nm]!=null?o.s[nm]:nm;if(t!==""){const off=13+Math.abs(nn[0])*t.length*4.6+Math.abs(nn[1])*6;
      lab.push(gT(M[0]+off*nn[0],M[1]+off*nn[1],t,{it:t.length===1,size:o.fs||16,fill:f==="#000"?"#000":f,bold:f!=="#000"}));}}
  }
  s+=lab.join("");
  for(let k=0;k<3;k++){const q=gU(P[k][0]-G[0],P[k][1]-G[1]);s+=gT(P[k][0]+17*q[0],P[k][1]+17*q[1],e[k],{bold:true,size:17});}
  return s+'</svg>';
}
/* qSvg(a,b): rechtwinkliges Dreieck ABC (A links unten, B rechts unten, rechter Winkel bei C oben) mit Quadraten über allen drei Seiten; feste Größe (1 cm = u px) */
function qSvg(a,b,o){
  o=o||{};const u=o.u||22,c=Math.hypot(a,b),A=[0,0],B=[c,0],C=[b*b/c,a*b/c];
  const sqr=(P,Q)=>{const d=[Q[0]-P[0],Q[1]-P[1]],nn=[d[1],-d[0]];return[P,Q,[Q[0]+nn[0],Q[1]+nn[1]],[P[0]+nn[0],P[1]+nn[1]]];};
  const S={c:sqr(A,B),a:sqr(B,C),b:sqr(C,A)},all=[].concat(S.a,S.b,S.c);
  const mnx=Math.min(...all.map(q=>q[0])),mxx=Math.max(...all.map(q=>q[0])),mny=Math.min(...all.map(q=>q[1])),mxy=Math.max(...all.map(q=>q[1])),pad=24;
  const W=(mxx-mnx)*u+2*pad,H=(mxy-mny)*u+2*pad,X=x=>pad+(x-mnx)*u,Y=y=>pad+(mxy-y)*u,pt=q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);
  let s='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" role="img" aria-label="Quadrate über den Seiten" style="width:'+(o.w||W.toFixed(0))+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  const quad=(Q,f,st,n)=>{let h='<polygon points="'+Q.map(pt).join(" ")+'" fill="'+f+'" stroke="'+st+'" stroke-width="2"/>';
    if(n){const P=Q[0],ux=(Q[1][0]-P[0])/n,uy=(Q[1][1]-P[1])/n,vx=(Q[3][0]-P[0])/n,vy=(Q[3][1]-P[1])/n;
      for(let i=1;i<n;i++){h+='<line x1="'+X(P[0]+i*ux)+'" y1="'+Y(P[1]+i*uy)+'" x2="'+X(P[0]+i*ux+n*vx)+'" y2="'+Y(P[1]+i*uy+n*vy)+'" stroke="#7aa6d6" stroke-width="1"/>';
        h+='<line x1="'+X(P[0]+i*vx)+'" y1="'+Y(P[1]+i*vy)+'" x2="'+X(P[0]+i*vx+n*ux)+'" y2="'+Y(P[1]+i*vy+n*uy)+'" stroke="#7aa6d6" stroke-width="1"/>';}}
    return h;};
  s+=quad(S.c,"#FDE7E7","#C62828",0)+quad(S.a,"#E3EEFB","#1565C0",Number.isInteger(a)?a:0)+quad(S.b,"#E3EEFB","#1565C0",Number.isInteger(b)?b:0);
  s+='<polygon points="'+[A,B,C].map(pt).join(" ")+'" fill="#fff" stroke="#000" stroke-width="3" stroke-linejoin="round"/>';
  const uC=gU(X(A[0])-X(C[0]),Y(A[1])-Y(C[1])),vC=gU(X(B[0])-X(C[0]),Y(B[1])-Y(C[1])),ra=Math.min(15,0.4*Math.min(a,b)*u),bi=gU(uC[0]+vC[0],uC[1]+vC[1]);
  s+='<path d="M'+X(C[0])+' '+Y(C[1])+' L'+(X(C[0])+ra*uC[0])+' '+(Y(C[1])+ra*uC[1])+' A'+ra+' '+ra+' 0 0 0 '+(X(C[0])+ra*vC[0])+' '+(Y(C[1])+ra*vC[1])+' Z" fill="#e9e9e9" stroke="#000" stroke-width="1.2"/><circle cx="'+(X(C[0])+ra*.45*bi[0])+'" cy="'+(Y(C[1])+ra*.45*bi[1])+'" r="2.3" fill="#000"/>';
  const G=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3],mid=(P,Q,t2)=>{const M=[(P[0]+Q[0])/2,(P[1]+Q[1])/2],d=gU(M[0]-G[0],M[1]-G[1]);return gT(X(M[0])-d[0]*12,Y(M[1])+d[1]*12,t2,{it:true,size:16});};
  s+=mid(A,B,"c")+mid(B,C,"a")+mid(C,A,"b");
  const lab=(P,t2)=>{const d=gU(P[0]-G[0],P[1]-G[1]);return gT(X(P[0])+14*d[0],Y(P[1])-14*d[1],t2,{bold:true,size:15});};
  s+=lab(A,"A")+lab(B,"B")+lab(C,"C");
  return s+'</svg>';
}
/* sdSvg(x,y,z): beliebiges Dreieck aus drei Seiten, längste Seite unten; größter Winkel mit Gradzahl im Bogen (bei 90° mit Punkt) */
function sdSvg(x,y,z){
  const L=[x,y,z].sort((p,q)=>p-q),[s1,s2,lg]=L;
  if(!(s1>0)||s1+s2<=lg+1e-9)return '<p style="color:#C62828;font-weight:700">Mit diesen drei Seiten gibt es kein Dreieck.</p>';
  const ax=(lg*lg+s1*s1-s2*s2)/(2*lg),ay=Math.sqrt(Math.max(0,s1*s1-ax*ax));
  const W=340,H=230,pad=34,sc=Math.min((W-2*pad)/lg,(H-2*pad-10)/ay);
  const A=[pad+(W-2*pad-lg*sc)/2,H-pad],B=[A[0]+lg*sc,H-pad],C=[A[0]+ax*sc,H-pad-ay*sc];
  const gam=Math.acos(Math.max(-1,Math.min(1,(s1*s1+s2*s2-lg*lg)/(2*s1*s2))))*180/Math.PI,rund=Math.round(gam*10)/10,recht=Math.abs(rund-90)<0.05;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dreieck aus drei Seiten" style="width:340px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  const u=gU(A[0]-C[0],A[1]-C[1]),v=gU(B[0]-C[0],B[1]-C[1]),bi=gU(u[0]+v[0],u[1]+v[1]),lb=recht?"90°":gZ(rund)+"°";
  const ra=Math.min(0.45*Math.min(s1,s2)*sc,46),tR=ra*0.62;
  s+='<path d="M'+C[0].toFixed(1)+' '+C[1].toFixed(1)+' L'+(C[0]+ra*u[0]).toFixed(1)+' '+(C[1]+ra*u[1]).toFixed(1)+' A'+ra.toFixed(1)+' '+ra.toFixed(1)+' 0 0 0 '+(C[0]+ra*v[0]).toFixed(1)+' '+(C[1]+ra*v[1]).toFixed(1)+' Z" fill="'+(recht?"#E5F4E6":"#e9e9e9")+'" stroke="#000" stroke-width="1.3"/>';
  if(recht)s+='<circle cx="'+(C[0]+8*bi[0]).toFixed(1)+'" cy="'+(C[1]+8*bi[1]).toFixed(1)+'" r="2.6" fill="#000"/>';
  s+=gT(C[0]+(tR+6)*bi[0],C[1]+(tR+6)*bi[1],lb,{size:12,bold:true});
  s+='<polygon points="'+[A,B,C].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(" ")+'" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>';
  s+=gT((A[0]+B[0])/2,H-pad+16,gZ(lg,2)+" cm",{size:14});
  s+=gT((A[0]+C[0])/2-22,(A[1]+C[1])/2-4,gZ(s1,2)+" cm",{size:14})+gT((B[0]+C[0])/2+22,(B[1]+C[1])/2-4,gZ(s2,2)+" cm",{size:14});
  return s+'</svg><p class="summe">Größter Winkel: <b>'+lb+'</b> → '+(recht?'<b style="color:#2e7d32">rechtwinklig</b>':'<b>nicht rechtwinklig</b>')+'</p>';
}
/* gSvg(a,b): rechtwinkliges Dreieck im Kästchenraster (1 Kästchen = 1 cm²), gestricheltes Rechteck aus beiden Katheten */
function gSvg(a,b,o){
  o=o||{};const u=o.u||26,M=o.max||10,pad=30,W=M*u+2*pad,H=M*u+2*pad,X=x=>pad+x*u,Y=y=>H-pad-y*u;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dreieck im Kästchenraster" style="width:'+(o.w||W)+'px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  for(let i=0;i<=M;i++)s+='<line x1="'+X(i)+'" y1="'+Y(0)+'" x2="'+X(i)+'" y2="'+Y(M)+'" stroke="#c9d6e6" stroke-width="1"/><line x1="'+X(0)+'" y1="'+Y(i)+'" x2="'+X(M)+'" y2="'+Y(i)+'" stroke="#c9d6e6" stroke-width="1"/>';
  s+='<rect x="'+X(0)+'" y="'+Y(b)+'" width="'+a*u+'" height="'+b*u+'" fill="#FFF3B0" fill-opacity=".55" stroke="#000" stroke-width="2" stroke-dasharray="7 5"/>';
  s+='<polygon points="'+X(0)+','+Y(0)+' '+X(a)+','+Y(0)+' '+X(0)+','+Y(b)+'" fill="#9ED8BE" stroke="#000" stroke-width="3" stroke-linejoin="round"/>';
  const ra=Math.min(18,0.45*Math.min(a,b)*u);
  s+='<path d="M'+X(0)+' '+Y(0)+' L'+(X(0)+ra)+' '+Y(0)+' A'+ra+' '+ra+' 0 0 0 '+X(0)+' '+(Y(0)-ra)+' Z" fill="#e9e9e9" stroke="#000" stroke-width="1.2"/><circle cx="'+(X(0)+ra*.42)+'" cy="'+(Y(0)-ra*.42)+'" r="2.4" fill="#000"/>';
  s+=gT(X(a/2),Y(0)+15,"a = "+gZ(a)+" cm",{size:15})+gT(X(0)+34,Y(b)-12,"b = "+gZ(b)+" cm",{size:15});
  return s+'</svg>';
}

/* leiterSvg(d): 5 m lange Leiter an einer Wand, Fußabstand d (m), Winkel am Fuß mit orangem Bogen */
function leiterSvg(d){
  const W=400,H=312,yb=272,xw=330,s=50,h=Math.sqrt(25-d*d),F=[xw-d*s,yb],T=[xw,yb-h*s],al=Math.acos(d/5);
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Leiter an einer Wand" style="width:400px;max-width:100%;height:auto;font-family:Arial,sans-serif">';
  o+='<rect x="'+xw+'" y="8" width="26" height="'+(yb-8)+'" fill="#D9D9D9" stroke="#000" stroke-width="2"/>';
  for(let y=16;y<yb;y+=18)o+='<line x1="'+xw+'" y1="'+y+'" x2="'+(xw+26)+'" y2="'+(y+12)+'" stroke="#999" stroke-width="1"/>';
  o+='<line x1="10" y1="'+yb+'" x2="'+(xw+26)+'" y2="'+yb+'" stroke="#000" stroke-width="3"/>';
  const ra=40;o+='<path d="M'+F[0]+' '+F[1]+' L'+(F[0]+ra)+' '+F[1]+' A'+ra+' '+ra+' 0 0 0 '+(F[0]+ra*Math.cos(al)).toFixed(1)+' '+(F[1]-ra*Math.sin(al)).toFixed(1)+' Z" fill="#FBEADF" stroke="#C2410C" stroke-width="2.6"/>';
  const ux=(T[0]-F[0])/5/s,uy=(T[1]-F[1])/5/s,nx=-uy*6,ny=ux*6;
  [-1,1].forEach(z=>{o+='<line x1="'+(F[0]+z*nx).toFixed(1)+'" y1="'+(F[1]+z*ny).toFixed(1)+'" x2="'+(T[0]+z*nx).toFixed(1)+'" y2="'+(T[1]+z*ny).toFixed(1)+'" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round"/>';});
  for(let k=1;k<12;k++){const t=k/12,cx=F[0]+(T[0]-F[0])*t,cy=F[1]+(T[1]-F[1])*t;o+='<line x1="'+(cx-nx).toFixed(1)+'" y1="'+(cy-ny).toFixed(1)+'" x2="'+(cx+nx).toFixed(1)+'" y2="'+(cy+ny).toFixed(1)+'" stroke="#8B5A2B" stroke-width="3"/>';}
  const b=al/2;o+=gT(F[0]+(ra+20)*Math.cos(b),F[1]-(ra+20)*Math.sin(b),Math.round(al*180/Math.PI)+"°",{bold:true,size:15,fill:"#C2410C"});
  o+=gT((F[0]+T[0])/2-24,(F[1]+T[1])/2-8,"5 m",{size:16,bold:true});
  o+='<line x1="'+F[0]+'" y1="'+(yb+14)+'" x2="'+xw+'" y2="'+(yb+14)+'" stroke="#000" stroke-width="1.3"/>'+gT((F[0]+xw)/2,yb+24,"d",{it:true,size:15});
  return o+'</svg>';
}

function binde(B){
  B.querySelectorAll(".wahl,.auswahl").forEach(g=>g.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{

    const upd=()=>{if(z)z.textContent=g.querySelectorAll("i.an").length;g.classList.remove("ok","falsch");};
    const zelle=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===g?el:null;};
    g.addEventListener("pointerdown",e=>{const c=zelle(e);if(!c)return;modus=!c.classList.contains("an");c.classList.toggle("an",modus);g.setPointerCapture(e.pointerId);e.preventDefault();upd();});
    g.addEventListener("pointermove",e=>{if(modus===null)return;const c=zelle(e);if(c&&c.classList.contains("an")!==modus){c.classList.toggle("an",modus);upd();}});
    ["pointerup","pointercancel"].forEach(n=>g.addEventListener(n,()=>modus=null));
  });
  B.querySelectorAll(".zuo").forEach(Z=>{
    let gew=null;
    const farbe=()=>{const L=[...Z.querySelectorAll('[data-s="l"]')];let k=0;
      Z.querySelectorAll("button").forEach(b=>{delete b.dataset.p;delete b.dataset.nr;b.classList.remove("ok","falsch");});
      L.forEach(l=>{if(l.dataset.mit!=null&&l.dataset.mit!==""){const r=Z.querySelector('[data-s="r"][data-i="'+l.dataset.mit+'"]');
        l.dataset.p=r.dataset.p=k%8;l.dataset.nr=r.dataset.nr=++k;}});};
    Z.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const seite=b.dataset.s;
      // schon verbunden → lösen
      if(seite==="l"&&b.dataset.mit){b.dataset.mit="";gew=null;Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));farbe();return;}
      if(seite==="r"){const l=Z.querySelector('[data-s="l"][data-mit="'+b.dataset.i+'"]');if(l&&!(gew&&gew.dataset.s==="l")){l.dataset.mit="";farbe();return;}}
      if(!gew||gew.dataset.s===seite){Z.querySelectorAll(".wahl1").forEach(x=>x.classList.remove("wahl1"));gew=b;b.classList.add("wahl1");return;}
      const l=seite==="l"?b:gew,r=seite==="r"?b:gew;
      Z.querySelectorAll('[data-s="l"]').forEach(x=>{if(x.dataset.mit===r.dataset.i)x.dataset.mit="";});
      l.dataset.mit=r.dataset.i;gew.classList.remove("wahl1");gew=null;farbe();
    }));

  B.querySelectorAll(".sort").forEach(S=>{

    const zeig=()=>{S.querySelectorAll("button").forEach(b=>{const p=reihe.indexOf(b);b.classList.remove("ok","falsch");if(p<0)delete b.dataset.nr;else b.dataset.nr=p+1;});
      txt.innerHTML=reihe.length?"Deine Reihenfolge: "+reihe.map(b=>b.innerHTML).join(esc(S.dataset.sep||" < ")):"";};
    S._reihe=reihe;
    S.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const p=reihe.indexOf(b);if(p<0)reihe.push(b);else reihe.splice(p,1);zeig();}));
  });
  B.querySelectorAll(".live").forEach(L=>{const T=L.closest(".innen");
    const upd=()=>{const R=[...T.querySelectorAll("tr[data-n]")];const namen=R.map(r=>r.dataset.n);
      const v=R.map(r=>{const x=num(r.querySelector("input").value);return isNaN(x)||x<0?0:x;});
      if(L.dataset.typ==="streifen")L.innerHTML=streifenSvg(namen,v,{live:true});
      else{const s=v.reduce((p,q)=>p+q,0);L.innerHTML=kreisSvg(namen,v)+'<p class="summe">Summe der Winkel: <b>'+dZ(s)+'</b>° '+(Math.abs(s-360)<1e-9?"✓":"(soll 360° sein)")+'</p>';}};
    T.addEventListener("input",upd);upd();});
  B.querySelectorAll(".pyth").forEach(P=>{const m=P.dataset.m,bild=P.querySelector(".pbild");
    const upd=()=>{
      if(m==="pruefer"){const v=[...P.querySelectorAll(".pin")].map(i=>num(i.value));bild.innerHTML=v.every(x=>x>0)?sdSvg(v[0],v[1],v[2]):'<p class="summe">Gib drei Seitenlängen ein.</p>';return;}
      const g={};P.querySelectorAll('input[type="range"]').forEach(r=>{g[r.dataset.k]=+r.value;P.querySelector('[data-z="'+r.dataset.k+'"]').textContent=dZ(+r.value);});

      else if(m==="raster")bild.innerHTML=gSvg(g.a,g.b);
      else{const c=Math.hypot(g.a,g.b),gl=Math.abs(c*10-Math.round(c*10))<1e-9;
        bild.innerHTML=rtSvg({e:["A","B","C"],r:2,L:[g.b,g.a],fix:25,org:[45,250],bw:450,bh:290,ra:20,s:{a:"a = "+gZ(g.a)+" cm",b:"b = "+gZ(g.b)+" cm",c:"c "+(gl?"=":"≈")+" "+gZ(c)+" cm"},farbe:{c:"#C62828"},w:400});}
    };

function svgBild(svg,r){
  var k=svg.cloneNode(true),a=[svg].concat([].slice.call(svg.querySelectorAll("*"))),b=[k].concat([].slice.call(k.querySelectorAll("*")));
  a.forEach(function(el,i){var s=getComputedStyle(el),t="";SVGPROPS.forEach(function(p){var v=s.getPropertyValue(p);if(v)t+=p+":"+v+";";});
    b[i].setAttribute("style",t+(b[i].getAttribute("style")||""));});
  k.setAttribute("xmlns","http://www.w3.org/2000/svg");k.setAttribute("width",r.width);k.setAttribute("height",r.height);
  var url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(k));
  return new Promise(function(ok){var im=new Image();im.onload=function(){ok(im);};im.onerror=function(){ok(null);};im.src=url;});
}

function malen(B){
  var R=B.getBoundingClientRect(),PAD=16,KOPF=30,W=Math.ceil(R.width)+2*PAD,
      fuss=document.getElementById("fuss"),FH=fuss?28:0,H=Math.ceil(R.height)+2*PAD+KOPF+FH;
  var sk=Math.min(2,Math.sqrt(15e6/(W*H)));
  var c=document.createElement("canvas");c.width=Math.round(W*sk);c.height=Math.round(H*sk);
  var g=c.getContext("2d");g.scale(sk,sk);g.fillStyle="#fff";g.fillRect(0,0,W,H);
  var ox=PAD-R.left,oy=PAD+KOPF-R.top,jobs=[],nachher=[];
  /* Kopfzeile */
  var kl=/klasse7/.test(location.pathname)?"7":"10",d=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  g.font="13px Arial, sans-serif";g.fillStyle="#555";g.textBaseline="middle";g.textAlign="left";
  g.fillText("EMIL-PETRI-SCHULE ARNSTADT · Mathematik Klasse "+kl,PAD,PAD+10);
  g.textAlign="right";var st=document.getElementById("stand");
  g.fillText((st?st.textContent+"   ·   ":"")+"Datum: "+d,W-PAD,PAD+10);g.textAlign="left";

  function rahmen(r,s){
    var bt=px(s.borderTopWidth),br=px(s.borderRightWidth),bb=px(s.borderBottomWidth),bl=px(s.borderLeftWidth),x=r.left+ox,y=r.top+oy;
    var dash=s.borderTopStyle==="dashed";
    function seite(w,col,stil,x1,y1,ww,hh){if(w>0&&stil!=="none"&&stil!=="hidden"&&farbe(col)){g.fillStyle=col;
      if(dash){g.save();g.beginPath();g.rect(x1,y1,ww,hh);g.clip();for(var i=0;i<Math.max(ww,hh);i+=6){g.fillRect(ww>hh?x1+i:x1,ww>hh?y1:y1+i,ww>hh?3:ww,ww>hh?hh:3);}g.restore();}
      else g.fillRect(x1,y1,ww,hh);}}
    seite(bt,s.borderTopColor,s.borderTopStyle,x,y,r.width,bt);
    seite(bb,s.borderBottomColor,s.borderBottomStyle,x,y+r.height-bb,r.width,bb);
    seite(bl,s.borderLeftColor,s.borderLeftStyle,x,y,bl,r.height);
    seite(br,s.borderRightColor,s.borderRightStyle,x+r.width-br,y,br,r.height);
    if(s.outlineStyle!=="none"&&px(s.outlineWidth)>0&&farbe(s.outlineColor)){var o=px(s.outlineWidth),off=px(s.outlineOffset);
      g.strokeStyle=s.outlineColor;g.lineWidth=o;g.strokeRect(x-off-o/2,y-off-o/2,r.width+2*off+o,r.height+2*off+o);}
  }
  function rund(x,y,w,h,rr){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,rr);else g.rect(x,y,w,h);}
  function pseudo(el,r,wo,letzt){
    var s=getComputedStyle(el,wo),ct=s.content;if(!ct||ct==="none"||ct==="normal")return;
    var txt=ct.replace(/^["']|["']$/g,"");
    if(/^attr\(/.test(ct)){var m=ct.match(/attr\(([^)]+)\)/);txt=m?el.getAttribute(m[1])||"":"";}
    if(!txt.trim())return;
    g.font=schrift(s);
    if(s.position==="absolute"){
      var fs=px(s.fontSize),lh=px(s.lineHeight)||fs*1.5,w=Math.max(px(s.minWidth),g.measureText(txt).width+4),
          x=r.left+ox+px(s.left),y=r.top+oy+px(s.top);
      if(farbe(s.backgroundColor)){g.fillStyle=s.backgroundColor;rund(x,y,w,lh,lh/2);g.fill();}
      g.fillStyle=s.color;g.textAlign="center";g.textBaseline="middle";g.fillText(txt,x+w/2,y+lh/2);g.textAlign="left";
    }else{
      var p=letzt||{x:r.left+r.width/2,y:r.top+r.height/2};
      g.fillStyle=s.color;g.textBaseline="middle";g.fillText(txt,(wo==="::after"?p.x:r.left)+ox,p.y+oy);
    }
  }
  function eingabe(el,r,s){
    if(el.type==="range"){var mi=px(el.min),ma=px(el.max)||100,v=(px(el.value)-mi)/(ma-mi||1),y=r.top+oy+r.height/2,x=r.left+ox;
      g.fillStyle="#cfd8d6";g.fillRect(x+6,y-3,r.width-12,6);g.fillStyle="#00805F";g.fillRect(x+6,y-3,(r.width-12)*v,6);
      g.beginPath();g.arc(x+6+(r.width-12)*v,y,8,0,7);g.fill();return;}
    if(el.type==="checkbox"||el.type==="radio"){if(el.checked){g.fillStyle="#00805F";g.font="bold 14px Arial";g.textBaseline="middle";g.fillText("✓",r.left+ox+2,r.top+oy+r.height/2);}return;}
    var t=el.value;if(!t)return;
    var pl=px(s.paddingLeft)+px(s.borderLeftWidth)+2,pr=px(s.paddingRight)+px(s.borderRightWidth)+2,brt=r.width-pl-pr,fs=px(s.fontSize);
    g.font=schrift(s);var w=g.measureText(t).width;
    if(w>brt){fs=Math.max(fs*0.6,fs*brt/w);g.font=s.fontStyle+" "+s.fontWeight+" "+fs+"px "+s.fontFamily;w=g.measureText(t).width;}
    g.save();g.beginPath();g.rect(r.left+ox+1,r.top+oy,r.width-2,r.height);g.clip();
    g.fillStyle=s.color;g.textBaseline="middle";
    var x=s.textAlign==="center"?r.left+ox+r.width/2-Math.min(w,brt)/2:r.left+ox+pl;
    g.fillText(t,x,r.top+oy+r.height/2+1);g.restore();
  }
  function text(n){
    var el=n.parentElement,s=getComputedStyle(el),t=n.nodeValue,re=/\S+/g,m,rg=document.createRange(),letzt=null;
    g.font=schrift(s);g.fillStyle=s.color;g.textBaseline="middle";g.textAlign="left";
    var up=s.textTransform==="uppercase";
    while((m=re.exec(t))){rg.setStart(n,m.index);rg.setEnd(n,m.index+m[0].length);
      var rs=rg.getClientRects();if(!rs.length)continue;
      var w=up?m[0].toUpperCase():m[0];
      if(rs.length===1){var q=rs[0];g.fillText(w,q.left+ox,q.top+q.height/2+oy);letzt={x:q.right,y:q.top+q.height/2};}
      else{ /* Wort über Zeilenumbruch (z. B. Bindestrich) – Zeichen einzeln */
        for(var i=0;i<m[0].length;i++){rg.setStart(n,m.index+i);rg.setEnd(n,m.index+i+1);var z=rg.getClientRects()[0];
          if(z){g.fillText(w[i],z.left+ox,z.top+z.height/2+oy);letzt={x:z.right,y:z.top+z.height/2};}}}
    }
    return letzt;
  }
  function knoten(el){
    if(el.nodeType===3){return el.nodeValue.trim()?text(el):null;}
    if(el.nodeType!==1)return null;
    if(el.matches&&el.matches(SKIP))return null;
    var s=getComputedStyle(el);if(s.display==="none"||s.visibility==="hidden")return null;
    var r=el.getBoundingClientRect();
    if(el.namespaceURI==="http://www.w3.org/2000/svg"){
      if(el.tagName.toLowerCase()==="svg"&&r.width>0){var x=r.left+ox,y=r.top+oy,ww=r.width,hh=r.height;
        jobs.push(svgBild(el,r).then(function(im){if(im)nachher.push(function(){g.drawImage(im,x,y,ww,hh);});}));
        nachher.push(null);}
      return null;}
    if(farbe(s.backgroundColor)){g.fillStyle=s.backgroundColor;var rad=px(s.borderTopLeftRadius);
      if(rad>0){rund(r.left+ox,r.top+oy,r.width,r.height,Math.min(rad,r.height/2));g.fill();}else g.fillRect(r.left+ox,r.top+oy,r.width,r.height);}
    rahmen(r,s);
    if(el.tagName==="INPUT"){eingabe(el,r,s);return null;}
    if(el.tagName==="TEXTAREA"){eingabe(el,r,s);return null;}
    pseudo(el,r,"::before");
    var letzt=null;
    for(var k=el.firstChild;k;k=k.nextSibling){var l=knoten(k);if(l)letzt=l;}
    pseudo(el,r,"::after",letzt);
    return letzt;
  }
  knoten(B);
  if(fuss){var fs=getComputedStyle(fuss);g.font=schrift(fs);g.fillStyle=fs.color;g.textAlign="right";g.textBaseline="middle";
    g.fillText(fuss.textContent,W-PAD,H-PAD-FH/2+6);g.textAlign="left";}
  /* SVGs nachträglich – aber in richtiger Reihenfolge über ihren Hintergrund */
  return Promise.all(jobs).then(function(){nachher.forEach(function(f){if(f)f();});return c;});
}

function alsBlob(c){return new Promise(function(ok,nein){c.toBlob(function(b){b?ok(b):nein(new Error("kein Bild"));},"image/png");});}

/* Ersatzweg: Bild im Fenster zeigen (lange antippen / Rechtsklick → Kopieren) */
var pop=document.createElement("div");pop.className="od-pop";pop.hidden=true;
pop.innerHTML='<div class="od-box od-bildbox" role="dialog" aria-modal="true" aria-label="Kopie des Blattes"><h2>Bild kopieren</h2><div class="od-innen"><p>Tippe das Bild lange an (am Computer: Rechtsklick) und wähle <b>„Kopieren“</b>. Dann in OneNote einfügen.</p><img alt="Kopie des Blattes"><div class="od-leiste"><button type="button" class="knopf">Schließen</button></div></div></div>';
document.body.appendChild(pop);
function popZu(){pop.hidden=true;document.body.style.overflow="";}
pop.querySelector("button").addEventListener("click",popZu);pop.addEventListener("click",function(e){if(e.target===pop)popZu();});
function zeigeBild(c){pop.querySelector("img").src=c.toDataURL("image/png");pop.hidden=false;document.body.style.overflow="hidden";}

var tm=null;
function meld(t,ok){kb.innerHTML=t;kb.classList.toggle("od-ok",!!ok);clearTimeout(tm);tm=setTimeout(function(){kb.innerHTML=KTXT;kb.classList.remove("od-ok");},2600);}
kb.addEventListener("click",function(){
  var B=document.querySelector(".blatt:not([hidden])");if(!B)return;
  if(document.activeElement&&document.activeElement!==kb)document.activeElement.blur();
  var bild=malen(B);
  var fehler=function(){bild.then(zeigeBild);};
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      /* Safari braucht das Versprechen direkt im Klick */
      navigator.clipboard.write([new ClipboardItem({"image/png":bild.then(alsBlob)})])
        .then(function(){meld("✓ Kopiert – jetzt in OneNote einfügen",true);}).catch(fehler);
    }else fehler();
  }catch(e){fehler();}
});
})();
